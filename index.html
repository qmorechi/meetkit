                      const pad = n => String(n).padStart(2, '0');
                      return (
                        <>
                          <div style={{ fontSize: 13, color: C.textSec, marginBottom: 8 }}>總會議時長</div>
                          <div style={{ fontSize: 32, fontWeight: 700, color: C.success, marginBottom: 24, fontVariantNumeric: 'tabular-nums' }}>
                            {pad(h)}:{pad(m2)}:{pad(s2)}
                          </div>
                        </>
                      );
                    })()}
                    <button
                      style={{ ...btn('primary'), width: '100%', padding: 13, fontSize: 14, marginBottom: 10 }}
                      onClick={() => setPhase(2)}
                    >
                      前往會後整理 →
                    </button>
                    <button
                      style={{ ...btn('ghost'), width: '100%', padding: 10, fontSize: 13 }}
                      onClick={openNewRound}
                    >
                      ↺ 開新一場會議
                    </button>
                  </div>
                </div>
              )}
              {(recordingState === 'preparing' || recordingState === 'paused') && (
                <div style={{ ...S.card, padding: '12px 14px', fontSize: 13, color: C.textSec, background: C.textSec + '11', borderColor: C.textSec + '33', lineHeight: 1.7 }}>
                  💡 點選左側議程可標記目前討論中的項目。
                </div>
              )}
            </div>
          </div>
          </div>
          {recordingState === 'unconfirmed' && (
            <RecordingConfirmModal onConfirm={confirmRecording} onCancel={cancelMeeting} />
          )}
          {recordingState === 'pending_pause_confirm' && (
            <PauseConfirmModal
              currentSegmentStart={currentSegmentStart}
              onConfirm={confirmPause}
            />
          )}
        </>
      );
    }

    // ─── BLOCKING MODAL (通用攔截 Modal) ─────────────────────────────────────────
    // 未來任何頁面需要「阻擋使用者互動直到完成某個動作」都可以重用
    // ─────────────────────────────────────────────────────────────────────────────

    function BlockingModal({ show, children }) {
      if (!show) return null;
      return (
        <div style={{
          position: 'fixed', inset: 0, zIndex: 1000,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          animation: 'fadeIn 0.3s ease',
        }}>
          <div style={{
            position: 'absolute', inset: 0,
            background: '#DC2626', opacity: 0.45, mixBlendMode: 'multiply',
          }} />
          <div style={{ position: 'relative', zIndex: 10 }}>
            {children}
          </div>
        </div>
      );
    }

    // ─── RECORDING CONFIRM MODAL (會議錄音確認) ───────────────────────────────────

    function RecordingConfirmModal({ onConfirm, onCancel }) {
      const qrRef = useRef();
      useEffect(() => {
        if (typeof QRCode === 'undefined' || !qrRef.current) return;
        qrRef.current.innerHTML = '';
        new QRCode(qrRef.current, {
          text: 'https://qmorechi.github.io/meetkit/open-voicememos.html',
          width: 120, height: 120,
          colorDark: '#000000', colorLight: '#ffffff',
        });
      }, []);

      return (
        <BlockingModal show={true}>
          <div style={{
            background: C.bgCard, border: `1px solid ${C.border}`,
            borderRadius: 12, padding: '32px 36px', maxWidth: 460,
            boxShadow: '0 20px 60px rgba(0,0,0,0.5)',
          }}>
            <div style={{ fontSize: 22, fontWeight: 700, marginBottom: 20, textAlign: 'center' }}>
              🎙 會議錄音
            </div>

            {/* QR Code 區塊 */}
            <div style={{ display: 'flex', gap: 20, alignItems: 'center', marginBottom: 24, padding: '16px', background: C.bg, borderRadius: 10, border: `1px solid ${C.border}` }}>
              <div ref={qrRef} style={{ width: 120, height: 120, flexShrink: 0, borderRadius: 6, overflow: 'hidden', background: '#fff' }} />
              <div>
                <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 4 }}>📱 掃描開啟語音備忘錄</div>
                <div style={{ fontSize: 12, color: C.textSec, lineHeight: 1.7 }}>
                  用 iPhone 相機掃描 QR Code，直接跳到語音備忘錄 app，按下錄音後回到這裡確認。
                </div>
                <div style={{ fontSize: 11, color: C.textMut, marginTop: 6 }}>
                  💡 手機快沒電？把畫面給旁邊的人掃。
                </div>
              </div>
            </div>

            <button
              style={{ ...btn('primary'), width: '100%', padding: 14, fontSize: 15 }}
              onClick={onConfirm}
            >
              ✓ 已確認開始錄音
            </button>
            <div style={{ textAlign: 'center', marginTop: 16 }}>
              <a
                onClick={onCancel}
                style={{ fontSize: 12, color: C.textMut, textDecoration: 'underline', cursor: 'pointer' }}
              >
                ← 取消，不開這場會議
              </a>
            </div>
          </div>
        </BlockingModal>
      );
    }

    // ─── MEETING TIMER (純計時器，不錄音) ────────────────────────────────────────

    // MeetingTimer：顯示「歷史段落累積 + 目前這段」的總時間
    // accumulatedSeconds：前幾段的秒數加總
    // currentSegmentStart：這一段的開始時間（Date）
    // onRequestPause：使用者按「結束這段」時觸發，進入 pending_pause_confirm
    function MeetingTimer({ accumulatedSeconds, currentSegmentStart, onRequestPause }) {
      const [currentSec, setCurrentSec] = useState(0);
      useEffect(() => {
        const tick = () => setCurrentSec(Math.floor((Date.now() - currentSegmentStart.getTime()) / 1000));
        tick();
        const id = setInterval(tick, 1000);
        return () => clearInterval(id);
      }, [currentSegmentStart]);

      // 總時間 = 歷史累積 + 本段已過秒數
      const total = accumulatedSeconds + currentSec;
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60);
      const s = total % 60;
      const pad = n => String(n).padStart(2, '0');

      return (
        <div style={S.panel} className="fade-in">
          <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 20 }}>⏱ 會議進行中</div>
          <div style={{ textAlign: 'center', padding: '16px 0' }}>
            <div style={{
              fontSize: 42, fontWeight: 700, color: C.accent, marginBottom: 24,
              fontVariantNumeric: 'tabular-nums', letterSpacing: '0.05em',
            }}>
              {pad(h)}:{pad(m)}:{pad(s)}
            </div>
            <div style={{ color: C.textSec, fontSize: 13, marginBottom: 20 }}>
              記得 iPhone 繼續錄音中
            </div>
            <button
              style={{ ...btn('danger'), width: '100%', padding: 13, fontSize: 15 }}
              onClick={onRequestPause}
            >
              ⏹ 結束這段
            </button>
          </div>
        </div>
      );
    }

    // ─── PAUSE CONFIRM MODAL (確認 iPhone 已停止錄音 — 暫停這段) ─────────────────
    // 每段結束時的對稱防呆：確保使用者去 iPhone 按停止錄音，再進入 paused 狀態
    // 綠色覆蓋層，對稱於開會前的紅色 RecordingConfirmModal
    // ─────────────────────────────────────────────────────────────────────────────

    function PauseConfirmModal({ currentSegmentStart, onConfirm }) {
      // 計算這段已過多少秒（快照，不即時更新）
      const segmentSec = Math.floor((Date.now() - currentSegmentStart.getTime()) / 1000);
      const h = Math.floor(segmentSec / 3600);
      const m = Math.floor((segmentSec % 3600) / 60);
      const s = segmentSec % 60;
      const pad = n => String(n).padStart(2, '0');

      const handleNotYet = () => {
        alert('請打開 iPhone 的「語音備忘錄」按下停止錄音，完成後回到這裡按「✓ 已關閉錄音」');
      };

      return (
        <div style={{
          position: 'fixed', inset: 0, zIndex: 1000,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          animation: 'fadeIn 0.3s ease',
        }}>
          <div style={{
            position: 'absolute', inset: 0,
            background: '#22C55E', opacity: 0.45, mixBlendMode: 'multiply',
          }} />
          <div style={{
            position: 'relative', zIndex: 10,
            background: C.bgCard, border: `1px solid ${C.border}`,
            borderRadius: 12, padding: '32px 36px', maxWidth: 460,
            boxShadow: '0 20px 60px rgba(0,0,0,0.5)',
          }}>
            <div style={{ fontSize: 22, fontWeight: 700, marginBottom: 16, textAlign: 'center' }}>
              ⏸ 這段結束
            </div>
            <div style={{ fontSize: 13, color: C.textMut, marginBottom: 6, textAlign: 'center' }}>
              這段時長
            </div>
            <div style={{
              fontSize: 32, fontWeight: 700, color: C.success,
              marginBottom: 24, textAlign: 'center', fontVariantNumeric: 'tabular-nums',
            }}>
              {pad(h)}:{pad(m)}:{pad(s)}
            </div>
            <div style={{ fontSize: 15, lineHeight: 1.8, color: C.textSec, marginBottom: 12, textAlign: 'center' }}>
              📱 請打開 iPhone「語音備忘錄」<br />
              按下停止錄音
            </div>
            <div style={{ fontSize: 12, color: C.textMut, textAlign: 'center', marginBottom: 20, lineHeight: 1.6 }}>
              會議完全結束了嗎？還是只是暫停？<br />
              稍後可以續開新一段
            </div>
            <div style={{
              fontSize: 12, color: C.textMut, lineHeight: 1.6, marginBottom: 24,
              padding: '10px 14px', background: C.dangerBg, borderRadius: 6,
              border: `1px solid ${C.danger}33`,
            }}>
              ⚠️ 沒關掉的話，這段音檔會多很多空白
            </div>
            <button
              style={{ ...btn('primary'), width: '100%', padding: 14, fontSize: 15 }}
              onClick={onConfirm}
            >
              ✓ 已關閉錄音
            </button>
            <div style={{ textAlign: 'center', marginTop: 16 }}>
              <a
                onClick={handleNotYet}
                style={{ fontSize: 12, color: C.textMut, textDecoration: 'underline', cursor: 'pointer' }}
              >
                ← 還沒，讓我去按一下
              </a>
            </div>
          </div>
        </div>
      );
    }

    // ─── PAUSED PANEL (暫停狀態的右側面板) ────────────────────────────────────
    // 顯示在 paused 狀態，讓使用者選擇「續開新一段」或「整場會議完全結束」
    // ─────────────────────────────────────────────────────────────────────────────

    function PausedPanel({ accumulatedSeconds, segmentCount, onContinue, onGoToPostMeeting }) {
      const h = Math.floor(accumulatedSeconds / 3600);
      const m = Math.floor((accumulatedSeconds % 3600) / 60);
      const s = accumulatedSeconds % 60;
      const pad = n => String(n).padStart(2, '0');

      return (
        <div style={S.panel} className="fade-in">
          <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 20 }}>⏸ 已暫停</div>
          <div style={{ textAlign: 'center', padding: '8px 0 16px' }}>
            <div style={{ fontSize: 12, color: C.textMut, marginBottom: 4 }}>
              已累積（{segmentCount} 段）
            </div>
            <div style={{
              fontSize: 36, fontWeight: 700, color: C.textSec,
              marginBottom: 24, fontVariantNumeric: 'tabular-nums', letterSpacing: '0.05em',
            }}>
              {pad(h)}:{pad(m)}:{pad(s)}
            </div>
            <button
              style={{ ...btn('primary'), width: '100%', padding: 13, fontSize: 14, marginBottom: 10 }}
              onClick={onContinue}
            >
              ↻ 繼續開新一段
            </button>
            <button
              style={{ ...btn('ghost'), width: '100%', padding: 11, fontSize: 13 }}
              onClick={onGoToPostMeeting}
            >
              前往會後整理 →
            </button>
          </div>
          <div style={{
            fontSize: 11, color: C.textMut, lineHeight: 1.6, marginTop: 4,
            padding: '10px 12px', background: C.textSec + '08',
            borderRadius: 6, border: `1px solid ${C.border}`,
          }}>
            💡 如果還有事情要討論，點「繼續開新一段」可以開新的錄音段。會後上傳時記得上傳所有段的音檔。
          </div>
        </div>
      );
    }

    // ─── POST-MEETING ────────────────────────────────────────────────────────────
    function PostMeeting({ proposals, audioBlob, onSaveJournal, projectId, projectTitle }) {
      const [openaiKey,    setOpenaiKey]    = useState(() => localStorage.getItem('mk_openai_key') || '');
      const [anthropicKey, setAnthropicKey] = useState(() => localStorage.getItem('mk_anthropic_key') || '');

      // 從 Supabase config 表自動載入公用 API Key
      useEffect(() => {
        db('config?select=key,value')
          .then(r => r.json())
          .then(data => {
            if (!Array.isArray(data)) return;
            data.forEach(row => {
              if (row.key === 'openai_api_key' && row.value) {
                setOpenaiKey(row.value);
                localStorage.setItem('mk_openai_key', row.value);
              }
              if (row.key === 'anthropic_api_key' && row.value) {
                setAnthropicKey(row.value);
                localStorage.setItem('mk_anthropic_key', row.value);
              }
            });
          }).catch(() => {});
      }, []);
      const [uploadFile,   setUploadFile]   = useState(null);
      const [status,       setStatus]       = useState('idle');
      const [transcript,   setTranscript]   = useState('');
      const [summary,      setSummary]      = useState('');
      const [errMsg,       setErrMsg]       = useState('');
      const [whisperInfo,  setWhisperInfo]  = useState(null);
      const [archiving,        setArchiving]        = useState(false);
      const [archiveSteps,     setArchiveSteps]     = useState([]);
      const [compressProgress, setCompressProgress] = useState(0);
      const [segmentProgress,  setSegmentProgress]  = useState(0);
      const [uploadProgress,   setUploadProgress]   = useState(0);
      const [segmentCount,     setSegmentCount]     = useState(0);
      const [failedSegments,   setFailedSegments]   = useState([]);
      const fileRef = useRef();
      const audioSrc = uploadFile || audioBlob;

      const getAudioDuration = (blob) => new Promise(resolve => {
        const a = new Audio(); a.src = URL.createObjectURL(blob);
        a.onloadedmetadata = () => { URL.revokeObjectURL(a.src); resolve(a.duration || 0); };
        a.onerror = () => resolve(0);
      });

      const run = async () => {
        if (!openaiKey.trim()) { setErrMsg('請輸入 OpenAI API Key'); return; }
        if (!audioSrc) { setErrMsg('請先上傳 iPhone 錄音檔'); return; }
        if ((audioSrc.size || 0) > AUDIO_CONFIG.maxFileSizeMB * 1024 * 1024) {
          setErrMsg(`檔案過大，請上傳 ${AUDIO_CONFIG.maxFileSizeMB} MB 以內的音檔`); return;
        }
        setErrMsg('');
        setCompressProgress(0); setSegmentProgress(0); setUploadProgress(0); setFailedSegments([]);
        let txText = '';

        try {
          // ── 階段 1：壓縮 ──────────────────────────────────────────────────
          setStatus('compressing');
          const compressed = await compressAudio(audioSrc, p => setCompressProgress(p));

          // ── 階段 2：取得時長 + 靜音切段 ──────────────────────────────────
          setStatus('segmenting');
          const duration = await getAudioDuration(audioSrc);
          let segs;
          try {
            // 加 15 秒 timeout，ffmpeg 無法使用時直接跳過
            const segResult = await Promise.race([
              (async () => {
                const boundaries = await calculateSegmentBoundaries(compressed, duration);
                return await segmentAudio(compressed, boundaries, p => setSegmentProgress(p));
              })(),
              new Promise((_, reject) => setTimeout(() => reject(new Error('segmentation timeout')), 15000)),
            ]);
            segs = segResult;
          } catch (e) {
            console.warn('切段失敗，改用原始檔案作為單一段落：', e.message);
            // fallback：整個音檔當一段直接送 Whisper
            segs = [{ index: 0, blob: compressed, startSec: 0, durationSec: duration }];
          }
          setSegmentProgress(1);
          setSegmentCount(segs.length);

          // ── 階段 3：並行上傳 Whisper ──────────────────────────────────────
          setStatus('transcribing');
          const transcripts = await transcribeAllSegments(segs, openaiKey.trim(), p => setUploadProgress(p));
          const failed = transcripts.filter(t => t.error);
          if (failed.length > 0) setFailedSegments(failed);

          // ── 階段 4：合併逐字稿 ────────────────────────────────────────────
          const { fullText } = mergeTranscripts(transcripts);
          txText = fullText;
          setTranscript(txText);
          const mins = Math.ceil(duration / 60) || 1;
          setWhisperInfo({ mins, cost: (mins * 0.006).toFixed(3) });
        } catch (e) { setErrMsg('處理失敗：' + e.message); setStatus('error'); return; }

        // ── 階段 5：AI 摘要 ───────────────────────────────────────────────
        setStatus('summarizing');
        // 抽取每個提案的附件文字
        const proposalsWithText = await Promise.all(proposals.map(async (p) => {
          let attachText = '';
          try {
            const urls = JSON.parse(p.file_url || '[]');
            const names = JSON.parse(p.file_name || '[]');
            const texts = await Promise.all(urls.map((url, i) => extractFileText(url, names[i] || url)));
            attachText = texts.filter(Boolean).join('\n');
          } catch {}
          return { ...p, attachText };
        }));
        const agendaDetail = proposalsWithText.length
          ? proposalsWithText.map((p, i) => {
              const base = `${i + 1}. 【${p.title}】提案人：${p.author}\n   ${p.content || '（無提案說明）'}`;
              return p.attachText ? `${base}\n\n   【附件內容摘錄】\n${p.attachText.slice(0, 3000)}` : base;
            }).join('\n\n')
          : '（無提案議程）';
        const prompt = `你是一位專業的會議記錄與策略分析師。以下是一場會議的完整逐字稿與議程提案，請用繁體中文產出一份結構完整的會後文件。

━━━ 本次議程提案 ━━━
${agendaDetail}

━━━ 會議逐字稿 ━━━
${txText}

━━━ 請依照以下格式輸出 ━━━

# 📋 各提案分析

（針對每一個提案，依下列結構整理）

## 提案 N：{提案標題}（{提案人}）

### 核心想法
（一段話說明提案人的核心主張）

### 會議 Findings
- **支持點：** （與會者認同的觀點、正面回饋）
- **疑慮與挑戰：** （提出的問題、擔憂、障礙）

### 可行性評估
- **執行面：** （技術、流程、人力的可行度）
- **資源需求：** （時間、預算、工具）
- **風險：** （潛在風險與不確定因素）

### 結論
（本次討論的共識或未解決的分歧）

---

# ✅ 待辦事項清單

（整合會議中、會議後提出的所有待辦，含會議討論中臨時提出的項目）

| 事項 | 負責人 | 建議完成時間 | 優先度 |
|------|--------|------------|--------|
（用表格列出，優先度分：🔴 緊急 / 🟡 本週 / 🟢 下週前）

---

# 📌 下次會議前情提要

## 背景摘要
（給未出席者或下次會議開場用的 2-3 段精簡說明，讓所有人快速進入狀況）

## 尚待確認的問題
（列出本次未解決、需要在下次會議前釐清的關鍵問題）

## 建議各方提前準備
（針對各提案負責人，建議下次會議前應準備的資料或評估）

---

# 💡 AI 綜合建議

（根據整體會議內容，提出 3-5 點具體可行的策略建議，包含優先順序推薦與注意事項）`;
        try {
          let summaryText = '';
          // 優先嘗試 Anthropic，失敗（含 CORS）自動 fallback 到 GPT-4o
          let usedEngine = 'gpt-4o';
          if (anthropicKey.trim()) {
            try {
              const res = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: {
                  'x-api-key': anthropicKey.trim(),
                  'anthropic-version': '2023-06-01',
                  'anthropic-dangerous-request-allow-browsers': 'true',
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({ model: 'claude-opus-4-5', max_tokens: 4096, messages: [{ role: 'user', content: prompt }] }),
              });
              if (!res.ok) { const e = await res.json(); throw new Error(e.error?.message || `HTTP ${res.status}`); }
              summaryText = (await res.json()).content[0].text;
              usedEngine = 'claude';
            } catch (anthropicErr) {
              console.warn('Anthropic 摘要失敗，改用 GPT-4o：', anthropicErr.message);
              // fallback 到 GPT-4o
            }
          }
          if (!summaryText) {
            const res = await fetch('https://api.openai.com/v1/chat/completions', { method: 'POST', headers: { Authorization: `Bearer ${openaiKey.trim()}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ model: 'gpt-4o', messages: [{ role: 'user', content: prompt }] }) });
            if (!res.ok) { const e = await res.json(); throw new Error(e.error?.message || `HTTP ${res.status}`); }
            summaryText = (await res.json()).choices[0].message.content;
          }
          console.log('摘要引擎：', usedEngine);
          setSummary(summaryText);
          // 自動存前情提要到 Supabase
          if (projectId) {
            const date = new Date().toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric' });
            const briefingMd = `> 📌 上次會議前情提要（${date}）\n\n${summaryText}`;
            db(`projects?id=eq.${projectId}`, { method: 'PATCH', body: JSON.stringify({ briefing: briefingMd }) }).catch(() => {});
          }
        } catch (e) { setErrMsg('AI 摘要失敗：' + e.message); setStatus('error'); return; }
        setStatus('done');
      };

      const exportMd = () => {
        const date = new Date().toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric' });
        const agendaSec = proposals.length ? proposals.map((p, i) => `### ${i + 1}. ${p.title}\n**提案者：** ${p.author}\n\n${p.content}`).join('\n\n---\n\n') : '（無提案）';
        const md = `# 會議紀錄\n\n**日期：** ${date}\n\n---\n\n## 📋 議程提案\n\n${agendaSec}\n\n---\n\n## 🎙️ 會議逐字稿\n\n${transcript}\n\n---\n\n## 📝 AI 摘要整理\n\n${summary}\n`;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([md], { type: 'text/markdown; charset=utf-8' }));
        a.download = `meetkit-${new Date().toISOString().slice(0,10)}.md`; a.click();
      };

      const running = ['compressing', 'segmenting', 'transcribing', 'summarizing'].includes(status);

      const handleArchive = async () => {
        setArchiving(true);
        setArchiveSteps([]);
        const steps = [
          { msg: '💾 儲存日誌中…',    delay: 0 },
          { msg: '📌 更新前情提要…',  delay: 900 },
          { msg: '✅ 完成！前往日誌', delay: 1800 },
        ];
        steps.forEach(({ msg, delay }) => {
          setTimeout(() => setArchiveSteps(prev => [...prev, msg]), delay);
        });
        await new Promise(r => setTimeout(r, 2200));
        await onSaveJournal({ proposals, transcript, summary });
      };

      return (
        <div style={{ maxWidth: 800, margin: '0 auto', padding: '28px 20px', display: 'flex', flexDirection: 'column', gap: 18 }}>
          <div style={S.panel} className="fade-in">
            <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 18 }}>🔑 API 設定</div>
            <div className="grid-2col" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
              <div>
                <label style={S.label}>OpenAI API Key（必填，語音轉文字）</label>
                <input style={S.input} type="password" placeholder="sk-…" value={openaiKey} onChange={e => { setOpenaiKey(e.target.value); localStorage.setItem('mk_openai_key', e.target.value); }} autoComplete="off" />
              </div>
              <div>
                <label style={S.label}>Anthropic API Key（選填，優先用 Claude 摘要）</label>
                <input style={S.input} type="password" placeholder="sk-ant-…" value={anthropicKey} onChange={e => { setAnthropicKey(e.target.value); localStorage.setItem('mk_anthropic_key', e.target.value); }} autoComplete="off" />
              </div>
            </div>
            <div style={{ marginTop: 12, fontSize: 12, color: C.textMut, lineHeight: 1.6 }}>
              🔒 API Key 儲存於本機瀏覽器，不傳送至任何第三方。未填 Anthropic Key 時自動改用 GPT-4o 摘要。
            </div>
          </div>

          <div style={S.panel} className="fade-in">
            <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 16 }}>🎵 音檔來源</div>
            {audioBlob && (
              <div style={{ ...S.card, padding: '10px 14px', marginBottom: 14, display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
                <span style={badge(C.success, C.successBg)}>✓ 已有錄音</span>
                <span style={{ fontSize: 13, color: C.textSec, flex: 1 }}>來自「會議進行」的錄音</span>
                <a href={URL.createObjectURL(audioBlob)} download={`meetkit-rec-${new Date().toISOString().slice(0,16).replace('T','-')}.webm`}
                  style={{ ...btn('ghost'), padding: '4px 12px', fontSize: 12, color: C.textSec, textDecoration: 'none', flexShrink: 0 }}>
                  ⬇ 下載錄音檔
                </a>
              </div>
            )}
            <div>
              <label style={S.label}>{audioBlob ? '或改用上傳的音檔' : '上傳音檔'}</label>
              <input ref={fileRef} type="file" accept="audio/*,video/webm" style={{ display: 'none' }} onChange={e => setUploadFile(e.target.files[0])} />
              {/* 拖曳區域 */}
              <div
                onDragOver={e => { e.preventDefault(); e.currentTarget.style.borderColor = C.accent; e.currentTarget.style.background = C.accent + '11'; }}
                onDragLeave={e => { e.currentTarget.style.borderColor = C.border; e.currentTarget.style.background = 'transparent'; }}
                onDrop={e => {
                  e.preventDefault();
                  e.currentTarget.style.borderColor = C.border;
                  e.currentTarget.style.background = 'transparent';
                  const f = e.dataTransfer.files[0];
                  if (f) setUploadFile(f);
                }}
                onClick={() => fileRef.current.click()}
                style={{
                  border: `2px dashed ${uploadFile ? C.success : C.border}`,
                  borderRadius: 10, padding: '24px 16px', textAlign: 'center',
                  cursor: 'pointer', transition: 'all 0.15s',
                  background: uploadFile ? C.successBg : 'transparent',
                }}
              >
                {uploadFile ? (
                  <>
                    <div style={{ fontSize: 28, marginBottom: 6 }}>✅</div>
                    <div style={{ fontSize: 14, fontWeight: 600, color: C.success }}>{uploadFile.name}</div>
                    <div style={{ fontSize: 12, color: C.textMut, marginTop: 4 }}>點擊重新選擇</div>
                  </>
                ) : (
                  <>
                    <div style={{ fontSize: 28, marginBottom: 6 }}>🎵</div>
                    <div style={{ fontSize: 14, fontWeight: 500 }}>拖曳音檔到此處</div>
                    <div style={{ fontSize: 12, color: C.textMut, marginTop: 4 }}>或點擊選擇檔案 · m4a / mp3 / wav / webm</div>
                  </>
                )}
              </div>
            </div>
          </div>

          {whisperInfo && <div style={{ ...S.card, padding: '10px 16px', background: C.successBg, borderColor: C.success + '55', fontSize: 12, color: C.textSec, display: 'flex', gap: 16 }}>
            <span>🎙 Whisper 用量</span>
            <span>音檔長度：約 <b>{whisperInfo.mins}</b> 分鐘</span>
            <span>費用：<b>${whisperInfo.cost}</b> USD</span>
            <span style={{ color: C.textMut }}>（$0.006/分鐘）</span>
          </div>}
          {errMsg && <div style={{ ...S.card, padding: '12px 16px', background: C.dangerBg, borderColor: C.danger + '66', color: '#ff8a80', fontSize: 13 }}>⚠️ {errMsg}</div>}

          {status !== 'done' && (
            <>
              {running && status !== 'summarizing' && (
                <div style={{ ...S.card, padding: '14px 16px', display: 'flex', flexDirection: 'column', gap: 8 }}>
                  {status === 'compressing' && <>
                    <div style={{ fontSize: 13, color: C.textSec }}>⚙️ 壓縮音訊中…</div>
                    <div style={{ height: 6, background: C.border, borderRadius: 3, overflow: 'hidden' }}>
                      <div style={{ height: '100%', width: `${Math.round(compressProgress * 100)}%`, background: C.accent, borderRadius: 3, transition: 'width 0.3s' }} />
                    </div>
                    <div style={{ fontSize: 11, color: C.textMut }}>{Math.round(compressProgress * 100)}%</div>
                  </>}
                  {status === 'segmenting' && <>
                    <div style={{ fontSize: 13, color: C.textSec }}>✂️ 靜音偵測切段中…</div>
                    <div style={{ height: 6, background: C.border, borderRadius: 3, overflow: 'hidden' }}>
                      <div style={{ height: '100%', width: `${Math.round(segmentProgress * 100)}%`, background: C.accent, borderRadius: 3, transition: 'width 0.3s' }} />
                    </div>
                    <div style={{ fontSize: 11, color: C.textMut }}>{Math.round(segmentProgress * 100)}%</div>
                  </>}
                  {status === 'transcribing' && <>
                    <div style={{ fontSize: 13, color: C.textSec }}>
                      ⏳ Whisper 轉錄中…
                      {segmentCount > 0 && <span style={{ color: C.textMut, marginLeft: 6 }}>
                        {Math.round(uploadProgress * segmentCount)}/{segmentCount} 段
                      </span>}
                    </div>
                    <div style={{ height: 6, background: C.border, borderRadius: 3, overflow: 'hidden' }}>
                      <div style={{ height: '100%', width: `${Math.round(uploadProgress * 100)}%`, background: C.accent, borderRadius: 3, transition: 'width 0.3s' }} />
                    </div>
                    <div style={{ fontSize: 11, color: C.textMut }}>{Math.round(uploadProgress * 100)}%</div>
                  </>}
                </div>
              )}
              <button style={{ ...btn('primary'), padding: 14, fontSize: 15, opacity: running ? 0.7 : 1 }} onClick={run} disabled={running}>
                {status === 'compressing'  ? <><Spinner /> 壓縮音訊中…</> :
                 status === 'segmenting'   ? <><Spinner /> 切段中…</> :
                 status === 'transcribing' ? <><Spinner /> 語音轉文字中…</> :
                 status === 'summarizing'  ? <><Spinner /> AI 摘要生成中…</> :
                 '▶ 開始轉文字 & 摘要'}
              </button>
              {failedSegments.length > 0 && (
                <div style={{ ...S.card, padding: '12px 16px', background: C.dangerBg, borderColor: C.danger + '66', fontSize: 12, color: '#ff8a80' }}>
                  ⚠️ {failedSegments.length} 段轉錄失敗（{failedSegments.map(s => `段 ${s.index + 1}`).join('、')}），其餘已合併，可手動補充逐字稿。
                </div>
              )}
            </>
          )}

          {transcript && (
            <div style={S.panel} className="fade-in">
              <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 14 }}>🎙️ 會議逐字稿</div>
              <textarea style={{ ...S.input, minHeight: 200, lineHeight: 1.9, resize: 'vertical' }} value={transcript} onChange={e => setTranscript(e.target.value)} />
            </div>
          )}

          {summary && (
            <div style={S.panel} className="fade-in">
              <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 14 }}>
                📝 AI 摘要整理
                <span style={{ ...badge(anthropicKey ? C.accent : C.warn), marginLeft: 10, fontSize: 11 }}>{anthropicKey ? 'Claude' : 'GPT-4o'}</span>
              </div>
              <textarea style={{ ...S.input, minHeight: 260, lineHeight: 1.9, resize: 'vertical' }} value={summary} onChange={e => setSummary(e.target.value)} />
            </div>
          )}

          {status === 'done' && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }} className="fade-in">
              {archiving ? (
                <div style={{ ...S.panel, padding: '20px 24px', display: 'flex', flexDirection: 'column', gap: 12 }}>
                  {archiveSteps.length === 0 && (
                    <div style={{ fontSize: 13, color: C.textMut, display: 'flex', alignItems: 'center', gap: 8 }}><Spinner /> 準備中…</div>
                  )}
                  {archiveSteps.map((s, i) => {
                    const isDone = i < archiveSteps.length - 1 || archiveSteps.length === 3;
                    return (
                      <div key={i} className="fade-in" style={{ display: 'flex', alignItems: 'center', gap: 10, fontSize: 14, color: isDone ? C.success : C.textSec }}>
                        {isDone ? <span style={{ width: 18, textAlign: 'center', fontSize: 13 }}>✓</span> : <Spinner />}
                        {s}
                      </div>
                    );
                  })}
                </div>
              ) : (
                <>
                  <button style={{ ...btn('primary'), padding: 16, fontSize: 16, width: '100%', letterSpacing: 1 }}
                    onClick={handleArchive}>
                    ✅ 完成備忘 & 歸檔
                  </button>
                  <button style={{ ...btn('ghost'), padding: 12, fontSize: 14, width: '100%' }} onClick={exportMd}>⬇ 匯出 Markdown</button>
                </>
              )}
            </div>
          )}
        </div>
      );
    }

    // ─── JOURNAL ─────────────────────────────────────────────────────────────────
    function Journal({ journal, setJournal, projectId, projectTitle, onSyncToNotion }) {
      const [search, setSearch] = useState('');
      const [expanded, setExpanded] = useState({});
      const [syncingId, setSyncingId] = useState(null);
      const [syncedIds, setSyncedIds] = useState(() => new Set(
        journal.filter(j => j.notionSynced).map(j => j.id)
      ));

      const handleSyncOne = async (e, entry) => {
        e.stopPropagation();
        if (!onSyncToNotion) return;
        setSyncingId(entry.id);
        const result = await onSyncToNotion(entry);
        setSyncingId(null);
        if (result.ok) {
          setSyncedIds(prev => new Set([...prev, entry.id]));
          if (result.url) window.open(result.url, '_blank');
        } else {
          alert('同步到 Notion 失敗，請稍後再試');
        }
      };

      const filtered = journal.slice().reverse().filter(m => {
        if (!search.trim()) return true;
        const q = search.toLowerCase();
        return m.date?.toLowerCase().includes(q) || m.summary?.toLowerCase().includes(q) || m.transcript?.toLowerCase().includes(q) || m.proposals?.some(p => p.title?.toLowerCase().includes(q) || p.author?.toLowerCase().includes(q));
      });

      const deleteEntry = async (id) => {
        try {
          await db(`journals?id=eq.${id}`, { method: 'DELETE' });
        } catch (e) { console.error('Journal delete failed', e); }
        setJournal(prev => prev.filter(m => m.id !== id));
      };

      const importFromLocal = async () => {
        const raw = localStorage.getItem(`mk_journal_${projectId}`);
        if (!raw) { alert('本機沒有找到舊的日誌資料'); return; }
        let entries;
        try { entries = JSON.parse(raw); } catch { alert('資料格式有誤'); return; }
        if (!Array.isArray(entries) || entries.length === 0) { alert('本機日誌是空的'); return; }
        const existing = new Set(journal.map(j => j.id?.toString()));
        const toImport = entries.filter(e => !existing.has(e.id?.toString()));
        if (toImport.length === 0) { alert('所有紀錄都已存在，無需匯入'); return; }
        let ok = 0;
        for (const e of toImport) {
          const entry = { id: e.id?.toString(), project_id: projectId, date: e.date, proposals: e.proposals || [], transcript: e.transcript || '', summary: e.summary || '' };
          try { await db('journals', { method: 'POST', body: JSON.stringify(entry) }); ok++; } catch {}
        }
        alert(`匯入完成！共匯入 ${ok} 筆`);
        const updated = await db(`journals?project_id=eq.${projectId}&order=created_at.asc`).then(r => r.json());
        if (Array.isArray(updated)) setJournal(updated);
      };

      return (
        <div style={{ maxWidth: 860, margin: '0 auto', padding: '28px 20px' }}>
          <div style={{ display: 'flex', alignItems: 'center', marginBottom: 20 }}>
            <div style={{ fontSize: 18, fontWeight: 600, display: 'flex', alignItems: 'center', gap: 10, flex: 1 }}>
              📚 會議日誌 <span style={badge(C.accent)}>{journal.length} 場</span>
            </div>
            <button style={{ ...btn('ghost'), fontSize: 12, padding: '5px 12px', color: C.textSec }} onClick={importFromLocal}>⬆ 從本機匯入</button>
          </div>
          <input style={{ ...S.input, marginBottom: 20 }} placeholder="🔍 搜尋關鍵字、日期、提案者…" value={search} onChange={e => setSearch(e.target.value)} />

          {journal.length === 0 ? (
            <div style={{ textAlign: 'center', padding: '72px 0', color: C.textMut }}>
              <div style={{ fontSize: 40, marginBottom: 14 }}>📭</div>
              <div style={{ fontSize: 14 }}>尚無會議記錄</div>
              <div style={{ fontSize: 12, marginTop: 6 }}>完成會後整理後按「存入日誌」建立紀錄</div>
            </div>
          ) : filtered.length === 0 ? (
            <div style={{ textAlign: 'center', padding: '48px 0', color: C.textMut, fontSize: 14 }}>找不到「{search}」相關記錄</div>
          ) : (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
              {filtered.map((m) => (
                <div key={m.id} style={S.card} className="fade-in">
                  <div style={{ padding: '14px 18px', display: 'flex', alignItems: 'center', gap: 12, cursor: 'pointer' }} onClick={() => setExpanded(e => ({ ...e, [m.id]: !e[m.id] }))}>
                    <span style={{ ...badge(C.accent), minWidth: 28, justifyContent: 'center', flexShrink: 0 }}>{journal.length - journal.findIndex(x => x.id === m.id)}</span>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontWeight: 600, fontSize: 14 }}>{m.date}</div>
                      <div style={{ fontSize: 12, color: C.textSec, marginTop: 2 }}>{m.proposals?.length || 0} 項議程{m.transcript ? ' · 有逐字稿' : ''}</div>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      {onSyncToNotion && (
                        syncedIds.has(m.id) || m.notionSynced
                          ? <span style={{ ...badge('#2ecc71', '#e8faf0'), fontSize: 10, padding: '2px 7px' }}>✓ Notion</span>
                          : <button
                              style={{ ...btn('ghost'), padding: '3px 8px', fontSize: 11, color: '#666', borderColor: 'transparent', opacity: syncingId === m.id ? 0.5 : 1 }}
                              disabled={syncingId === m.id}
                              onClick={e => handleSyncOne(e, m)}
                            >{syncingId === m.id ? '同步中…' : '↗ Notion'}</button>
                      )}
                      <span style={{ color: C.textMut, fontSize: 12 }}>{expanded[m.id] ? '▲' : '▼'}</span>
                      <button style={{ ...btn('ghost'), padding: '3px 8px', fontSize: 13, color: C.danger, borderColor: 'transparent' }} onClick={e => { e.stopPropagation(); if (confirm('確定刪除？')) deleteEntry(m.id); }}>✕</button>
                    </div>
                  </div>
                  {expanded[m.id] && (
                    <div style={{ borderTop: `1px solid ${C.border}`, padding: '16px 18px', display: 'flex', flexDirection: 'column', gap: 16 }}>
                      {m.proposals?.length > 0 && (
                        <div>
                          <div style={{ fontSize: 12, fontWeight: 600, color: C.textSec, marginBottom: 8 }}>議程</div>
                          {m.proposals.map((p, pi) => {
                            let files = [];
                            try { const u = JSON.parse(p.file_url||'[]'); const n = JSON.parse(p.file_name||'[]'); if (Array.isArray(u)) files = u.map((url,i)=>({url,name:n[i]||url.split('/').pop()})); } catch {}
                            if (!files.length && p.file_url) files = [{url: p.file_url, name: p.file_name||'附件'}];
                            return (
                              <div key={pi} style={{ ...S.card, padding: '8px 12px', marginBottom: 6 }}>
                                <div style={{ display: 'flex', gap: 8, alignItems: 'flex-start' }}>
                                  <span style={{ ...badge(C.accent), flexShrink: 0 }}>{pi + 1}</span>
                                  <div style={{ flex: 1 }}>
                                    <div style={{ fontSize: 13, fontWeight: 500 }}>{p.title}</div>
                                    <div style={{ fontSize: 12, color: C.textSec }}>{p.author}</div>
                                    {files.length > 0 && (
                                      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginTop: 6 }}>
                                        {files.map((f, fi) => (
                                          <a key={fi} href={f.url} target="_blank" rel="noopener noreferrer"
                                            style={{ fontSize: 11, color: C.accent, background: C.accent+'18', borderRadius: 6, padding: '2px 8px', textDecoration: 'none' }}>
                                            {fileIcon(f.name)} {f.name}
                                          </a>
                                        ))}
                                      </div>
                                    )}
                                  </div>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                      {m.summary && (
                        <div>
                          <div style={{ fontSize: 12, fontWeight: 600, color: C.textSec, marginBottom: 8 }}>📝 AI 摘要</div>
                          <div className="mk-md" style={{ fontSize: 13, lineHeight: 1.85, background: C.bgCard, borderRadius: 8, padding: 16 }}
                            dangerouslySetInnerHTML={{ __html: (() => {
                              if (typeof marked === 'undefined') return `<pre>${m.summary}</pre>`;
                              const r = new marked.Renderer();
                              r.link = (href, title, text) => `<a href="${href}" target="_blank" rel="noopener noreferrer" style="color:#5b8dee">${text}</a>`;
                              return marked.parse(m.summary, { renderer: r, gfm: true, breaks: true });
                            })()} }
                          />
                        </div>
                      )}
                      {m.transcript && (
                        <details>
                          <summary style={{ fontSize: 12, fontWeight: 600, color: C.textSec, cursor: 'pointer', marginBottom: 8 }}>🎙️ 逐字稿 <span style={{ color: C.textMut, fontWeight: 400 }}>（點擊展開）</span></summary>
                          <div style={{ fontSize: 13, color: C.textSec, lineHeight: 1.9, whiteSpace: 'pre-wrap', background: C.bgCard, borderRadius: 8, padding: 14, marginTop: 8 }}>{m.transcript}</div>
                        </details>
                      )}
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ─── PASSWORD GATE ───────────────────────────────────────────────────────────
    function PasswordGate({ projectTitle, onAuth }) {
      const [input, setInput] = useState('');
      const [error, setError] = useState(false);

      const attempt = (correctPw) => {
        if (input.trim() === correctPw) { onAuth(); }
        else { setError(true); setInput(''); setTimeout(() => setError(false), 1500); }
      };

      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
          <div style={{ marginBottom: 32, textAlign: 'center' }}>
            <div style={{ fontSize: 40, marginBottom: 12 }}>🔒</div>
            <div style={{ fontSize: 20, fontWeight: 700, color: C.text }}>{projectTitle || '此專案'}</div>
            <div style={{ fontSize: 13, color: C.textSec, marginTop: 6 }}>請輸入密碼以進入</div>
          </div>
          <div style={{ width: '100%', maxWidth: 360 }}>
            <input
              style={{ ...S.input, marginBottom: 12, border: `1px solid ${error ? C.danger : C.border}`, textAlign: 'center', fontSize: 16, letterSpacing: '0.1em' }}
              type="password" placeholder="輸入密碼"
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && attempt(e.currentTarget.dataset.pw)}
              autoFocus
            />
            {error && <div style={{ textAlign: 'center', color: C.danger, fontSize: 13, marginBottom: 10 }}>密碼錯誤，請再試一次</div>}
            <PasswordGateButton input={input} onAttempt={attempt} />
          </div>
        </div>
      );
    }

    // Helper to pass correct password into the button without re-fetching
    function PasswordGateInner({ projectId, projectTitle, onAuth }) {
      const [pw, setPw] = useState(null);
      const [input, setInput] = useState('');
      const [error, setError] = useState(false);

      useEffect(() => {
        db(`projects?id=eq.${projectId}&select=password,title`).then(r => r.json()).then(d => {
          setPw(d[0]?.password || '');
          if (!d[0]?.password) onAuth(); // no password, auto-pass
        }).catch(() => setPw(''));
      }, [projectId]);

      if (pw === null) return (
        <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', color: C.textSec, fontSize: 14 }}>
          <Spinner /> <span style={{ marginLeft: 10 }}>載入中…</span>
        </div>
      );

      const attempt = () => {
        if (input.trim() === pw) { sessionStorage.setItem(`mk_auth_${projectId}`, '1'); onAuth(); }
        else { setError(true); setInput(''); setTimeout(() => setError(false), 1500); }
      };

      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
          <div style={{ marginBottom: 32, textAlign: 'center' }}>
            <div style={{ fontSize: 40, marginBottom: 12 }}>🔒</div>
            <div style={{ fontSize: 20, fontWeight: 700, color: C.text }}>{projectTitle || '此專案'}</div>
            <div style={{ fontSize: 13, color: C.textSec, marginTop: 6 }}>請輸入密碼以進入</div>
          </div>
          <div style={{ width: '100%', maxWidth: 360 }}>
            <input
              style={{ ...S.input, marginBottom: 12, border: `1px solid ${error ? C.danger : C.border}`, textAlign: 'center', fontSize: 16, letterSpacing: '0.1em' }}
              type="password" placeholder="輸入密碼"
              value={input} onChange={e => setInput(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && attempt()}
              autoFocus
            />
            {error && <div style={{ textAlign: 'center', color: C.danger, fontSize: 13, marginBottom: 10 }}>密碼錯誤，請再試一次</div>}
            <button style={{ ...btn('primary'), width: '100%', padding: 13 }} onClick={attempt}>進入專案</button>
          </div>
        </div>
      );
    }

    // ─── APP ROOT ────────────────────────────────────────────────────────────────
    function App() {
      const [projectId, setProjectId] = useState(() => new URLSearchParams(window.location.search).get('p'));
      const [projectTitle, setProjectTitle] = useState('未命名專案');
      const [meetingDate, setMeetingDate] = useState('');
      const [meetingTime, setMeetingTime] = useState('');
      const [authed,    setAuthed]    = useState(false);
      const [phase,     setPhase]     = useState(0);
      const [proposals, setProposals] = useState([]);
      const [audioBlob, setAudioBlob] = useState(null);
      const [syncOk,    setSyncOk]    = useState(true);
      const [journal,   setJournal]   = useState([]);
      const [briefing,  setBriefing]  = useState('');
      const [isRecording, setIsRecording] = useState(false);
      const [recordingSeconds, setRecordingSeconds] = useState(0);
      const [headerHidden, setHeaderHidden] = useState(false);
      const [isFullscreen, setIsFullscreen] = useState(false);
      const lastScrollY = useRef(0);

      // ─── App 層全螢幕按鈕（Meeting 元件外，確保 position:fixed 不受父層影響）─────
      useEffect(() => {
        const onFSChange = () => {
          setIsFullscreen(!!(document.fullscreenElement || document.webkitFullscreenElement));
        };
        document.addEventListener('fullscreenchange', onFSChange);
        document.addEventListener('webkitfullscreenchange', onFSChange);
        return () => {
          document.removeEventListener('fullscreenchange', onFSChange);
          document.removeEventListener('webkitfullscreenchange', onFSChange);
        };
      }, []);

      const toggleFullscreen = () => {
        const isFS = document.fullscreenElement || document.webkitFullscreenElement;
        if (isFS) {
          if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        } else {
          const iframe = document.querySelector('iframe');
          const target = iframe || document.body;
          if (target.requestFullscreen) target.requestFullscreen().catch(e => console.warn('全螢幕失敗:', e));
          else if (target.webkitRequestFullscreen) target.webkitRequestFullscreen();
        }
      };

      // Meeting 每秒回呼：active=是否錄音中, seconds=累積總秒數
      const handleRecordingChange = (active, seconds = 0) => {
        setIsRecording(active);
        if (active) setRecordingSeconds(seconds);
      };

      // ─── Header 隱藏/顯示（全螢幕請求已移到 tab onClick，避免被瀏覽器擋）─────────────
      useEffect(() => {
        if (phase === 1) {
          setHeaderHidden(true);
          lastScrollY.current = window.scrollY;
        } else {
          setHeaderHidden(false);
        }
      }, [phase]);

      // 往上滑：退出全螢幕，Header 重新出現
      useEffect(() => {
        if (phase !== 1) return;
        // 退出全螢幕的 helper（含 Safari webkit 前綴）
        const exitFS = () => {
          const isFS = document.fullscreenElement || document.webkitFullscreenElement;
          if (isFS) {
            if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
          }
        };
        const onScroll = () => {
          const y = window.scrollY;
          if (y < lastScrollY.current - 40) {
            // 往上滑超過 40px
            exitFS();
            setHeaderHidden(false);
          } else if (y > lastScrollY.current + 10) {
            // 往下滑就隱藏 Header
            setHeaderHidden(true);
          }
          lastScrollY.current = y;
        };
        // 觸控裝置：用 touchstart/touchend 偵測上滑手勢
        let touchStartY = 0;
        const onTouchStart = (e) => { touchStartY = e.touches[0].clientY; };
        const onTouchEnd = (e) => {
          const dy = e.changedTouches[0].clientY - touchStartY;
          if (dy > 60) {
            // 往下拉（手指向下移動超過 60px）→ 顯示 Header
            exitFS();
            setHeaderHidden(false);
          }
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('touchstart', onTouchStart, { passive: true });
        window.addEventListener('touchend', onTouchEnd, { passive: true });
        return () => {
          window.removeEventListener('scroll', onScroll);
          window.removeEventListener('touchstart', onTouchStart);
          window.removeEventListener('touchend', onTouchEnd);
        };
      }, [phase]);

      useEffect(() => {
        if (!projectId) return;
        // Check session auth
        if (sessionStorage.getItem(`mk_auth_${projectId}`)) setAuthed(true);
        // Load journal from Supabase
        db(`journals?project_id=eq.${projectId}&order=created_at.asc`).then(r => r.json()).then(d => { if (Array.isArray(d)) setJournal(d); }).catch(() => {});
        // Load project info
        db(`projects?id=eq.${projectId}&select=title,meeting_date,meeting_time,briefing`).then(r => r.json()).then(d => {
          if (d[0]?.title) setProjectTitle(d[0].title);
          if (d[0]?.meeting_date) setMeetingDate(d[0].meeting_date);
          if (d[0]?.meeting_time) setMeetingTime(d[0].meeting_time);
          if (d[0]?.briefing) setBriefing(d[0].briefing);
        }).catch(() => {});
      }, [projectId]);

      const enterProject = (id) => {
        setProjectId(id);
        setAuthed(false);
        window.history.pushState({}, '', `?p=${id}`);
        // 記錄到最近使用
        try {
          const recent = JSON.parse(localStorage.getItem('mk_recent_projects') || '[]');
          const updated = [{ id, lastVisited: new Date().toISOString() }, ...recent.filter(p => p.id !== id)].slice(0, 8);
          localStorage.setItem('mk_recent_projects', JSON.stringify(updated));
        } catch {}
      };

      // ─── 同步單筆日誌到 Notion ───────────────────────────────────
      const syncEntryToNotion = async (entry) => {
        const isoDate = new Date().toISOString().split('T')[0];
        try {
          const res = await fetch(`${SB_URL}/functions/v1/notion-sync`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${SB_KEY}`,
            },
            body: JSON.stringify({ journal: entry, projectTitle, isoDate }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Notion 同步失敗');
          return { ok: true, url: data.notionUrl };
        } catch (e) {
          console.error('Notion sync failed:', e);
          return { ok: false };
        }
      };

      const saveToJournal = async ({ proposals, transcript, summary }) => {
        const entry = {
          id: Date.now().toString(),
          project_id: projectId,
          date: new Date().toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric' }),
          proposals: proposals.map(p => ({ title: p.title, author: p.author, content: p.content })),
          transcript, summary,
        };
        try {
          await db('journals', { method: 'POST', body: JSON.stringify(entry) });
        } catch (e) { console.error('Journal save failed', e); }
        // 同步到 Notion（背景執行，不阻擋流程）
        syncEntryToNotion(entry).then(result => {
          if (result.ok) {
            setJournal(prev => prev.map(j => j.id === entry.id ? { ...j, notionSynced: true, notionUrl: result.url } : j));
          }
        });
        setJournal(prev => [...prev, { ...entry, notionSynced: false }]);
        setPhase(3);
      };

      if (!projectId) return <Home onEnter={enterProject} />;
      if (!authed) return <PasswordGateInner projectId={projectId} projectTitle={projectTitle} onAuth={() => setAuthed(true)} />;

      return (
        <div>
          <Header
            phase={phase} setPhase={setPhase} syncOk={syncOk}
            journalCount={journal.length}
            projectId={projectId} projectTitle={projectTitle}
            onTitleSave={setProjectTitle}
            isRecording={isRecording}
            recordingSeconds={recordingSeconds}
            hidden={headerHidden}
          />
          {phase === 0 && <PreMeeting projectId={projectId} proposals={proposals} setProposals={setProposals} setSyncOk={setSyncOk} journal={journal} projectTitle={projectTitle} meetingDate={meetingDate} setMeetingDate={setMeetingDate} meetingTime={meetingTime} setMeetingTime={setMeetingTime} briefing={briefing} />}
          {/* Meeting: 永遠掛載，避免切換 tab 時 unmount 導致計時狀態歸零 */}
          <div style={{ display: phase === 1 ? 'block' : 'none' }}>
            <Meeting proposals={proposals} setProposals={setProposals} projectId={projectId} briefing={briefing}
              onGoHome={() => { setProjectId(null); window.history.pushState({}, '', window.location.pathname); }}
              setPhase={setPhase}
              onRecordingStateChange={handleRecordingChange} />
          </div>
          {phase === 2 && <PostMeeting proposals={proposals} audioBlob={audioBlob} onSaveJournal={saveToJournal} projectId={projectId} projectTitle={projectTitle} />}
          {phase === 3 && <Journal journal={journal} setJournal={setJournal} projectId={projectId} projectTitle={projectTitle} onSyncToNotion={syncEntryToNotion} />}
          {/* 全螢幕按鈕：只在會議進行時顯示，放在 App 最外層確保 position:fixed 正常 */}
          {phase === 1 && (
            <button onClick={toggleFullscreen} style={{
              position: 'fixed', bottom: 24, right: 24, zIndex: 9999,
              background: isFullscreen ? C.accent : C.bgPanel,
              border: `1px solid ${isFullscreen ? C.accent : C.border}`,
              borderRadius: 10, padding: '8px 14px',
              display: 'flex', alignItems: 'center', gap: 6,
              fontSize: 13, fontWeight: 600,
              color: isFullscreen ? '#fff' : C.textSec,
              cursor: 'pointer', backdropFilter: 'blur(12px)',
              boxShadow: '0 4px 20px rgba(0,0,0,0.5)',
            }}>
              {isFullscreen ? '↙ 縮小' : '↗ 全螢幕'}
            </button>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
