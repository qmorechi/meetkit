    // ─── JOURNAL ─────────────────────────────────────────────────────────────────
    function Journal({ journal, setJournal, projectId, projectTitle, onSyncToNotion }) {
      const [search, setSearch] = useState('');
      const [expanded, setExpanded] = useState({});
      const [syncingId, setSyncingId] = useState(null);
      const [batchSyncing, setBatchSyncing] = useState(false);
      const [syncedIds, setSyncedIds] = useState(() => new Set(
        journal.filter(j => j.notion_page_id).map(j => j.id)
      ));

      // journal 從 DB reload 後,同步 syncedIds 狀態（避免卡在舊 state）
      useEffect(() => {
        setSyncedIds(new Set(journal.filter(j => j.notion_page_id).map(j => j.id)));
      }, [journal]);

      const handleBatchSync = async () => {
        if (!onSyncToNotion) return;
        const unsynced = journal.filter(j => !syncedIds.has(j.id) && !j.notion_page_id);
        if (unsynced.length === 0) { alert('所有日誌都已同步到 Notion'); return; }
        if (!confirm(`準備同步 ${unsynced.length} 筆日誌到 Notion，確定繼續？`)) return;
        setBatchSyncing(true);
        let ok = 0;
        for (const entry of unsynced) {
          const result = await onSyncToNotion(entry);
          if (result.ok) { setSyncedIds(prev => new Set([...prev, entry.id])); ok++; }
          await new Promise(r => setTimeout(r, 400)); // 避免太快觸發 rate limit
        }
        setBatchSyncing(false);
        alert(`同步完成！成功 ${ok} 筆，失敗 ${unsynced.length - ok} 筆`);
      };

      const handleSyncOne = async (e, entry) => {
        e.stopPropagation();
        if (!onSyncToNotion) return;
        setSyncingId(entry.id);
        const result = await onSyncToNotion(entry);
        setSyncingId(null);
        if (result.ok) {
          setSyncedIds(prev => new Set([...prev, entry.id]));
          if (result.url) window.open(result.url, '_blank');
        } else {
          alert('同步到 Notion 失敗，請稍後再試');
        }
      };

      const filtered = journal.slice().reverse().filter(m => {
        if (!search.trim()) return true;
        const q = search.toLowerCase();
        return m.date?.toLowerCase().includes(q) || m.summary?.toLowerCase().includes(q) || m.transcript?.toLowerCase().includes(q) || m.proposals?.some(p => p.title?.toLowerCase().includes(q) || p.author?.toLowerCase().includes(q));
      });

      const deleteEntry = async (id) => {
        try {
          await db(`journals?id=eq.${id}`, { method: 'DELETE' });
        } catch (e) { console.error('Journal delete failed', e); }
        setJournal(prev => prev.filter(m => m.id !== id));
      };

      const importFromLocal = async () => {
        const raw = localStorage.getItem(`mk_journal_${projectId}`);
        if (!raw) { alert('本機沒有找到舊的日誌資料'); return; }
        let entries;
        try { entries = JSON.parse(raw); } catch { alert('資料格式有誤'); return; }
        if (!Array.isArray(entries) || entries.length === 0) { alert('本機日誌是空的'); return; }
        const existing = new Set(journal.map(j => j.id?.toString()));
        const toImport = entries.filter(e => !existing.has(e.id?.toString()));
        if (toImport.length === 0) { alert('所有紀錄都已存在，無需匯入'); return; }
        let ok = 0;
        for (const e of toImport) {
          const entry = { id: e.id?.toString(), project_id: projectId, date: e.date, proposals: e.proposals || [], transcript: e.transcript || '', summary: e.summary || '' };
          try { await db('journals', { method: 'POST', body: JSON.stringify(entry) }); ok++; } catch {}
        }
        alert(`匯入完成！共匯入 ${ok} 筆`);
        const updated = await db(`journals?project_id=eq.${projectId}&order=created_at.asc`).then(r => r.json());
        if (Array.isArray(updated)) setJournal(updated);
      };

      return (
        <div style={{ maxWidth: 860, margin: '0 auto', padding: '28px 20px' }}>
          <div style={{ display: 'flex', alignItems: 'center', marginBottom: 20 }}>
            <div style={{ fontSize: 18, fontWeight: 600, display: 'flex', alignItems: 'center', gap: 10, flex: 1 }}>
              📚 會議日誌 <span style={badge(C.accent)}>{journal.length} 場</span>
            </div>
            {onSyncToNotion && (() => {
              const pendingCount = journal.filter(j => !syncedIds.has(j.id) && !j.notion_page_id).length;
              const allDone = pendingCount === 0;
              return (
                <button
                  style={{ ...btn('ghost'), fontSize: 12, padding: '5px 12px', color: C.textSec, opacity: (batchSyncing || allDone) ? 0.4 : 1, cursor: allDone ? 'default' : 'pointer' }}
                  disabled={batchSyncing || allDone}
                  onClick={handleBatchSync}
                >
                  {batchSyncing ? '同步中…' : allDone ? '✓ 全部已同步' : `↗ 同步剩餘 ${pendingCount} 筆`}
                </button>
              );
            })()}
            <button style={{ ...btn('ghost'), fontSize: 12, padding: '5px 12px', color: C.textSec }} onClick={importFromLocal}>⬆ 從本機匯入</button>
          </div>
          <input style={{ ...S.input, marginBottom: 20 }} placeholder="🔍 搜尋關鍵字、日期、提案者…" value={search} onChange={e => setSearch(e.target.value)} />

          {journal.length === 0 ? (
            <div style={{ textAlign: 'center', padding: '72px 0', color: C.textMut }}>
              <div style={{ fontSize: 40, marginBottom: 14 }}>📭</div>
              <div style={{ fontSize: 14 }}>尚無會議記錄</div>
              <div style={{ fontSize: 12, marginTop: 6 }}>完成會後整理後按「存入日誌」建立紀錄</div>
            </div>
          ) : filtered.length === 0 ? (
            <div style={{ textAlign: 'center', padding: '48px 0', color: C.textMut, fontSize: 14 }}>找不到「{search}」相關記錄</div>
          ) : (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
              {filtered.map((m) => (
                <div key={m.id} style={S.card} className="fade-in">
                  <div style={{ padding: '14px 18px', display: 'flex', alignItems: 'center', gap: 12, cursor: 'pointer' }} onClick={() => setExpanded(e => ({ ...e, [m.id]: !e[m.id] }))}>
                    <span style={{ ...badge(C.accent), minWidth: 28, justifyContent: 'center', flexShrink: 0 }}>{journal.length - journal.findIndex(x => x.id === m.id)}</span>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontWeight: 600, fontSize: 14 }}>{m.date}</div>
                      <div style={{ fontSize: 12, color: C.textSec, marginTop: 2 }}>{m.proposals?.length || 0} 項議程{m.transcript ? ' · 有逐字稿' : ''}</div>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      {onSyncToNotion && (
                        syncedIds.has(m.id) || m.notion_page_id
                          ? <span style={{ ...badge('#2ecc71', '#e8faf0'), fontSize: 10, padding: '2px 7px' }}>✓ Notion</span>
                          : <button
                              style={{ ...btn('ghost'), padding: '3px 8px', fontSize: 11, color: '#666', borderColor: 'transparent', opacity: syncingId === m.id ? 0.5 : 1 }}
                              disabled={syncingId === m.id}
                              onClick={e => handleSyncOne(e, m)}
                            >{syncingId === m.id ? '同步中…' : '↗ Notion'}</button>
                      )}
                      <span style={{ color: C.textMut, fontSize: 12 }}>{expanded[m.id] ? '▲' : '▼'}</span>
                      <button style={{ ...btn('ghost'), padding: '3px 8px', fontSize: 13, color: C.danger, borderColor: 'transparent' }} onClick={e => { e.stopPropagation(); if (confirm('確定刪除？')) deleteEntry(m.id); }}>✕</button>
                    </div>
                  </div>
                  {expanded[m.id] && (
                    <div style={{ borderTop: `1px solid ${C.border}`, padding: '16px 18px', display: 'flex', flexDirection: 'column', gap: 16 }}>
                      {m.proposals?.length > 0 && (
                        <div>
                          <div style={{ fontSize: 12, fontWeight: 600, color: C.textSec, marginBottom: 8 }}>議程</div>
                          {m.proposals.map((p, pi) => {
                            let files = [];
                            try { const u = JSON.parse(p.file_url||'[]'); const n = JSON.parse(p.file_name||'[]'); if (Array.isArray(u)) files = u.map((url,i)=>({url,name:n[i]||url.split('/').pop()})); } catch {}
                            if (!files.length && p.file_url) files = [{url: p.file_url, name: p.file_name||'附件'}];
                            return (
                              <div key={pi} style={{ ...S.card, padding: '8px 12px', marginBottom: 6 }}>
                                <div style={{ display: 'flex', gap: 8, alignItems: 'flex-start' }}>
                                  <span style={{ ...badge(C.accent), flexShrink: 0 }}>{pi + 1}</span>
                                  <div style={{ flex: 1 }}>
                                    <div style={{ fontSize: 13, fontWeight: 500 }}>{p.title}</div>
                                    <div style={{ fontSize: 12, color: C.textSec }}>{p.author}</div>
                                    {files.length > 0 && (
                                      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginTop: 6 }}>
                                        {files.map((f, fi) => (
                                          <a key={fi} href={f.url} target="_blank" rel="noopener noreferrer"
                                            style={{ fontSize: 11, color: C.accent, background: C.accent+'18', borderRadius: 6, padding: '2px 8px', textDecoration: 'none' }}>
                                            {fileIcon(f.name)} {f.name}
                                          </a>
                                        ))}
                                      </div>
                                    )}
                                  </div>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                      {m.summary && (
                        <div>
                          <div style={{ fontSize: 12, fontWeight: 600, color: C.textSec, marginBottom: 8 }}>📝 AI 摘要</div>
                          <div className="mk-md" style={{ fontSize: 13, lineHeight: 1.85, background: C.bgCard, borderRadius: 8, padding: 16 }}
                            dangerouslySetInnerHTML={{ __html: (() => {
                              if (typeof marked === 'undefined') return `<pre>${m.summary}</pre>`;
                              const r = new marked.Renderer();
                              r.link = (href, title, text) => `<a href="${href}" target="_blank" rel="noopener noreferrer" style="color:#5b8dee">${text}</a>`;
                              return marked.parse(m.summary, { renderer: r, gfm: true, breaks: true });
                            })()} }
                          />
                        </div>
                      )}
                      {m.transcript && (
                        <details>
                          <summary style={{ fontSize: 12, fontWeight: 600, color: C.textSec, cursor: 'pointer', marginBottom: 8 }}>🎙️ 逐字稿 <span style={{ color: C.textMut, fontWeight: 400 }}>（點擊展開）</span></summary>
                          <div style={{ fontSize: 13, color: C.textSec, lineHeight: 1.9, whiteSpace: 'pre-wrap', background: C.bgCard, borderRadius: 8, padding: 14, marginTop: 8 }}>{m.transcript}</div>
                        </details>
                      )}
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ─── PASSWORD GATE ───────────────────────────────────────────────────────────
    function PasswordGate({ projectTitle, onAuth }) {
      const [input, setInput] = useState('');
      const [error, setError] = useState(false);

      const attempt = (correctPw) => {
        if (input.trim() === correctPw) { onAuth(); }
        else { setError(true); setInput(''); setTimeout(() => setError(false), 1500); }
      };

      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
          <div style={{ marginBottom: 32, textAlign: 'center' }}>
            <div style={{ fontSize: 40, marginBottom: 12 }}>🔒</div>
            <div style={{ fontSize: 20, fontWeight: 700, color: C.text }}>{projectTitle || '此專案'}</div>
            <div style={{ fontSize: 13, color: C.textSec, marginTop: 6 }}>請輸入密碼以進入</div>
          </div>
          <div style={{ width: '100%', maxWidth: 360 }}>
            <input
              style={{ ...S.input, marginBottom: 12, border: `1px solid ${error ? C.danger : C.border}`, textAlign: 'center', fontSize: 16, letterSpacing: '0.1em' }}
              type="password" placeholder="輸入密碼"
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && attempt(e.currentTarget.dataset.pw)}
              autoFocus
            />
            {error && <div style={{ textAlign: 'center', color: C.danger, fontSize: 13, marginBottom: 10 }}>密碼錯誤，請再試一次</div>}
            <PasswordGateButton input={input} onAttempt={attempt} />
          </div>
        </div>
      );
    }

    // Helper to pass correct password into the button without re-fetching
    function PasswordGateInner({ projectId, projectTitle, onAuth }) {
      const [pw, setPw] = useState(null);
      const [input, setInput] = useState('');
      const [error, setError] = useState(false);

      useEffect(() => {
        db(`projects?id=eq.${projectId}&select=password,title`).then(r => r.json()).then(d => {
          setPw(d[0]?.password || '');
          if (!d[0]?.password) onAuth(); // no password, auto-pass
        }).catch(() => setPw(''));
      }, [projectId]);

      if (pw === null) return (
        <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', color: C.textSec, fontSize: 14 }}>
          <Spinner /> <span style={{ marginLeft: 10 }}>載入中…</span>
        </div>
      );

      const attempt = () => {
        if (input.trim() === pw) { sessionStorage.setItem(`mk_auth_${projectId}`, '1'); onAuth(); }
        else { setError(true); setInput(''); setTimeout(() => setError(false), 1500); }
      };

      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
          <div style={{ marginBottom: 32, textAlign: 'center' }}>
            <div style={{ fontSize: 40, marginBottom: 12 }}>🔒</div>
            <div style={{ fontSize: 20, fontWeight: 700, color: C.text }}>{projectTitle || '此專案'}</div>
            <div style={{ fontSize: 13, color: C.textSec, marginTop: 6 }}>請輸入密碼以進入</div>
          </div>
          <div style={{ width: '100%', maxWidth: 360 }}>
            <input
              style={{ ...S.input, marginBottom: 12, border: `1px solid ${error ? C.danger : C.border}`, textAlign: 'center', fontSize: 16, letterSpacing: '0.1em' }}
              type="password" placeholder="輸入密碼"
              value={input} onChange={e => setInput(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && attempt()}
              autoFocus
            />
            {error && <div style={{ textAlign: 'center', color: C.danger, fontSize: 13, marginBottom: 10 }}>密碼錯誤，請再試一次</div>}
            <button style={{ ...btn('primary'), width: '100%', padding: 13 }} onClick={attempt}>進入專案</button>
          </div>
        </div>
      );
    }

    // ─── APP ROOT ────────────────────────────────────────────────────────────────
    function App() {
      const [projectId, setProjectId] = useState(() => new URLSearchParams(window.location.search).get('p'));
      const [projectTitle, setProjectTitle] = useState('未命名專案');
      const [meetingDate, setMeetingDate] = useState('');
      const [meetingTime, setMeetingTime] = useState('');
      const [authed,    setAuthed]    = useState(false);
      const [phase,     setPhase]     = useState(0);
      const [proposals, setProposals] = useState([]);
      const [audioBlob, setAudioBlob] = useState(null);
      const [syncOk,    setSyncOk]    = useState(true);
      const [journal,   setJournal]   = useState([]);
      const [briefing,  setBriefing]  = useState('');
      // Route C:此專案綁定的 Notion parent page id(歸檔時傳給 notion-sync)
      const [notionParentPageId, setNotionParentPageId] = useState('');
      const [isRecording, setIsRecording] = useState(false);
      const [recordingSeconds, setRecordingSeconds] = useState(0);
      const [headerHidden, setHeaderHidden] = useState(false);
      const [isFullscreen, setIsFullscreen] = useState(false);
      const lastScrollY = useRef(0);

      // ─── App 層全螢幕按鈕（Meeting 元件外，確保 position:fixed 不受父層影響）─────
      useEffect(() => {
        const onFSChange = () => {
          setIsFullscreen(!!(document.fullscreenElement || document.webkitFullscreenElement));
        };
        document.addEventListener('fullscreenchange', onFSChange);
        document.addEventListener('webkitfullscreenchange', onFSChange);
        return () => {
          document.removeEventListener('fullscreenchange', onFSChange);
          document.removeEventListener('webkitfullscreenchange', onFSChange);
        };
      }, []);

      const toggleFullscreen = () => {
        const isFS = document.fullscreenElement || document.webkitFullscreenElement;
        if (isFS) {
          if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        } else {
          const iframe = document.querySelector('iframe');
          const target = iframe || document.body;
          if (target.requestFullscreen) target.requestFullscreen().catch(e => console.warn('全螢幕失敗:', e));
          else if (target.webkitRequestFullscreen) target.webkitRequestFullscreen();
        }
      };

      // Meeting 每秒回呼：active=是否錄音中, seconds=累積總秒數
      const handleRecordingChange = (active, seconds = 0) => {
        setIsRecording(active);
        if (active) setRecordingSeconds(seconds);
      };

      // ─── Header 隱藏/顯示（全螢幕請求已移到 tab onClick，避免被瀏覽器擋）─────────────
      useEffect(() => {
        if (phase === 1) {
          setHeaderHidden(true);
          lastScrollY.current = window.scrollY;
        } else {
          setHeaderHidden(false);
        }
      }, [phase]);

      // 往上滑：退出全螢幕，Header 重新出現
      useEffect(() => {
        if (phase !== 1) return;
        // 退出全螢幕的 helper（含 Safari webkit 前綴）
        const exitFS = () => {
          const isFS = document.fullscreenElement || document.webkitFullscreenElement;
          if (isFS) {
            if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
          }
        };
        const onScroll = () => {
          const y = window.scrollY;
          if (y < lastScrollY.current - 40) {
            // 往上滑超過 40px
            exitFS();
            setHeaderHidden(false);
          } else if (y > lastScrollY.current + 10) {
            // 往下滑就隱藏 Header
            setHeaderHidden(true);
          }
          lastScrollY.current = y;
        };
        // 觸控裝置：用 touchstart/touchend 偵測上滑手勢
        let touchStartY = 0;
        const onTouchStart = (e) => { touchStartY = e.touches[0].clientY; };
        const onTouchEnd = (e) => {
          const dy = e.changedTouches[0].clientY - touchStartY;
          if (dy > 60) {
            // 往下拉（手指向下移動超過 60px）→ 顯示 Header
            exitFS();
            setHeaderHidden(false);
          }
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('touchstart', onTouchStart, { passive: true });
        window.addEventListener('touchend', onTouchEnd, { passive: true });
        return () => {
          window.removeEventListener('scroll', onScroll);
          window.removeEventListener('touchstart', onTouchStart);
          window.removeEventListener('touchend', onTouchEnd);
        };
      }, [phase]);

      useEffect(() => {
        if (!projectId) return;
        // Check session auth
        if (sessionStorage.getItem(`mk_auth_${projectId}`)) setAuthed(true);
        // Load journal from Supabase
        db(`journals?project_id=eq.${projectId}&order=created_at.asc`).then(r => r.json()).then(d => { if (Array.isArray(d)) setJournal(d); }).catch(() => {});
        // Load project info(含 notion_parent_page_id,給 syncEntryToNotion 用)
        db(`projects?id=eq.${projectId}&select=title,meeting_date,meeting_time,briefing,notion_parent_page_id`).then(r => r.json()).then(d => {
          if (d[0]?.title) setProjectTitle(d[0].title);
          if (d[0]?.meeting_date) setMeetingDate(d[0].meeting_date);
          if (d[0]?.meeting_time) setMeetingTime(d[0].meeting_time);
          if (d[0]?.briefing) setBriefing(d[0].briefing);
          if (d[0]?.notion_parent_page_id) setNotionParentPageId(d[0].notion_parent_page_id);
        }).catch(() => {});
      }, [projectId]);

      const enterProject = (id) => {
        setProjectId(id);
        setAuthed(false);
        window.history.pushState({}, '', `?p=${id}`);
        // 記錄到最近使用
        try {
          const recent = JSON.parse(localStorage.getItem('mk_recent_projects') || '[]');
          const updated = [{ id, lastVisited: new Date().toISOString() }, ...recent.filter(p => p.id !== id)].slice(0, 8);
          localStorage.setItem('mk_recent_projects', JSON.stringify(updated));
        } catch {}
      };

      // ─── 同步單筆日誌到 Notion ───────────────────────────────────
      // 成功後把 notion_page_id 寫回 journals 表,避免重整/重開後重複同步
      const syncEntryToNotion = async (entry) => {
        const isoDate = new Date().toISOString().split('T')[0];
        try {
          const res = await fetch(`${SB_URL}/functions/v1/notion-sync`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${SB_KEY}`,
            },
            body: JSON.stringify({ journal: entry, projectTitle, isoDate, notionParentPageId: notionParentPageId || null }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Notion 同步失敗');
          // 持久化：把 notion_page_id 寫回 DB（schema 需要有此欄位,見 docs/README）
          if (data.notionPageId && entry.id) {
            try {
              await db(`journals?id=eq.${entry.id}`, {
                method: 'PATCH',
                body: JSON.stringify({ notion_page_id: data.notionPageId }),
              });
            } catch (patchErr) {
              console.warn('notion_page_id 寫回失敗（欄位可能未建立）:', patchErr);
            }
          }
          return { ok: true, url: data.notionUrl, pageId: data.notionPageId };
        } catch (e) {
          console.error('Notion sync failed:', e);
          return { ok: false };
        }
      };

      const saveToJournal = async ({ proposals, transcript, summary }) => {
        // DB 存的是精簡版（journals 表沒有 attachments 欄位）
        const dbEntry = {
          id: Date.now().toString(),
          project_id: projectId,
          date: new Date().toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric' }),
          proposals: proposals.map(p => ({ title: p.title, author: p.author, content: p.content })),
          transcript, summary,
        };
        // Notion 用的完整版（含附件 render 圖 URLs、抽取文字、格式警告）
        const notionEntry = { ...dbEntry, proposals };
        try {
          await db('journals', { method: 'POST', body: JSON.stringify(dbEntry) });
        } catch (e) { console.error('Journal save failed', e); }
        // 同步到 Notion（背景執行，不阻擋流程）
        syncEntryToNotion(notionEntry).then(result => {
          if (result.ok) {
            setJournal(prev => prev.map(j => j.id === dbEntry.id ? { ...j, notion_page_id: result.pageId, notionUrl: result.url } : j));
          }
        });
        setJournal(prev => [...prev, { ...dbEntry }]);
        setPhase(3);
      };

      if (!projectId) return <Home onEnter={enterProject} />;
      if (!authed) return <PasswordGateInner projectId={projectId} projectTitle={projectTitle} onAuth={() => setAuthed(true)} />;

      return (
        <div>
          <Header
            phase={phase} setPhase={setPhase} syncOk={syncOk}
            journalCount={journal.length}
            projectId={projectId} projectTitle={projectTitle}
            onTitleSave={setProjectTitle}
            isRecording={isRecording}
            recordingSeconds={recordingSeconds}
            hidden={headerHidden}
          />
          {/* PreMeeting: 永遠掛載，避免切換 tab 時 unmount 導致草稿（提案者姓名/標題/內容/附件選擇）被清空 */}
          {/* 同事在準備期會在 tabs 之間來回切（檢查日誌、看附件、回提案區），切回來資料還在 */}
          <div style={{ display: phase === 0 ? 'block' : 'none' }}>
            <PreMeeting projectId={projectId} proposals={proposals} setProposals={setProposals} setSyncOk={setSyncOk} journal={journal} projectTitle={projectTitle} meetingDate={meetingDate} setMeetingDate={setMeetingDate} meetingTime={meetingTime} setMeetingTime={setMeetingTime} briefing={briefing} />
          </div>
          {/* Meeting: 永遠掛載，避免切換 tab 時 unmount 導致計時狀態歸零 */}
          <div style={{ display: phase === 1 ? 'block' : 'none' }}>
            <Meeting proposals={proposals} setProposals={setProposals} projectId={projectId} briefing={briefing}
              onGoHome={() => { setProjectId(null); window.history.pushState({}, '', window.location.pathname); }}
              setPhase={setPhase}
              onRecordingStateChange={handleRecordingChange} />
          </div>
          {phase === 2 && <PostMeeting proposals={proposals} audioBlob={audioBlob} onSaveJournal={saveToJournal} projectId={projectId} projectTitle={projectTitle} />}
          {phase === 3 && <Journal journal={journal} setJournal={setJournal} projectId={projectId} projectTitle={projectTitle} onSyncToNotion={syncEntryToNotion} />}
          {/* 全螢幕按鈕：只在會議進行時顯示，放在 App 最外層確保 position:fixed 正常 */}
          {phase === 1 && (
            <button onClick={toggleFullscreen} style={{
              position: 'fixed', bottom: 24, right: 24, zIndex: 9999,
              background: isFullscreen ? C.accent : C.bgPanel,
              border: `1px solid ${isFullscreen ? C.accent : C.border}`,
              borderRadius: 10, padding: '8px 14px',
              display: 'flex', alignItems: 'center', gap: 6,
              fontSize: 13, fontWeight: 600,
              color: isFullscreen ? '#fff' : C.textSec,
              cursor: 'pointer', backdropFilter: 'blur(12px)',
              boxShadow: '0 4px 20px rgba(0,0,0,0.5)',
            }}>
              {isFullscreen ? '↙ 縮小' : '↗ 全螢幕'}
            </button>
          )}
        </div>
      );
    }

    // ─── LOGIN GATE(Route C)─────────────────────────────────────────────────
    // 包在 App 外面,確保所有 db() 呼叫都發生在「有 session」的狀態下
    // 流程:
    //   1) 掛載時讀 localStorage 裡的既有 session(sb.auth.getSession)
    //   2) 沒 session → 顯示 email 輸入 + 「寄登入連結」按鈕
    //   3) 按下按鈕 → sb.auth.signInWithOtp({ email }) → Supabase 寄 magic link
    //   4) 使用者點信裡的連結 → 回到這個 URL,detectSessionInUrl 自動取 token
    //   5) 有 session 後,currentSession 被設好,db() helper 就會帶 user access_token
    function LoginGate({ children }) {
      const [session, setSession] = useState(null);
      const [loading, setLoading] = useState(true);
      const [email, setEmail] = useState(() => localStorage.getItem('mk_last_email') || '');
      const [sending, setSending] = useState(false);
      const [sent, setSent] = useState(false);
      const [err, setErr] = useState('');

      useEffect(() => {
        if (!sb) { setLoading(false); return; }
        // 初次載入:讀既有 session + 聽 auth 變化
        sb.auth.getSession().then(({ data }) => {
          setCurrentSession(data.session || null);
          setSession(data.session || null);
          setLoading(false);
        }).catch(() => setLoading(false));
        const { data: sub } = sb.auth.onAuthStateChange((_event, s) => {
          setCurrentSession(s || null);
          setSession(s || null);
        });
        return () => { sub?.subscription?.unsubscribe?.(); };
      }, []);

      const sendLink = async () => {
        const em = email.trim().toLowerCase();
        if (!em || !em.includes('@')) { setErr('請輸入有效 email'); return; }
        setSending(true); setErr('');
        try {
          const { error } = await sb.auth.signInWithOtp({
            email: em,
            options: { emailRedirectTo: window.location.href.split('?')[0] },
          });
          if (error) throw error;
          localStorage.setItem('mk_last_email', em);
          setSent(true);
        } catch (e) {
          setErr(e.message || '寄信失敗');
        } finally {
          setSending(false);
        }
      };

      const signOut = async () => {
        await sb.auth.signOut();
        setCurrentSession(null);
        setSession(null);
        // 重新整理把 URL 上的 ?p= 清掉,回到 home
        window.location.href = window.location.pathname;
      };

      if (loading) {
        return (
          <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#888' }}>
            載入中…
          </div>
        );
      }

      if (!session) {
        return (
          <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
            <div style={{ width: '100%', maxWidth: 400 }}>
              <div style={{ textAlign: 'center', marginBottom: 32 }}>
                <div style={{ fontSize: 48, marginBottom: 12 }}>◈</div>
                <div style={{ fontSize: 28, fontWeight: 700, letterSpacing: '-0.03em' }}>MeetKit</div>
                <div style={{ fontSize: 13, color: '#888', marginTop: 8 }}>輸入 email,我們會寄一個登入連結給你</div>
              </div>
              {sent ? (
                <div style={{ background: '#1a2b1f', border: '1px solid #2d5a3d', borderRadius: 10, padding: 20, textAlign: 'center' }}>
                  <div style={{ fontSize: 28, marginBottom: 10 }}>✉️</div>
                  <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 6 }}>登入連結已寄出</div>
                  <div style={{ fontSize: 13, color: '#9cc0a8', lineHeight: 1.6 }}>
                    請到 <b>{email}</b> 收信,<br/>點裡面的「Log In」連結即可進入 MeetKit。
                  </div>
                  <button onClick={() => setSent(false)}
                    style={{ marginTop: 16, background: 'transparent', border: '1px solid #2a4a30', color: '#9cc0a8', padding: '8px 16px', borderRadius: 8, cursor: 'pointer', fontSize: 12 }}>
                    寄到別的信箱
                  </button>
                </div>
              ) : (
                <div style={{ background: '#151821', border: '1px solid #2a2d35', borderRadius: 10, padding: 20 }}>
                  <label style={{ display: 'block', fontSize: 12, color: '#888', marginBottom: 8 }}>Email</label>
                  <input type="email" value={email} onChange={e => setEmail(e.target.value)}
                    placeholder="you@example.com" autoFocus
                    onKeyDown={e => { if (e.key === 'Enter') sendLink(); }}
                    style={{ width: '100%', background: '#0f1117', border: '1px solid #2a2d35', borderRadius: 8, padding: '10px 12px', color: '#e8e8e8', fontSize: 14, boxSizing: 'border-box', marginBottom: 12 }} />
                  {err && <div style={{ color: '#f88', fontSize: 12, marginBottom: 10 }}>{err}</div>}
                  <button onClick={sendLink} disabled={sending}
                    style={{ width: '100%', background: sending ? '#2a3340' : '#3b82f6', border: 'none', color: '#fff', padding: '11px', borderRadius: 8, cursor: sending ? 'wait' : 'pointer', fontSize: 14, fontWeight: 600 }}>
                    {sending ? '寄送中…' : '寄登入連結到我的信箱'}
                  </button>
                  <div style={{ fontSize: 11, color: '#666', marginTop: 12, lineHeight: 1.5 }}>
                    寄件人是 <code style={{ background: '#0f1117', padding: '1px 5px', borderRadius: 3 }}>meetkit@mx.design</code>。<br/>
                    沒收到的話,檢查垃圾信夾。
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      }

      // 已登入 → 渲染 App,並提供一個右上角的「登出」浮鈕
      return (
        <>
          {children}
          <button onClick={signOut}
            title={`登入為 ${session.user?.email}`}
            style={{
              position: 'fixed', bottom: 16, left: 16, zIndex: 9998,
              background: 'rgba(21,24,33,0.85)', border: '1px solid #2a2d35',
              borderRadius: 8, padding: '6px 10px', color: '#888', fontSize: 11,
              cursor: 'pointer', backdropFilter: 'blur(8px)',
            }}>
            {session.user?.email}　⎋ 登出
          </button>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      sb ? <LoginGate><App /></LoginGate> : <App />
    );
  </script>
</body>
</html>
