<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ─── SUPABASE ────────────────────────────────────────────────────────────────
    const SB_URL = "https://yrugcgzkomydmorgzwhb.supabase.co";
    const SB_KEY = "sb_publishable_m3Qi3HdfMT2pbcQHVuGxNw_696C0jYa";

    // Supabase JS SDK client(給 auth.signInWithOtp / getSession 用)
    // 注意:resthook 不用它,db() 還是直接 fetch REST API,只是 Authorization 改帶 user access_token
    const sb = (window.supabase && typeof window.supabase.createClient === 'function')
      ? window.supabase.createClient(SB_URL, SB_KEY, {
          auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
        })
      : null;

    // 目前的使用者 session(access_token / email),由 App 頂層 onAuthStateChange 維護
    // 未登入時 = null,db() 會退回用 anon key(但 RLS 會擋掉,只看得到公開資料)
    let currentSession = null;
    const setCurrentSession = (s) => { currentSession = s; };
    const getBearer = () => (currentSession?.access_token) || SB_KEY;

    // ─── EDGE FUNCTION 代理（Phase C：API key 不再暴露於前端） ────────────────
    // 所有 OpenAI / Anthropic 呼叫都改走這裡，key 存在 Supabase Edge Function secrets
    const EDGE_BASE = `${SB_URL}/functions/v1`;
    const EDGE_HEADERS = {
      'Authorization': `Bearer ${SB_KEY}`,
      'apikey': SB_KEY,
      'Content-Type': 'application/json',
    };

    // db(): REST API 呼叫 helper
    // Authorization 帶使用者 access_token(RLS 才能拿到 auth.jwt()->>'email')
    // apikey 永遠帶 SB_KEY(publishable),這是 Supabase REST 的必要欄位
    // 注意 spread 順序:opts 先展開,headers 最後才合併,避免呼叫者傳 headers 時把預設的 apikey/Authorization 整個覆蓋掉(先前 2026-04-25 project_members 401 的根因)
    const db = (path, opts = {}) =>
      fetch(`${SB_URL}/rest/v1/${path}`, {
        ...opts,
        headers: {
          apikey: SB_KEY,
          Authorization: `Bearer ${getBearer()}`,
          "Content-Type": "application/json",
          Prefer: "return=representation",
          ...opts.headers,
        },
      });

    // ─── 附件文字抽取 ─────────────────────────────────────────────────────────────
    // ─── ATTACHMENT EXTRACTION (text + vision) ───────────────────────────────
    // 提案附件可能是 PDF/圖片/DOCX/TXT/PPT。支援範圍：
    //   PDF → 每頁 render 成 JPEG，送 Claude vision（保留圖片/版面）
    //   PNG/JPG/WEBP/GIF → 直接 base64 送 Claude vision
    //   DOCX/TXT/MD/RTF → 抽純文字
    //   PPT/PPTX/KEY → 提示使用者匯出 PDF（瀏覽器無法可靠解析）
    // 回傳: { kind, fileName, blocks?, text? }
    //   blocks 是 Claude API 相容的圖片 content blocks（也可轉成 OpenAI vision 格式）

    const PDF_VISION_MAX_PAGES = 30; // 超過只取前 N 頁，避免 token 爆炸
    const PDF_VISION_SCALE = 1.5;    // 約 1280×960，Claude 閱讀足夠

    // Blob → base64 純字串（去掉 data:...;base64, 前綴）
    const blobToBase64 = (blob) => new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onloadend = () => resolve(r.result.split(',')[1]);
      r.onerror = reject;
      r.readAsDataURL(blob);
    });

    // canvas → JPEG base64（JPEG 比 PNG 小 5-10 倍,視覺無損）
    const canvasToJpegBase64 = (canvas, quality = 0.8) => {
      const dataUrl = canvas.toDataURL('image/jpeg', quality);
      return dataUrl.split(',')[1];
    };

    // base64 → Blob（Storage 上傳要 binary body）
    const base64ToBlob = (b64, mime) => {
      const bin = atob(b64);
      const buf = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
      return new Blob([buf], { type: mime });
    };

    // 把已 render 的圖片上傳到 Supabase Storage（Notion 需要公開 URL 才能嵌入）
    // 路徑: presentations/{projectId}/renders/{fileName}
    // 回傳公開 URL,失敗回 null
    const uploadRenderedToStorage = async (projectId, fileName, blob, mime) => {
      const path = `${projectId}/renders/${fileName}`;
      try {
        const res = await fetch(`${SB_URL}/storage/v1/object/presentations/${path}`, {
          method: 'POST',
          headers: {
            apikey: SB_KEY,
            Authorization: `Bearer ${SB_KEY}`,
            'Content-Type': mime || 'application/octet-stream',
            'x-upsert': 'true',
          },
          body: blob,
        });
        if (!res.ok) return null;
        return `${SB_URL}/storage/v1/object/public/presentations/${path}`;
      } catch {
        return null;
      }
    };

    // 清理檔名,僅保留 Storage 安全字元
    const safeStem = (name) => {
      const stem = (name || 'file').replace(/\.[^.]+$/, '');
      return stem.replace(/[^a-zA-Z0-9._-]/g, '_').slice(0, 60) || 'file';
    };

    const pdfToImageBlocks = async (fileUrl) => {
      if (typeof pdfjsLib === 'undefined') return [];
      const res = await fetch(fileUrl);
      if (!res.ok) return [];
      const buf = await res.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
      const pages = Math.min(pdf.numPages, PDF_VISION_MAX_PAGES);
      const blocks = [];
      for (let i = 1; i <= pages; i++) {
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: PDF_VISION_SCALE });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        blocks.push({
          type: 'image',
          source: { type: 'base64', media_type: 'image/jpeg', data: canvasToJpegBase64(canvas) },
        });
      }
      return { blocks, totalPages: pdf.numPages, includedPages: pages };
    };

    // PPTX 半解：JSZip 拆 zip → 抽每張 slide 的 XML 文字 + ppt/media/ 裡的圖片
    // 版面配置會遺失，但文字+原圖都保留，比純文字好很多
    const PPTX_MAX_IMAGES = 40;
    const pptxToParts = async (fileUrl) => {
      if (typeof JSZip === 'undefined') return null;
      const res = await fetch(fileUrl);
      if (!res.ok) return null;
      const buf = await res.arrayBuffer();
      const zip = await JSZip.loadAsync(buf);

      // 1) 每張 slide 的文字（按 slide1.xml, slide2.xml... 排序）
      const slideEntries = Object.keys(zip.files)
        .filter(k => /^ppt\/slides\/slide\d+\.xml$/.test(k))
        .sort((a, b) => {
          const na = parseInt(a.match(/slide(\d+)/)[1], 10);
          const nb = parseInt(b.match(/slide(\d+)/)[1], 10);
          return na - nb;
        });
      const slideTexts = [];
      for (const key of slideEntries) {
        const xml = await zip.files[key].async('string');
        // <a:t>...</a:t> 是實際文字內容
        const matches = [...xml.matchAll(/<a:t[^>]*>([^<]*)<\/a:t>/g)];
        const text = matches.map(m => m[1]).join(' ').replace(/\s+/g, ' ').trim();
        const n = parseInt(key.match(/slide(\d+)/)[1], 10);
        if (text) slideTexts.push(`【Slide ${n}】${text}`);
      }

      // 2) 內嵌圖片（PNG/JPG/JPEG/GIF/WEBP）→ base64 image blocks
      const mediaEntries = Object.keys(zip.files)
        .filter(k => /^ppt\/media\/.*\.(png|jpg|jpeg|gif|webp)$/i.test(k))
        .sort()
        .slice(0, PPTX_MAX_IMAGES);
      const blocks = [];
      for (const key of mediaEntries) {
        const ext = key.split('.').pop().toLowerCase();
        const mime = ext === 'jpg' ? 'image/jpeg' : `image/${ext}`;
        const blob = await zip.files[key].async('blob');
        const data = await blobToBase64(blob);
        blocks.push({ type: 'image', source: { type: 'base64', media_type: mime, data } });
      }

      return {
        text: slideTexts.join('\n'),
        blocks,
        totalImages: mediaEntries.length,
      };
    };

    // DOCX 半解：mammoth 只抽文字,但 .docx 是 zip,裡面 word/media/ 存著所有內嵌圖
    // 用 JSZip 補抽圖片,跟 PPTX 走一樣的 path,這樣含圖 DOCX 也能完整還原
    const DOCX_MAX_IMAGES = 40;
    const docxToParts = async (fileUrl) => {
      if (typeof JSZip === 'undefined' || typeof mammoth === 'undefined') return null;
      const res = await fetch(fileUrl);
      if (!res.ok) return null;
      const buf = await res.arrayBuffer();

      // 1) 用 mammoth 抽純文字(保留原本流程)
      let text = '';
      try {
        const r = await mammoth.extractRawText({ arrayBuffer: buf });
        text = r.value || '';
      } catch (e) {
        console.warn('mammoth 抽文字失敗:', e.message);
      }

      // 2) 用 JSZip 抽 word/media/ 裡的圖片
      let blocks = [];
      let totalImages = 0;
      try {
        const zip = await JSZip.loadAsync(buf);
        const mediaEntries = Object.keys(zip.files)
          .filter(k => /^word\/media\/.*\.(png|jpg|jpeg|gif|webp)$/i.test(k))
          .sort()
          .slice(0, DOCX_MAX_IMAGES);
        totalImages = mediaEntries.length;
        for (const key of mediaEntries) {
          const ext = key.split('.').pop().toLowerCase();
          const mime = ext === 'jpg' ? 'image/jpeg' : `image/${ext}`;
          const blob = await zip.files[key].async('blob');
          const data = await blobToBase64(blob);
          blocks.push({ type: 'image', source: { type: 'base64', media_type: mime, data } });
        }
      } catch (e) {
        console.warn('JSZip 解 DOCX 失敗(純文字 fallback):', e.message);
      }

      return { text, blocks, totalImages };
    };

    // ─── GEMINI UNIVERSAL ATTACHMENT DESCRIBER ─────────────────────────────────
    // 統一用 Gemini 2.5 Flash 處理所有格式附件,產出結構化 Markdown 描述,
    // 後續 Claude 摘要時只讀這段描述,不必再重吃 raw vision tokens,省錢又一致。
    //
    // 策略：
    //   PDF   → 直接 base64 丟 Gemini（原生支援 1000 頁內）
    //   PPTX  → JSZip 已抽出的 slide 文字 + 每張內嵌圖(base64) 丟 Gemini
    //   DOCX  → mammoth 抽出的文字 丟 Gemini
    //   圖片  → base64 直接丟 Gemini
    //
    // 若 Gemini 失敗,前端照舊用 JSZip/mammoth/pdf.js 的輸出餵給 Claude,保留 fallback。

    const GEMINI_DESCRIBE_PROMPT = `你是一位專業的提案內容分析助理。你的任務是仔細閱讀這份附件,產出一份結構化的 Markdown 描述,讓其他 AI(例如 Claude)讀到後能完整理解這份附件的內容,不必再看原檔。

請務必使用下列格式,不要省略任何章節(若該章節沒內容就寫「無」):

## 整體概述
(2-3 句精簡說明:這份附件在講什麼?目的是什麼?給誰看?)

## 關鍵資訊
- 重要人名/公司/產品/概念(含英文原名若有)
- 重要數字(價格、時間、尺寸、數量)
- 重要日期與里程碑
- 明確的決策點、方案對比、選項清單

## 視覺元素描述
(若附件含圖片/簡報頁面,每張圖或每頁各一段,說明:配色風格、排版結構、主要視覺元素、圖表資訊、設計意圖。若無視覺元素就寫「本附件為純文字」)

## 重點原文引用
(從原檔挑 3-5 句或段落,最能代表這份提案核心觀點的原文,用 > 引用格式)

## 未能解析
(任何模糊、缺字、圖太小看不清的部分。如無,寫「無」)

請用繁體中文輸出,不要加任何開場白或結尾語,直接從 ## 整體概述 開始。`;

    const GEMINI_MAX_PDF_BYTES = 20 * 1024 * 1024;   // 20MB 保守上限(Gemini inline 上限更大,但 base64 膨脹 33%)
    const GEMINI_MAX_IMAGES_PER_CALL = 20;            // 一次最多吃 20 張圖,超過分批

    // 核心:把已抽好的 parts 組成 Gemini contents.parts 陣列 → 呼叫 proxy → 回傳 Markdown 描述
    // 回傳字串(Markdown)或 null(失敗)
    const callGeminiDescribe = async (geminiParts, fileName) => {
      try {
        const headerText = `檔名:${fileName || '(未知)'}`;
        const parts = [{ text: headerText }, ...geminiParts];
        const res = await fetch(`${EDGE_BASE}/gemini-proxy`, {
          method: 'POST',
          headers: EDGE_HEADERS,
          body: JSON.stringify({
            model: 'gemini-2.5-flash',
            systemInstruction: GEMINI_DESCRIBE_PROMPT,
            parts,
            generationConfig: {
              temperature: 0.3,
              maxOutputTokens: 4096,
              thinkingConfig: { thinkingBudget: 0 }, // 關掉思考模式,附件描述不需要 reasoning
            },
          }),
        });
        if (!res.ok) {
          const e = await res.json().catch(() => ({}));
          console.warn('Gemini describe 失敗:', e.error || `HTTP ${res.status}`);
          return null;
        }
        const data = await res.json();
        return (data.text || '').trim() || null;
      } catch (e) {
        console.warn('Gemini describe 例外:', e.message);
        return null;
      }
    };

    // PDF → 直接送整份 PDF(Gemini 原生支援)
    const geminiDescribePdf = async (fileUrl, fileName) => {
      try {
        const res = await fetch(fileUrl);
        if (!res.ok) return null;
        const blob = await res.blob();
        if (blob.size > GEMINI_MAX_PDF_BYTES) {
          console.warn(`PDF ${fileName} 超過 ${GEMINI_MAX_PDF_BYTES/1024/1024}MB,跳過 Gemini`);
          return null;
        }
        const data = await blobToBase64(blob);
        return await callGeminiDescribe([
          { inline_data: { mime_type: 'application/pdf', data } },
        ], fileName);
      } catch (e) {
        console.warn('geminiDescribePdf 失敗:', e.message);
        return null;
      }
    };

    // PPTX → 已抽好的 slide 文字 + 內嵌圖 base64
    const geminiDescribePptx = async (pptxResult, fileName) => {
      const parts = [];
      if (pptxResult.text) {
        parts.push({ text: `【簡報文字】\n${pptxResult.text.slice(0, 20000)}` });
      }
      const imgBlocks = (pptxResult.blocks || []).slice(0, GEMINI_MAX_IMAGES_PER_CALL);
      for (const b of imgBlocks) {
        if (b.type === 'image' && b.source?.data) {
          parts.push({ inline_data: { mime_type: b.source.media_type, data: b.source.data } });
        }
      }
      if (parts.length === 0) return null;
      return await callGeminiDescribe(parts, fileName);
    };

    // DOCX → 抽好的純文字 + 內嵌圖(選填)。txt/md/rtf 只有 text 沒 blocks,走一樣的 path
    const geminiDescribeDocx = async (text, fileName, blocks = []) => {
      const parts = [];
      if (text?.trim()) {
        parts.push({ text: `【文件內容】\n${text.slice(0, 30000)}` });
      }
      const imgBlocks = (blocks || []).slice(0, GEMINI_MAX_IMAGES_PER_CALL);
      for (const b of imgBlocks) {
        if (b.type === 'image' && b.source?.data) {
          parts.push({ inline_data: { mime_type: b.source.media_type, data: b.source.data } });
        }
      }
      if (parts.length === 0) return null;
      return await callGeminiDescribe(parts, fileName);
    };

    // 單張圖片 → base64 直接送
    const geminiDescribeImage = async (fileUrl, mime, fileName) => {
      try {
        const res = await fetch(fileUrl);
        if (!res.ok) return null;
        const blob = await res.blob();
        const data = await blobToBase64(blob);
        return await callGeminiDescribe([
          { inline_data: { mime_type: mime, data } },
        ], fileName);
      } catch (e) {
        console.warn('geminiDescribeImage 失敗:', e.message);
        return null;
      }
    };

    // ─── NOTION 連結解析 ──────────────────────────────────────────────
    // 提案 content 裡可能塞 Notion 頁連結(例如品牌調研、先前會議紀錄),
    // 呼叫 notion-fetch Edge Function 把整頁攤平成 markdown,交給 Claude 當額外上下文
    //
    // 支援格式:
    //   https://www.notion.so/Title-abc123def456...
    //   https://notion.so/workspace/abc123def456...
    //   https://qmore.notion.site/Page-abc123...
    const NOTION_URL_RE = /https?:\/\/(?:www\.)?(?:notion\.so|[a-z0-9-]+\.notion\.site)\/[^\s)\]]*/gi;

    const extractNotionPageId = (url) => {
      if (!url) return '';
      const m = url.match(/([0-9a-f]{32}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/i);
      return m ? m[1].replace(/-/g, '').toLowerCase() : '';
    };

    // 掃 proposal content,把所有 Notion URL 抓出來打 notion-fetch,回傳 [{ url, pageId, title, markdown }]
    // 失敗的頁(integration 沒分享等)會回 { url, pageId, error: '...' }
    const fetchProposalNotionRefs = async (content) => {
      if (!content || typeof content !== 'string') return [];
      const urls = [...new Set(content.match(NOTION_URL_RE) || [])];
      if (urls.length === 0) return [];
      const results = [];
      for (const url of urls) {
        const pageId = extractNotionPageId(url);
        if (!pageId) continue;
        try {
          const res = await fetch(`${EDGE_BASE}/notion-fetch`, {
            method: 'POST',
            headers: EDGE_HEADERS,
            body: JSON.stringify({ pageId, test: false }),
          });
          const data = await res.json();
          if (data.ok) {
            results.push({
              url,
              pageId,
              title: data.title || '(無標題)',
              markdown: data.markdown || '',
              blockCount: data.blockCount || 0,
            });
          } else {
            results.push({ url, pageId, error: data.hint || data.error || '無法讀取' });
          }
        } catch (e) {
          results.push({ url, pageId, error: e.message || '連線失敗' });
        }
      }
      return results;
    };

    const extractAttachmentParts = async (fileUrl, fileName) => {
      const base = { fileName, originalUrl: fileUrl };
      try {
        const ext = (fileName || fileUrl).split('.').pop().toLowerCase().split('?')[0];

        // Apple 專有 / 2003 舊格式 → 提示匯出
        if (['key', 'pages', 'numbers'].includes(ext)) {
          return { ...base, kind: 'needs-export', hint: '請在 Keynote/Pages/Numbers 裡按 Cmd+E 匯出為 PDF，再重新上傳' };
        }
        if (['ppt', 'doc', 'xls'].includes(ext)) {
          return { ...base, kind: 'needs-export', hint: `${ext.toUpperCase()} 為 2003 舊格式，請另存新檔為 .${ext}x 或匯出 PDF` };
        }

        if (ext === 'pptx') {
          const r = await pptxToParts(fileUrl);
          if (!r) return { ...base, kind: 'empty' };
          // Gemini 統一描述(失敗時 description 為 null,Claude 會 fallback 回 text+blocks)
          const description = await geminiDescribePptx(r, fileName);
          return { ...base, kind: 'pptx', text: r.text, blocks: r.blocks, description, note: `(PPTX 半解:文字 + ${r.totalImages} 張內嵌圖,版面配置已遺失)` };
        }

        if (ext === 'pdf') {
          const r = await pdfToImageBlocks(fileUrl);
          if (!r || !r.blocks.length) return { ...base, kind: 'empty' };
          // PDF 送整份原檔給 Gemini(原生支援)
          const description = await geminiDescribePdf(fileUrl, fileName);
          return { ...base, kind: 'vision', blocks: r.blocks, description, totalPages: r.totalPages, includedPages: r.includedPages, note: r.totalPages > r.includedPages ? `(共 ${r.totalPages} 頁,只分析前 ${r.includedPages} 頁)` : '' };
        }

        if (['png', 'jpg', 'jpeg', 'webp', 'gif'].includes(ext)) {
          const res = await fetch(fileUrl);
          if (!res.ok) return { ...base, kind: 'empty' };
          const blob = await res.blob();
          const data = await blobToBase64(blob);
          const mime = ext === 'jpg' ? 'image/jpeg' : `image/${ext}`;
          // 圖片原檔已在 Storage(file_url 就是 public URL),Notion 可直接用 originalUrl,不需重傳
          const description = await geminiDescribeImage(fileUrl, mime, fileName);
          return { ...base, kind: 'vision', blocks: [{ type: 'image', source: { type: 'base64', media_type: mime, data } }], description, isDirectImage: true };
        }

        if (ext === 'docx') {
          const r = await docxToParts(fileUrl);
          if (!r || (!r.text && (!r.blocks || !r.blocks.length))) return { ...base, kind: 'empty' };
          // Gemini 吃文字 + 內嵌圖,描述會連圖一起分析
          const description = await geminiDescribeDocx(r.text, fileName, r.blocks);
          const note = r.totalImages > 0 ? `(DOCX:文字 + ${r.totalImages} 張內嵌圖)` : '';
          return { ...base, kind: 'docx', text: r.text, blocks: r.blocks, description, note };
        }

        if (['txt', 'md', 'rtf'].includes(ext)) {
          const res = await fetch(fileUrl);
          if (!res.ok) return { ...base, kind: 'empty' };
          const text = await res.text();
          const description = await geminiDescribeDocx(text, fileName);
          return { ...base, kind: 'text', text, description };
        }

        return { ...base, kind: 'empty' };
      } catch (e) {
        console.warn('附件抽取失敗:', fileName, e.message);
        return { ...base, kind: 'empty' };
      }
    };

    // 把提案附件的圖片 render 結果上傳到 Storage,產出 Notion-ready 的附件資料
    // 回傳 proposals 陣列（每個 proposal 多一個 attachments 欄位）,給 Edge Function 組 Notion blocks
    const archiveAttachmentsToStorage = async (projectId, proposalsWithParts) => {
      const result = [];
      for (const p of proposalsWithParts) {
        const attachments = [];
        for (const part of (p.parts || [])) {
          const att = {
            kind: part.kind,
            fileName: part.fileName,
            originalUrl: part.originalUrl,
            isDirectImage: !!part.isDirectImage,
            note: part.note || '',
            hint: part.hint || '',
            text: part.text || '',
            description: part.description || '', // Gemini 產出的統一描述
            images: [],
          };

          // needs-export / text / empty → 無須上傳,直接保留
          if (part.kind === 'vision' && part.isDirectImage) {
            // 直接用原檔 URL,不重傳
            att.images.push({ url: part.originalUrl, caption: part.fileName });
          } else if (part.kind === 'vision' && part.blocks?.length) {
            // PDF → 每頁 render 上傳
            const stem = safeStem(part.fileName);
            for (let i = 0; i < part.blocks.length; i++) {
              const b = part.blocks[i];
              if (b.type !== 'image') continue;
              const blob = base64ToBlob(b.source.data, b.source.media_type);
              const url = await uploadRenderedToStorage(projectId, `${stem}-p${i + 1}.jpg`, blob, b.source.media_type);
              if (url) att.images.push({ url, caption: `${part.fileName} – 第 ${i + 1} 頁` });
            }
          } else if ((part.kind === 'pptx' || part.kind === 'docx') && part.blocks?.length) {
            const stem = safeStem(part.fileName);
            for (let i = 0; i < part.blocks.length; i++) {
              const b = part.blocks[i];
              if (b.type !== 'image') continue;
              const ext = (b.source.media_type.split('/')[1] || 'jpg').replace('jpeg', 'jpg');
              const blob = base64ToBlob(b.source.data, b.source.media_type);
              const url = await uploadRenderedToStorage(projectId, `${stem}-img${i + 1}.${ext}`, blob, b.source.media_type);
              if (url) att.images.push({ url, caption: `${part.fileName} – 圖 ${i + 1}` });
            }
          }

          attachments.push(att);
        }
        result.push({
          title: p.title,
          author: p.author,
          content: p.content,
          attachments,
        });
      }
      return result;
    };

    const genId = () => Math.random().toString(36).slice(2, 8).toUpperCase();

    // ─── AUDIO PIPELINE ──────────────────────────────────────────────────────────
    // Web Audio API 原生切段 → 並行 Whisper 上傳 → 合併逐字稿
    // 完全不用 ffmpeg.wasm（實測在 Safari + 慢網路 + 長檔下載失敗率高，改走純瀏覽器 API）
    // 決策文件：docs/audio-pipeline.md
    // ─────────────────────────────────────────────────────────────────────────────

    const AUDIO_CONFIG = {
      sampleRate: 16000,
      channels: 1,
      parallelChannels: 2,
      retryAttempts: 5,
      retryDelayMs: 3000,
      maxFileSizeMB: 500,
      whisperLanguage: 'zh',
      whisperPrompt: 'Cosmoship, 宇宙小艇, SIPAI, 偷瞄的X, MX Design, Figma, Supabase, Anthropic, Claude, ComfyUI, Flux, MeetKit',
    };

    // 階段 3a：單段 Whisper（含重試）
    const transcribeSegment = async (segment, openaiKey, attempt = 1) => {
      try {
        const fd = new FormData();
        // 依 blob 類型決定副檔名，Whisper 用副檔名判斷格式
        const blobType = segment.blob.type || '';
        const ext = blobType.includes('mp4') || blobType.includes('m4a') ? 'm4a'
                  : blobType.includes('webm') ? 'webm'
                  : blobType.includes('ogg') || blobType.includes('opus') ? 'ogg'
                  : blobType.includes('mpeg') || blobType.includes('mp3') ? 'mp3'
                  : blobType.includes('wav') ? 'wav'
                  : 'm4a'; // 預設
        fd.append('file', segment.blob, `segment-${segment.index}.${ext}`);
        fd.append('model', 'whisper-1');
        fd.append('language', AUDIO_CONFIG.whisperLanguage);
        fd.append('prompt', AUDIO_CONFIG.whisperPrompt);
        fd.append('response_format', 'verbose_json');
        // Phase C：改走 Edge Function 代理。不設 Content-Type，讓 fetch 自動帶 multipart boundary
        const res = await fetch(`${EDGE_BASE}/whisper-proxy`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${SB_KEY}`, 'apikey': SB_KEY },
          body: fd,
        });
        if (!res.ok) {
          // 4xx 永久錯誤（413 太大、400 格式錯、401/403 認證）：再試也沒用，直接失敗
          if (res.status >= 400 && res.status < 500 && res.status !== 408 && res.status !== 429) {
            let msg;
            try { msg = (await res.json()).error?.message || `HTTP ${res.status}`; }
            catch { msg = `HTTP ${res.status}`; }
            const err = new Error(msg);
            err.permanent = true;
            throw err;
          }
          let msg;
          try { msg = (await res.json()).error?.message || `HTTP ${res.status}`; }
          catch { msg = `HTTP ${res.status}`; }
          throw new Error(msg);
        }
        const data = await res.json();
        return { index: segment.index, startSec: segment.startSec, durationSec: segment.durationSec, text: data.text };
      } catch (err) {
        // 永久錯誤不重試；超過重試次數也不再試
        if (err.permanent || attempt >= AUDIO_CONFIG.retryAttempts) {
          return { index: segment.index, error: `段 ${segment.index + 1} 失敗：${err.message}` };
        }
        await new Promise(r => setTimeout(r, AUDIO_CONFIG.retryDelayMs));
        return transcribeSegment(segment, openaiKey, attempt + 1);
      }
    };

    // 階段 3b：4 通道並行上傳池
    const transcribeAllSegments = async (segments, openaiKey, onProgress) => {
      const results = new Array(segments.length);
      let completed = 0;
      const queue = [...segments];
      const worker = async () => {
        while (queue.length > 0) {
          const seg = queue.shift();
          if (!seg) break;
          results[seg.index] = await transcribeSegment(seg, openaiKey);
          completed++;
          if (onProgress) onProgress(completed / segments.length);
        }
      };
      await Promise.all(Array(AUDIO_CONFIG.parallelChannels).fill(null).map(worker));
      return results;
    };

    // 階段 4：合併（按 index 排序）
    const mergeTranscripts = (transcripts) => {
      const sorted = transcripts.filter(t => !t.error).sort((a, b) => a.index - b.index);
      return {
        fullText: sorted.map(t => t.text).join('\n\n'),
        failedSegments: transcripts.filter(t => t.error),
      };
    };

    // ─── WEB AUDIO SEGMENTATION ──────────────────────────────────────────────
    // 全程使用瀏覽器原生 AudioContext，無 WASM 依賴，任何環境都能切段上傳

    // 每段 5 分鐘：16kHz mono 16-bit WAV ≈ 9.6MB
    // 小段落換來:(1) 單次上傳失敗風險低(2) 平行連線總頻寬壓力小(3) Edge Function 處理時間短
    const WEBAUDIO_SEGMENT_MINUTES = 5;

    // 將 m4a/mp3/wav 解碼成 16kHz mono AudioBuffer
    const decodeAudioBlob = async (blob) => {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      // Safari 舊版不支援建構子 sampleRate 參數，但新版會用它來 resample
      let ctx;
      try { ctx = new Ctx({ sampleRate: AUDIO_CONFIG.sampleRate }); }
      catch { ctx = new Ctx(); }
      const arrBuf = await blob.arrayBuffer();
      const audioBuf = await new Promise((resolve, reject) => {
        // callback 形式相容 Safari 舊版
        const p = ctx.decodeAudioData(arrBuf, resolve, reject);
        if (p && p.then) p.then(resolve, reject);
      });
      return audioBuf;
    };

    // AudioBuffer 某個時間區段 → 16-bit PCM mono WAV Blob
    const encodeWavSegment = (audioBuffer, startSec, durationSec) => {
      const sr = audioBuffer.sampleRate;
      const startIdx = Math.max(0, Math.floor(startSec * sr));
      const endIdx   = Math.min(audioBuffer.length, Math.floor((startSec + durationSec) * sr));
      const len = endIdx - startIdx;
      const chans = audioBuffer.numberOfChannels;
      // 混多聲道成 mono
      const mono = new Float32Array(len);
      for (let c = 0; c < chans; c++) {
        const ch = audioBuffer.getChannelData(c);
        for (let i = 0; i < len; i++) mono[i] += ch[startIdx + i] / chans;
      }
      // WAV header (44 bytes) + 16-bit PCM samples
      const buf = new ArrayBuffer(44 + len * 2);
      const dv  = new DataView(buf);
      const wStr = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
      wStr(0, 'RIFF');
      dv.setUint32(4, 36 + len * 2, true);
      wStr(8, 'WAVE');
      wStr(12, 'fmt ');
      dv.setUint32(16, 16, true);          // PCM chunk size
      dv.setUint16(20, 1, true);           // format = PCM
      dv.setUint16(22, 1, true);           // mono
      dv.setUint32(24, sr, true);
      dv.setUint32(28, sr * 2, true);      // byte rate
      dv.setUint16(32, 2, true);           // block align
      dv.setUint16(34, 16, true);          // bits per sample
      wStr(36, 'data');
      dv.setUint32(40, len * 2, true);
      let off = 44;
      for (let i = 0; i < len; i++) {
        const s = Math.max(-1, Math.min(1, mono[i]));
        dv.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        off += 2;
      }
      return new Blob([buf], { type: 'audio/wav' });
    };

    // Web Audio 版等時切段（不做靜音偵測，按固定時間切）
    const segmentAudioWebAudio = async (audioBlob, onProgress) => {
      const audioBuffer = await decodeAudioBlob(audioBlob);
      const total  = audioBuffer.duration;
      const segSec = WEBAUDIO_SEGMENT_MINUTES * 60;
      const segments = [];
      let startSec = 0;
      let idx = 0;
      while (startSec < total) {
        const dur  = Math.min(segSec, total - startSec);
        const blob = encodeWavSegment(audioBuffer, startSec, dur);
        segments.push({ index: idx, blob, startSec, durationSec: dur });
        startSec += dur;
        idx += 1;
        if (onProgress) onProgress(Math.min(startSec / total, 1));
      }
      return { segments, duration: total };
    };

    // ─────────────────────────────────────────────────────────────────────────────

    // ─── DESIGN TOKENS ───────────────────────────────────────────────────────────
    const C = {
      bgRoot:   '#0f1117',
      bgPanel:  '#16191f',
      bgCard:   '#1a1d25',
      bgInput:  '#0f1117',
      border:   '#2a2d35',
      accent:   '#5b8dee',
      success:  '#95d5b2',
      successBg:'#1e3a2f',
      successBd:'#2d6a4f',
      danger:   '#c0392b',
      dangerBg: '#2d1215',
      text:     '#e8e8e8',
      textSec:  '#888',
      textMut:  '#4a4d56',
      warn:     '#f0a020',
    };

    const S = {
      panel: { background: C.bgPanel, borderRadius: 12, padding: 24, border: `1px solid ${C.border}` },
      card:  { background: C.bgCard, borderRadius: 8, border: `1px solid ${C.border}`, overflow: 'hidden' },
      input: { background: C.bgInput, border: `1px solid ${C.border}`, borderRadius: 8, padding: '10px 12px', color: C.text, width: '100%', fontSize: 14, lineHeight: 1.5 },
      label: { fontSize: 12, color: C.textSec, marginBottom: 6, display: 'block', letterSpacing: '0.03em', fontWeight: 500 },
    };

    function btn(variant = 'default', extra = {}) {
      const base = { border: 'none', borderRadius: 8, padding: '10px 18px', cursor: 'pointer', fontSize: 14, fontWeight: 500, fontFamily: 'inherit', transition: 'opacity 0.15s', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 6, userSelect: 'none', whiteSpace: 'nowrap' };
      const variants = {
        primary: { background: C.accent, color: '#fff' },
        danger:  { background: C.danger, color: '#fff' },
        ghost:   { background: 'transparent', color: C.textSec, border: `1px solid ${C.border}` },
        default: { background: '#1e2230', color: C.text, border: `1px solid ${C.border}` },
        success: { background: C.successBd, color: C.success },
      };
      return { ...base, ...(variants[variant] || variants.default), ...extra };
    }

    function badge(color = C.accent, bg) {
      return { background: bg || (color + '22'), color, borderRadius: 10, padding: '2px 9px', fontSize: 12, fontWeight: 600, display: 'inline-flex', alignItems: 'center', gap: 4 };
    }

    function Spinner() {
      return <span style={{ width: 14, height: 14, border: `2px solid #ffffff44`, borderTopColor: '#fff', borderRadius: '50%', animation: 'spin 0.7s linear infinite', display: 'inline-block' }} />;
    }

    // ─── HOME ────────────────────────────────────────────────────────────────────
    // 邀請制白名單模型(2026-04-25 起):
    //   - 進入 MeetKit 必須先 magic-link 登入(LoginGate 擋在外)
    //   - 首頁顯示兩份清單:
    //       🧑‍💼 我建立的會議(owner_email = 我)
    //       📨 我被邀請的會議(project_members.member_email = 我,經 RLS 自動 filter)
    //   - 不再有「6 碼代碼輸入加入」的 UI,因為 RLS 會擋沒被邀請的 email
    //   - 建立新專案時直接填與會者 email 清單,Edge Function 會自動寄 MeetKit 邀請信
    function Home({ onEnter }) {
      const [myProjects, setMyProjects] = useState([]);
      const [invitedProjects, setInvitedProjects] = useState([]);
      const [showCreateForm, setShowCreateForm] = useState(false);
      const [newTitle, setNewTitle] = useState('');
      const [inviteEmailsInput, setInviteEmailsInput] = useState('');
      const [creating, setCreating] = useState(false);
      const [sendMsg, setSendMsg] = useState('');

      const myEmail = (currentSession?.user?.email || '').toLowerCase();

      useEffect(() => {
        if (!myEmail) return;
        // 單一 query:RLS 會回傳所有「我 owner OR 我是成員」的專案,前端再切成兩堆
        // 注意:projects 沒有 code 欄位,id 本身就是 6 碼專案代碼(例如 A3X9KP)
        db(`projects?select=id,title,meeting_date,owner_email&order=meeting_date.desc,id.asc`)
          .then(async r => {
            if (!r.ok) {
              const errBody = await r.text().catch(() => '');
              console.error('[Home] 載入專案失敗', r.status, errBody);
              return null;
            }
            return r.json();
          }).then(data => {
            if (!Array.isArray(data)) {
              console.warn('[Home] projects 回傳不是陣列:', data);
              return;
            }
            console.log('[Home] 載到', data.length, '個專案');
            const mine = [];
            const invited = [];
            for (const p of data) {
              if ((p.owner_email || '').toLowerCase() === myEmail) mine.push(p);
              else invited.push(p);
            }
            setMyProjects(mine);
            setInvitedProjects(invited);
          }).catch(err => {
            console.error('[Home] 網路/JSON 錯誤', err);
          });
      }, [myEmail]);

      // 把使用者輸入的 email 清單切乾淨(逗號/分號/空白/換行都當分隔)
      const parseInviteEmails = (s) => {
        const list = s.split(/[\s,;\n]+/).map(x => x.trim().toLowerCase()).filter(Boolean);
        const valid = list.filter(x => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x));
        return [...new Set(valid)]; // 去重
      };

      const parsedInvitees = parseInviteEmails(inviteEmailsInput).filter(e => e !== myEmail);

      const createProject = async () => {
        setCreating(true);
        setSendMsg('');
        const id = genId();
        const ownerEmail = currentSession?.user?.email || null;
        const title = newTitle.trim() || '未命名專案';

        try {
          // 1) 建專案(RLS 會檢查 owner_email 必須 = 我的 email)
          const pRes = await db('projects', {
            method: 'POST',
            body: JSON.stringify({ id, title, owner_email: ownerEmail }),
          });
          if (!pRes.ok) {
            const err = await pRes.text().catch(() => '');
            throw new Error(`建立專案失敗 (${pRes.status}) ${err.slice(0, 200)}`);
          }

          // 2) 加入成員(如果有填)
          if (parsedInvitees.length > 0) {
            const rows = parsedInvitees.map(email => ({
              project_id: id,
              member_email: email,
              added_by: ownerEmail,
            }));
            const mRes = await db('project_members', {
              method: 'POST',
              headers: { Prefer: 'return=minimal' },
              body: JSON.stringify(rows),
            });
            if (!mRes.ok) {
              // 不擋建立,只印警告(專案建成了,可以之後再加人)
              console.warn('加入成員失敗:', mRes.status, await mRes.text().catch(() => ''));
              setSendMsg('⚠️ 專案建成了,但加入成員失敗,請進專案後手動再加');
            } else {
              // 3) 寄邀請信(fire-and-forget,不等回應)
              fetch(`${EDGE_BASE}/send-invite`, {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${getBearer()}`,
                  'apikey': SB_KEY,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  projectCode: id,
                  projectTitle: title,
                  senderEmail: ownerEmail,
                  senderName: ownerEmail ? ownerEmail.split('@')[0] : '',
                  recipientEmails: parsedInvitees,
                }),
              }).then(r => r.json()).then(r => {
                console.log('[send-invite]', r);
              }).catch(e => console.warn('寄邀請信失敗:', e));
            }
          }
        } catch (e) {
          alert(`建立失敗:${e.message || e}`);
          setCreating(false);
          return;
        }
        sessionStorage.setItem(`mk_auth_${id}`, '1');
        onEnter(id);
        setCreating(false);
      };

      const renderProjectItem = (p) => (

        setEditing(false);
      };

      const phases = [
        { id: 0, icon: '📋', label: '會前提案' },

        { id: 2, icon: '📝', label: '會後整理' },

      return (
        <header style={{
          background: C.bgPanel + 'ee', borderBottom: `1px solid ${C.border}`,
          position: 'sticky', top: 0, zIndex: 100, backdropFilter: 'blur(16px)',
          // 往上滑才顯示：用 transform 平滑滑出/滑入

            <span style={{ fontSize: 11, color: C.textMut, letterSpacing: '0.05em' }}>專案</span>
            {editing ? (
              <>
                <input
                  style={{ ...S.input, padding: '3px 8px', fontSize: 13, width: 'auto', flex: 1, maxWidth: 320 }}
                  value={draft}
                  onChange={e => setDraft(e.target.value)}
                  onKeyDown={e => { if (e.key === 'Enter') save(); if (e.key === 'Escape') setEditing(false); }}
                  autoFocus
                />
                <button style={{ ...btn('primary'), padding: '3px 12px', fontSize: 12 }} onClick={save}>儲存</button>
                <button style={{ ...btn('ghost'), padding: '3px 10px', fontSize: 12 }} onClick={() => setEditing(false)}>取消</button>
              </>
            ) : (
              <>
                <span style={{ fontSize: 13, fontWeight: 600, color: C.text }}>{projectTitle || '未命名專案'}</span>
                <button style={{ ...btn('ghost'), padding: '2px 8px', fontSize: 11, color: C.textMut, borderColor: 'transparent' }} onClick={() => setEditing(true)}>✏️</button>
                <span style={{ marginLeft: 'auto', fontSize: 11, color: C.textMut }}>代碼：<span style={{ fontFamily: 'monospace', color: C.textSec, letterSpacing: '0.1em' }}>{projectId}</span></span>
              </>
            )}
          </div>

          {/* Nav bar */}
          <div style={{ maxWidth: 1100, margin: '0 auto', padding: '0 20px', height: 52, display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12 }}>
            <div style={{ fontWeight: 700, fontSize: 16, letterSpacing: '-0.03em', display: 'flex', alignItems: 'center', gap: 7, flexShrink: 0 }}>
              <span style={{ color: C.accent }}>◈</span> MeetKit
            </div>

            <nav style={{ display: 'flex', alignItems: 'center', gap: 3 }}>
              {phases.map((p, i) => (
                <React.Fragment key={p.id}>
                  <button
                    onClick={() => {
                      setPhase(p.id);
                      const el = document.body;
                      // 切到「會議進行」：請求全螢幕（含 Safari webkit 前綴；用 body 比 documentElement 更可靠）
                      if (p.id === 1) {
                        if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
                        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
                      } else {
                        // 離開會議進行：退出全螢幕
                        const isFS = document.fullscreenElement || document.webkitFullscreenElement;
                        if (isFS) {
                          if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
                          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                        }
                      }
                    }}
                    style={{ ...btn(phase === p.id ? 'primary' : 'ghost'), padding: '6px 13px', fontSize: 13, opacity: phase > p.id ? 0.55 : phase === p.id ? 1 : 0.75 }}
                  >
                    <span>{p.icon}</span>
                    <span className="hide-mobile">{p.label}</span>
                  </button>
                  {i < phases.length - 1 && <span style={{ color: C.textMut, fontSize: 11, margin: '0 1px' }}>›</span>}
                </React.Fragment>
              ))}
              <span style={{ color: C.textMut, fontSize: 11, margin: '0 4px' }}>|</span>
              <button
                onClick={() => setPhase(3)}
                style={{ ...btn(phase === 3 ? 'default' : 'ghost'), padding: '6px 13px', fontSize: 13, border: phase === 3 ? `1px solid ${C.accent}` : `1px solid ${C.border}`, color: phase === 3 ? C.accent : C.textSec, position: 'relative' }}
              >
                <span>📚</span>
                <span className="hide-mobile">日誌</span>
                {journalCount > 0 && <span style={{ ...badge(C.accent), fontSize: 10, padding: '0px 5px', position: 'absolute', top: -6, right: -6 }}>{journalCount}</span>}
              </button>
            </nav>

            <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexShrink: 0 }}>
              {isRecording && (() => {
                const h = Math.floor(recordingSeconds / 3600);
                const m = Math.floor((recordingSeconds % 3600) / 60);
                const s = recordingSeconds % 60;
                const pad = n => String(n).padStart(2, '0');
                return (
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6, border: '2px solid', borderRadius: 20, padding: '3px 12px', animation: 'breathe 2.5s ease-in-out infinite' }}>
                    <span style={{ width: 6, height: 6, borderRadius: '50%', background: 'currentColor', display: 'inline-block', flexShrink: 0 }} />
                    <span style={{ fontSize: 12, fontWeight: 600, fontVariantNumeric: 'tabular-nums', letterSpacing: '0.04em' }}>
                      {h > 0 ? `${pad(h)}:` : ''}{pad(m)}:{pad(s)}
                    </span>
                  </div>
                );
              })()}
              <div style={{ display: 'flex', alignItems: 'center', gap: 5, fontSize: 12, color: C.textSec }}>
              <span style={{ width: 7, height: 7, borderRadius: '50%', background: syncOk ? C.success : C.textMut, display: 'inline-block', boxShadow: syncOk ? `0 0 0 2px ${C.success}44` : 'none' }} />
              <span className="hide-mobile">{syncOk ? '即時同步' : '離線'}</span>
              </div>
            </div>
          </div>
        </header>
      );
    }

    // ─── PRE-MEETING ─────────────────────────────────────────────────────────────
    function PreMeeting({ projectId, proposals, setProposals, setSyncOk, journal, projectTitle, meetingDate, setMeetingDate, meetingTime, setMeetingTime, briefing }) {
      const [form, setForm] = useState({ author: '', title: '', content: '' });
      const [attachFiles, setAttachFiles] = useState([]);
      const [uploading, setUploading] = useState(false);
      const [submitting, setSubmitting] = useState(false);
      const [expanded, setExpanded] = useState({});
      const [cardUploading, setCardUploading] = useState({});
      const [toast, setToast] = useState('');
      // (2026-04-25 Route C 清理)原有「公開網址」「Slack Webhook」兩個 state 已拿掉:
      //   - 分享連結改用 window.location 自動組,不需要使用者填
      //   - Slack 通知已被邀請信 (Resend) 取代,日後要整合 Slack 再另外做
      // Route C:此專案要同步到哪個 Notion 頁(pageId 或完整 URL)
      // 空值 = 沿用舊行為(notion-sync 用 NOTION_DB_ID env 寫到預設資料庫)
      const [notionTarget, setNotionTarget] = useState('');
      const [notionTargetTitle, setNotionTargetTitle] = useState('');
      const [notionTesting, setNotionTesting] = useState(false);
      const [notionMsg, setNotionMsg] = useState('');
      // 邀請白名單:此專案的 owner + members
      const [projectOwnerEmail, setProjectOwnerEmail] = useState('');
      const [members, setMembers] = useState([]);
      const [addEmailsInput, setAddEmailsInput] = useState('');
      const [addingMembers, setAddingMembers] = useState(false);
      const [membersMsg, setMembersMsg] = useState('');
      // 重寄邀請中的 email(避免同一列 double-click;一次只寄一封,UI 顯示「…」)
      const [resendingEmail, setResendingEmail] = useState('');
      // 公司同事目錄:從所有可見的 project_members 抓同 domain 的 email,給 label-style 一鍵加入
      // 不另開 directory 表;RLS 自然限定我看得到的範圍(我擁有的專案 + 我加入的專案的同列)
      // 邀越多人,目錄越完整 — 第一次邀請的新人要打字,之後就變 label
      const [knownColleagues, setKnownColleagues] = useState([]);
      // 寄送時機:'now' 立即送 / 'schedule' 排程到指定時間
      // scheduledAt 存 <input type="datetime-local"> 的本地時間字串(YYYY-MM-DDTHH:mm)
      // 送給 Edge Function 前會用 toUtcIso 轉成 UTC ISO,Resend 的 scheduled_at 接 UTC
      const [scheduleMode, setScheduleMode] = useState('now');
      const [scheduledAt, setScheduledAt] = useState('');
      const myEmail = (currentSession?.user?.email || '').toLowerCase();
      const isOwner = !!projectOwnerEmail && projectOwnerEmail.toLowerCase() === myEmail;
      const [showUrlInput, setShowUrlInput] = useState(false);
      const [showDatePicker, setShowDatePicker] = useState(false);
      const [showJournalRef, setShowJournalRef] = useState(false);
      const contentRef = useRef();
      const attachRef = useRef();
      const cardFileRefs = useRef({});

      const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 2500); };

      useEffect(() => {
        if (!projectId) return;
      }, [projectId]);

      // ─── Notion 目標頁 + 專案 owner_email ──────────────────────────────
      // 載入該專案儲存過的 Notion parent page id 和 owner_email(後者決定使用者是否能改成員)
      useEffect(() => {
        if (!projectId) return;
        db(`projects?id=eq.${projectId}&select=notion_parent_page_id,owner_email`)
          .then(r => r.json()).then(d => {
            const v = d?.[0]?.notion_parent_page_id || '';
            if (v) setNotionTarget(v);
            setProjectOwnerEmail(d?.[0]?.owner_email || '');
          }).catch(() => {});
      }, [projectId]);

      // ─── Members 管理 ─────────────────────────────────────────────────
      // 載入成員清單;RLS 會讓 owner 看到全部,member 只看到自己那一行
      const loadMembers = useCallback(() => {
        if (!projectId) return;
        db(`project_members?project_id=eq.${projectId}&select=member_email,added_by,added_at&order=added_at.asc`)
          .then(r => r.json()).then(d => {
            if (Array.isArray(d)) setMembers(d);
          }).catch(() => {});
      }, [projectId]);

      useEffect(() => { loadMembers(); }, [loadMembers]);

      // ─── 公司同事目錄(cross-project 聚合)─────────────────────
      // 從歷史 project_members 抓我看得到的所有同事 email,當作快速加入的 label 來源
      // 同 domain 才顯示(避免誤把客戶當同事),自己不顯示在自己的 label 列裡
      const loadKnownColleagues = useCallback(() => {
        const me = (currentSession?.user?.email || '').toLowerCase();
        if (!me) return;
        const myDomain = me.split('@')[1];
        if (!myDomain) return;
        db(`project_members?select=member_email&limit=500`)
          .then(r => r.json()).then(rows => {
            if (!Array.isArray(rows)) return;
            const uniq = [...new Set(rows.map(r => (r.member_email || '').toLowerCase()))]
              .filter(e => e && e.endsWith('@' + myDomain) && e !== me)
              .sort();
            setKnownColleagues(uniq);
          }).catch(() => {});
      }, []);
      useEffect(() => { loadKnownColleagues(); }, [loadKnownColleagues, projectId]);

      // ─── 排程寄送 helpers ──────────────────────────────────────
      // datetime-local 字串(無時區,瀏覽器當本地時間解讀)→ UTC ISO
      // Resend 的 scheduled_at 接 UTC ISO 或 natural language,這裡統一用 UTC ISO 最穩
      const toUtcIso = (localStr) => {
        if (!localStr) return '';
        const d = new Date(localStr);
        if (isNaN(d.getTime())) return '';
        return d.toISOString();
      };
      // Date → datetime-local input 接受的格式 YYYY-MM-DDTHH:mm
      const toLocalInput = (d) => {
        const pad = n => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
      };
      // 預設:明天早上 09:00
      const presetTomorrow9am = () => {
        const d = new Date();
        d.setDate(d.getDate() + 1);
        d.setHours(9, 0, 0, 0);
        setScheduledAt(toLocalInput(d));
      };
      // 預設:下個週一早上 09:00(今天本身是週一則跳到下週一)
      const presetNextMonday9am = () => {
        const d = new Date();
        const dow = d.getDay();                          // 0=Sun 1=Mon … 6=Sat
        const add = dow === 1 ? 7 : (dow === 0 ? 1 : 8 - dow);
        d.setDate(d.getDate() + add);
        d.setHours(9, 0, 0, 0);
        setScheduledAt(toLocalInput(d));
      };
      // 預設:會議日期前 2 天早上 09:00(沒設會議日期就不做)
      const presetTwoDaysBeforeMeeting = () => {
        if (!meetingDate) return;
        const d = new Date(meetingDate + 'T00:00:00');
        d.setDate(d.getDate() - 2);
        d.setHours(9, 0, 0, 0);
        setScheduledAt(toLocalInput(d));
      };

      // 新增成員:驗證 email → INSERT → 寄邀請信(立即或排程) → 重新載入
      // 點 label = 在 textarea 的待加入清單中切換該 email(進去 / 拿掉)
      // 不直接 commit,讓使用者還能選排程模式 + 確認後才按主按鈕
      const toggleColleague = (email) => {
        const lc = String(email || '').toLowerCase();
        if (!lc) return;
        const current = addEmailsInput.split(/[\s,;\n]+/).map(x => x.trim().toLowerCase()).filter(Boolean);
        if (current.includes(lc)) {
          setAddEmailsInput(current.filter(e => e !== lc).join('\n'));
        } else {
          setAddEmailsInput(current.length ? current.concat(lc).join('\n') : lc);
        }
      };

      const addMembers = async () => {
        const list = addEmailsInput.split(/[\s,;\n]+/).map(x => x.trim().toLowerCase()).filter(Boolean);
        const valid = [...new Set(list.filter(x => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x)))];
        // 排除已經是 owner / 已在名單的
        const existing = new Set(members.map(m => (m.member_email || '').toLowerCase()));
        const newOnes = valid.filter(e => e !== projectOwnerEmail.toLowerCase() && !existing.has(e));
        if (newOnes.length === 0) {
          setMembersMsg('⚠ 沒有新的有效 email(可能都已在名單中)');
          return;
        }
        setAddingMembers(true);
        setMembersMsg('');
        try {
          const rows = newOnes.map(email => ({
            project_id: projectId,
            member_email: email,
            added_by: myEmail || null,
          }));
          const res = await db('project_members', {
            method: 'POST',
            headers: { Prefer: 'return=minimal' },
            body: JSON.stringify(rows),
          });
          if (!res.ok) {
            const err = await res.text().catch(() => '');
            throw new Error(`${res.status} ${err.slice(0, 200)}`);
          }
          // 寄邀請信(fire and forget)
          // scheduledIso 有值 → Edge Function 會傳 Resend 的 scheduled_at,排程到指定時間;空值 = 立即
          const scheduledIso = scheduleMode === 'schedule' ? toUtcIso(scheduledAt) : '';
          fetch(`${EDGE_BASE}/send-invite`, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${getBearer()}`,
              'apikey': SB_KEY,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              projectCode: projectId,
              projectTitle: projectTitle || '未命名專案',
              meetingDate: meetingDate || '',
              meetingTime: meetingTime || '',
              senderEmail: myEmail,
              senderName: myEmail ? myEmail.split('@')[0] : '',
              recipientEmails: newOnes,
              scheduledAt: scheduledIso,
            }),
          }).then(r => r.json()).then(r => console.log('[send-invite]', r)).catch(e => console.warn('寄邀請信失敗:', e));

          const whenMsg = scheduledIso
            ? `,將於 ${scheduledAt.replace('T', ' ')} 寄出`
            : ',邀請信寄送中';
          setMembersMsg(`✓ 已新增 ${newOnes.length} 位成員${whenMsg}`);
          setAddEmailsInput('');
          loadMembers();
        } catch (e) {
          setMembersMsg(`❌ ${e.message || '新增失敗'}`);
        } finally {
          setAddingMembers(false);
        }
      };

      const removeMember = async (email) => {
        if (!isOwner) return;
        if (!confirm(`確定要把 ${email} 從這個專案移除嗎?`)) return;
        try {
          const res = await db(`project_members?project_id=eq.${projectId}&member_email=eq.${encodeURIComponent(email)}`, {
            method: 'DELETE',
          });
          if (!res.ok) throw new Error(`${res.status}`);
          setMembersMsg(`✓ 已移除 ${email}`);
          loadMembers();
        } catch (e) {
          setMembersMsg(`❌ 移除失敗:${e.message || e}`);
        }
      };

      // 重寄邀請信:只觸發 send-invite,不動 DB
      // 使用情境:成員說「我沒收到信」「誤刪了」「垃圾信撈不到」
      // 注意和 addMembers 的差異 — 這裡跳過 INSERT,因為 email 早就在 project_members 了
      const resendInvite = async (email) => {
        if (!isOwner || !email) return;
        setResendingEmail(email);
        setMembersMsg('');
        try {
          const res = await fetch(`${EDGE_BASE}/send-invite`, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${getBearer()}`,
              'apikey': SB_KEY,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              projectCode: projectId,
              projectTitle: projectTitle || '未命名專案',
              meetingDate: meetingDate || '',
              meetingTime: meetingTime || '',
              senderEmail: myEmail,
              senderName: myEmail ? myEmail.split('@')[0] : '',
              recipientEmails: [email],
            }),
          });
          const r = await res.json().catch(() => ({}));
          if (r?.ok && Array.isArray(r.sent) && r.sent.length > 0) {
            setMembersMsg(`✓ 已重寄邀請到 ${email}`);
          } else {
            const reason = r?.failed?.[0]?.error || r?.error || `HTTP ${res.status}`;
            setMembersMsg(`❌ 重寄失敗:${reason}`);
          }
        } catch (e) {
          setMembersMsg(`❌ 重寄失敗:${e.message || e}`);
        } finally {
          setResendingEmail('');
        }
      };

      // 從 Notion URL 或 raw id 抓出 32 字元 page id
      // 支援:
      //   - https://www.notion.so/Page-Title-abc123def456...
      //   - https://www.notion.so/workspace/abc123def456...
      //   - abc123def456...(直接貼 32 hex)
      //   - abc123de-f456-...(連字號格式)
      const parseNotionPageId = (raw) => {
        if (!raw) return '';
        const s = raw.trim();
        // 先抓 32 hex 或 UUID 風格
        const m = s.match(/([0-9a-f]{32}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/i);
        if (!m) return '';
        return m[1].replace(/-/g, '').toLowerCase();
      };

      // 測試 + 儲存 Notion 目標頁
      // 流程:1) parse page id 2) 呼叫 notion-fetch test 確認可讀 3) 存進 projects.notion_parent_page_id
      const saveNotionTarget = async () => {
        const pageId = parseNotionPageId(notionTarget);
        if (!pageId) {
          setNotionMsg('⚠ 找不到有效的 Notion page id(貼 Notion 頁面完整 URL 最穩)');
          return;
        }
        setNotionTesting(true);
        setNotionMsg('');
        try {
          // 先 test 能不能讀
          const testRes = await fetch(`${EDGE_BASE}/notion-fetch`, {
            method: 'POST',
            headers: EDGE_HEADERS,
            body: JSON.stringify({ pageId, test: true }),
          });
          const testData = await testRes.json();
          if (!testData.ok) {
            setNotionMsg(`❌ ${testData.hint || testData.error || '無法讀取該頁'}`);
            setNotionTesting(false);
            return;
          }
          // 存回 DB
          await db(`projects?id=eq.${projectId}`, {
            method: 'PATCH',
            body: JSON.stringify({ notion_parent_page_id: pageId }),
          });
          setNotionTargetTitle(testData.title || '');
          setNotionMsg(`✓ 已連到「${testData.title || pageId}」,之後歸檔會同步到這頁底下`);
        } catch (e) {
          setNotionMsg(`❌ ${e.message || '連線失敗'}`);
        } finally {
          setNotionTesting(false);
        }
      };

      const clearNotionTarget = async () => {
        setNotionTarget('');
        setNotionTargetTitle('');
        setNotionMsg('');
        await db(`projects?id=eq.${projectId}`, {
          method: 'PATCH',
          body: JSON.stringify({ notion_parent_page_id: null }),
        });
        showToast('✓ 已取消 Notion 目標頁,歸檔會改寫到預設資料庫');
      };

      const loadProposals = useCallback(async () => {
        try {
          const res = await db(`proposals?select=*&project_id=eq.${projectId}&order=id.asc`);
          if (res.ok) { setProposals(await res.json()); setSyncOk(true); }
        } catch { setSyncOk(false); }
      }, [projectId, setProposals, setSyncOk]);

      useEffect(() => {
        loadProposals();
        const t = setInterval(loadProposals, 5000);
        return () => clearInterval(t);
      }, [loadProposals]);

      const submit = async () => {
        if (!form.author.trim() || !form.title.trim() || !form.content.trim()) { showToast('請填寫所有欄位'); return; }
        setSubmitting(true);
        let file_url = '[]', file_name = '[]';
        if (attachFiles.length > 0) {
          setUploading(true);
          try {
            const uploaded = await uploadMultiple(attachFiles);
            if (uploaded.length > 0) {
              file_url = JSON.stringify(uploaded.map(f => f.url));
              file_name = JSON.stringify(uploaded.map(f => f.name));
            }
            if (uploaded.length < attachFiles.length) showToast('部分檔案上傳失敗');
          } catch { showToast('檔案上傳失敗，提案仍送出（無附件）'); }
          setUploading(false);
        }
        try {
          const res = await db("proposals", { method: 'POST', body: JSON.stringify({ ...form, project_id: projectId, file_url, file_name }) });
          if (res.ok) {
            // 送出後不清空姓名/標題/內容:同一場會議準備期間,常會連續送多份提案,清空逼使用者重打很煩
            // 附件清空(已上傳到 storage,留著會在下次 submit 重複上傳)
            // 「新會議預約後清空」是 Phase 3 才有的 lifecycle event(目前一個專案=一場會議,沒有重置點)
            setAttachFiles([]);
            if (attachRef.current) attachRef.current.value = '';
            await loadProposals();
            showToast('✓ 提案已送出！');
          }
          else showToast('送出失敗，請再試一次');
        } catch { showToast('網路錯誤，請再試一次'); }
        finally { setSubmitting(false); }
      };

      const deleteProposal = async (id) => { await db(`proposals?id=eq.${id}`, { method: 'DELETE' }); await loadProposals(); };
      const toggle = (id) => setExpanded(e => ({ ...e, [id]: !e[id] }));

      // 解析附件：向後相容舊的單筆字串
      const parseFiles = (p) => {
        try {
          const urls = JSON.parse(p.file_url || '[]');
          const names = JSON.parse(p.file_name || '[]');
          if (Array.isArray(urls)) return urls.map((url, i) => ({ url, name: names[i] || url.split('/').pop() }));
        } catch {}
        return p.file_url ? [{ url: p.file_url, name: p.file_name || '查看附件' }] : [];
      };

      // 上傳多個檔案（逐一依序），回傳成功的結果陣列
      const uploadMultiple = async (files) => {
        const results = [];
        for (const file of Array.from(files)) {
          const ext = file.name.includes('.') ? file.name.split('.').pop().replace(/[^a-zA-Z0-9]/g, '') : 'bin';
          const path = `${projectId}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
          try {
            const res = await fetch(`${SB_URL}/storage/v1/object/presentations/${path}`, {
              method: 'POST',
              headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, 'Content-Type': file.type || 'application/octet-stream' },
              body: file,
            });
            if (res.ok) results.push({ url: `${SB_URL}/storage/v1/object/public/presentations/${path}`, name: file.name });
          } catch {}
          await new Promise(r => setTimeout(r, 150));
        }
        return results;
      };

      const uploadCardFiles = async (proposalId, files, existingFiles) => {
        setCardUploading(s => ({ ...s, [proposalId]: true }));
        const total = files.length;
        const newFiles = [];
        const failed = [];
        for (const file of Array.from(files)) {
          const ext = file.name.includes('.') ? file.name.split('.').pop().replace(/[^a-zA-Z0-9]/g, '') : 'bin';
          const path = `${projectId}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
          try {
            const res = await fetch(`${SB_URL}/storage/v1/object/presentations/${path}`, {
              method: 'POST',
              headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, 'Content-Type': file.type || 'application/octet-stream' },
              body: file,
            });
            if (res.ok) {
              newFiles.push({ url: `${SB_URL}/storage/v1/object/public/presentations/${path}`, name: file.name });
            } else {
              const err = await res.json().catch(() => ({}));
              failed.push(`${file.name}（${err.message || res.status}）`);
            }
          } catch (e) { failed.push(`${file.name}（網路錯誤）`); }
        }
        if (newFiles.length > 0) {
          const merged = [...existingFiles, ...newFiles];
          await db(`proposals?id=eq.${proposalId}`, { method: 'PATCH', body: JSON.stringify({
            file_url: JSON.stringify(merged.map(f => f.url)),
            file_name: JSON.stringify(merged.map(f => f.name)),
          }) });
          await loadProposals();
        }
        if (failed.length === 0) {
          showToast(`✓ 已新增 ${newFiles.length} 個附件！`);
        } else if (newFiles.length > 0) {
          showToast(`✓ ${newFiles.length} 個成功，${failed.length} 個失敗：${failed.join('、')}`);
        } else {
          showToast(`上傳失敗：${failed.join('、')}`);
        }
        setCardUploading(s => ({ ...s, [proposalId]: false }));
      };

      const removeCardFile = async (proposalId, idx, existingFiles) => {
        const updated = existingFiles.filter((_, i) => i !== idx);
        await db(`proposals?id=eq.${proposalId}`, { method: 'PATCH', body: JSON.stringify({
          file_url: JSON.stringify(updated.map(f => f.url)),
          file_name: JSON.stringify(updated.map(f => f.name)),
        }) });
        await loadProposals();
        showToast('✓ 已移除附件');
      };
      const lastMeeting = journal && journal.length > 0 ? journal[journal.length - 1] : null;

      const saveMeetingInfo = async (date, time) => {
        await db(`projects?id=eq.${projectId}`, { method: 'PATCH', body: JSON.stringify({ meeting_date: date, meeting_time: time }) });
      };

      const openNewRound = async () => {
        if (proposals.length > 0) {
          await Promise.all(proposals.map(p => db(`proposals?id=eq.${p.id}`, { method: 'DELETE' }).catch(() => {})));
          setProposals([]);
        }
        showToast('✓ 準備室已開啟！');
      };

      // (2026-04-25 Route C 清理)原 savePublicUrl / saveSlackWebhook / sendNotice 已拿掉:
      //   - 分享不再靠「複製連結貼給人」— 同事登入後會在「我被邀請的會議」看到這個專案直接點進
      //   - Slack 通知已被邀請信取代;要整合 Slack 以後再說

      return (
        <div style={{ maxWidth: 1100, margin: '0 auto', padding: '28px 20px' }}>


          {/* 開會資訊 */}
          <div style={{ ...S.panel, marginBottom: 20 }} className="fade-in">
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 16 }}>
              <div style={{ fontSize: 22, fontWeight: 700, color: C.text, letterSpacing: 0.5 }}>
                {(() => {
                  const w = ['日','一','二','三','四','五','六'];
                  const d = meetingDate ? new Date(meetingDate + 'T00:00') : null;
                  const dateStr = d ? `${d.getMonth()+1}/${d.getDate()}(${w[d.getDay()]})` : '';
                  const timeStr = meetingTime ? ` ${meetingTime}` : '';
                  return `📨 ${dateStr}${timeStr}會議準備室`;
                })()}
              </div>
              <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexShrink: 0 }}>
                <button style={{ ...btn('ghost'), padding: '7px 14px', fontSize: 13 }} onClick={() => { setShowDatePicker(v => !v); setShowUrlInput(false); }}>🗓 新會議預約</button>
                <button style={{ ...btn('ghost'), padding: '8px 10px', fontSize: 13 }} title="設定" onClick={() => { setShowUrlInput(v => !v); setShowDatePicker(false); }}>⚙</button>
              </div>
            </div>

            {showDatePicker && (
              <div style={{ marginTop: 16, paddingTop: 16, borderTop: `1px solid ${C.border}`, display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap' }} className="fade-in">
                <input type="date" style={{ ...S.input, width: 'auto', fontSize: 13, colorScheme: 'dark' }} value={meetingDate} onChange={e => { setMeetingDate(e.target.value); saveMeetingInfo(e.target.value, meetingTime); }} />
                <input type="time" style={{ ...S.input, width: 'auto', fontSize: 13, colorScheme: 'dark' }} value={meetingTime} onChange={e => { setMeetingTime(e.target.value); saveMeetingInfo(meetingDate, e.target.value); }} />
                <button style={{ ...btn('primary'), padding: '7px 16px', fontSize: 13 }} onClick={() => { openNewRound(); setShowDatePicker(false); }}>✓ 確認開新準備室</button>
                {(meetingDate || meetingTime) && (
                  <button style={{ ...btn('ghost'), padding: '6px 10px', fontSize: 12, color: C.textMut }} onClick={() => { setMeetingDate(''); setMeetingTime(''); saveMeetingInfo('', ''); }}>✕ 清除</button>
                )}
              </div>
            )}

            {showUrlInput && (
              <div style={{ marginTop: 16, paddingTop: 16, borderTop: `1px solid ${C.border}`, display: 'flex', flexDirection: 'column', gap: 10 }} className="fade-in">
                {/* Route C:Notion 目標頁 picker — 每個專案獨立綁一個 Notion 頁 */}
                <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
                  <span style={{ fontSize: 12, color: C.textMut, width: 72, flexShrink: 0 }}>📓 Notion</span>
                  <input
                    value={notionTarget}
                    onChange={e => setNotionTarget(e.target.value)}
                    placeholder="貼 Notion 頁面 URL(歸檔時寫到這頁底下)"
                    style={{ ...S.input, flex: 1, fontSize: 12, padding: '6px 10px' }}
                    onKeyDown={e => e.key === 'Enter' && saveNotionTarget()}
                  />
                  <button
                    style={{ ...btn('primary'), padding: '6px 12px', fontSize: 12, flexShrink: 0, opacity: notionTesting ? 0.6 : 1 }}
                    disabled={notionTesting}
                    onClick={saveNotionTarget}
                  >
                    {notionTesting ? '測試中…' : '測試並儲存'}
                  </button>
                  {notionTarget && (
                    <button
                      style={{ ...btn('ghost'), padding: '6px 10px', fontSize: 12, flexShrink: 0, color: C.textMut }}
                      onClick={clearNotionTarget}
                      title="清除設定(改用預設資料庫)"
                    >
                      ✕
                    </button>
                  )}
                </div>
                {notionMsg && (
                  <div style={{ fontSize: 11, color: notionMsg.startsWith('✓') ? C.success : (notionMsg.startsWith('⚠') ? '#fa0' : '#f88'), paddingLeft: 82, lineHeight: 1.6 }}>
                    {notionMsg}
                  </div>
                )}
                <div style={{ fontSize: 10, color: C.textMut, paddingLeft: 82, lineHeight: 1.5 }}>
                  留空 = 寫到預設 MeetKit 資料庫。
                  先到 Notion 把該頁「⋯ → Add connections → MeetKit」分享給 integration,才能寫入。
                </div>

                {/* 📬 與會者白名單 — 只有 owner 能加 / 移除;member 只看得到自己 */}
                <div style={{ marginTop: 8, paddingTop: 14, borderTop: `1px dashed ${C.border}` }}>
                  <div style={{ display: 'flex', gap: 10, alignItems: 'flex-start', marginBottom: 8 }}>
                    <span style={{ fontSize: 12, color: C.textMut, width: 72, flexShrink: 0, paddingTop: 4 }}>📬 與會者</span>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      {/* 現有成員清單 */}
                      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: 10 }}>
                        {projectOwnerEmail && (
                          <div style={{ display: 'inline-flex', alignItems: 'center', gap: 5, padding: '3px 8px', background: C.accent + '22', color: C.accent, borderRadius: 6, fontSize: 11 }}>
                            👑 {projectOwnerEmail}
                          </div>
                        )}
                        {members.map(m => (
                          <div key={m.member_email} style={{ display: 'inline-flex', alignItems: 'center', gap: 4, padding: '3px 8px', background: C.bgInput, border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 11 }}>
                            {m.member_email}
                            {isOwner && m.member_email !== myEmail && (
                              <>
                                <button
                                  onClick={() => resendInvite(m.member_email)}
                                  disabled={resendingEmail === m.member_email}
                                  style={{ background: 'none', border: 'none', color: C.textMut, cursor: 'pointer', fontSize: 11, padding: 0, lineHeight: 1, opacity: resendingEmail === m.member_email ? 0.4 : 1 }}
                                  title="重寄邀請信"
                                >
                                  {resendingEmail === m.member_email ? '…' : '✉'}
                                </button>
                                <button
                                  onClick={() => removeMember(m.member_email)}
                                  style={{ background: 'none', border: 'none', color: C.textMut, cursor: 'pointer', fontSize: 11, padding: 0, lineHeight: 1 }}
                                  title="移除此成員"
                                >
                                  ✕
                                </button>
                              </>
                            )}
                          </div>
                        ))}
                        {members.length === 0 && !projectOwnerEmail && (
                          <span style={{ fontSize: 11, color: C.textMut }}>載入中…</span>
                        )}
                      </div>

                      {/* 新增成員(只有 owner 能操作) */}
                      {isOwner ? (
                        <>
                          {/* 公司同事快速加入 label — 從歷史 project_members 同 domain 聚合而來
                              點 label 把 email 加到下面的 textarea,再按主按鈕一次寄出
                              已是本專案 member 或 owner 的不出現在這裡(他們會在上面的 chips 區) */}
                          {(() => {
                            const queuedSet = new Set(
                              addEmailsInput.split(/[\s,;\n]+/).map(x => x.trim().toLowerCase()).filter(Boolean)
                            );
                            const memberSet = new Set(members.map(m => (m.member_email || '').toLowerCase()));
                            const ownerLc = (projectOwnerEmail || '').toLowerCase();
                            const candidates = knownColleagues.filter(e => e !== ownerLc && !memberSet.has(e));
                            if (candidates.length === 0) return null;
                            return (
                              <div style={{ marginBottom: 8 }}>
                                <div style={{ fontSize: 10, color: C.textMut, marginBottom: 5 }}>
                                  💼 同事快速加入(點選 label,再按下方按鈕寄邀請)
                                </div>
                                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5 }}>
                                  {candidates.map(email => {
                                    const prefix = email.split('@')[0];
                                    const queued = queuedSet.has(email);
                                    return (
                                      <button
                                        type="button"
                                        key={email}
                                        onClick={() => toggleColleague(email)}
                                        title={email}
                                        style={{
                                          padding: '3px 9px',
                                          background: queued ? C.accent + '22' : 'transparent',
                                          border: `1px solid ${queued ? C.accent : C.border}`,
                                          borderRadius: 6,
                                          fontSize: 11,
                                          color: queued ? C.accent : C.textSec,
                                          cursor: 'pointer',
                                          fontFamily: 'inherit',
                                          lineHeight: 1.4,
                                        }}
                                      >
                                        {queued ? `✓ ${prefix}` : `+ ${prefix}`}
                                      </button>
                                    );
                                  })}
                                </div>
                              </div>
                            );
                          })()}

                          {/* textarea 高度固定 60-120px,內容多就內部捲動(避免整個面板被撐開)
                              用於名單上找不到的新同事 / 外部來賓 — 同事直接點上面的 label */}
                          <textarea
                            value={addEmailsInput}
                            onChange={e => setAddEmailsInput(e.target.value)}
                            placeholder={`新增成員 email(一行一個,或逗號分隔)\n例:\nalice@example.com\nbob@example.com`}
                            style={{ ...S.input, minHeight: 60, maxHeight: 120, overflowY: 'auto', fontSize: 12, padding: '6px 10px', fontFamily: 'inherit', resize: 'none', width: '100%', boxSizing: 'border-box' }}
                          />

                          {/* 寄送時機:立即 vs 排程到指定時間(Resend scheduled_at) */}
                          <div style={{ marginTop: 8, fontSize: 11, color: C.textSec, display: 'flex', gap: 14, alignItems: 'center', flexWrap: 'wrap' }}>
                            <label style={{ display: 'inline-flex', alignItems: 'center', gap: 4, cursor: 'pointer' }}>
                              <input type="radio" name={`sm-${projectId}`} checked={scheduleMode === 'now'} onChange={() => setScheduleMode('now')} />
                              立即寄送
                            </label>
                            <label style={{ display: 'inline-flex', alignItems: 'center', gap: 4, cursor: 'pointer' }}>
                              <input type="radio" name={`sm-${projectId}`} checked={scheduleMode === 'schedule'} onChange={() => setScheduleMode('schedule')} />
                              排程到
                            </label>
                            {scheduleMode === 'schedule' && (
                              <input
                                type="datetime-local"
                                value={scheduledAt}
                                onChange={e => setScheduledAt(e.target.value)}
                                style={{ ...S.input, fontSize: 11, padding: '4px 8px', width: 'auto' }}
                              />
                            )}
                          </div>
                          {/* 快捷預設時間:明天 / 下週一 / 會議前 2 天,全 09:00 */}
                          {scheduleMode === 'schedule' && (
                            <div style={{ display: 'flex', gap: 6, marginTop: 6, flexWrap: 'wrap' }}>
                              <button type="button" onClick={presetTomorrow9am} style={{ ...btn('ghost'), padding: '3px 10px', fontSize: 11 }}>📅 明天 09:00</button>
                              <button type="button" onClick={presetNextMonday9am} style={{ ...btn('ghost'), padding: '3px 10px', fontSize: 11 }}>🌅 下週一 09:00</button>
                              {meetingDate && (
                                <button type="button" onClick={presetTwoDaysBeforeMeeting} style={{ ...btn('ghost'), padding: '3px 10px', fontSize: 11 }}>🕘 會議前 2 天 09:00</button>
                              )}
                            </div>
                          )}

                          <div style={{ display: 'flex', gap: 8, marginTop: 8, alignItems: 'center', flexWrap: 'wrap' }}>
                            <button
                              style={{ ...btn('primary'), padding: '6px 14px', fontSize: 12, opacity: addingMembers ? 0.6 : 1 }}
                              disabled={addingMembers || !addEmailsInput.trim() || (scheduleMode === 'schedule' && !scheduledAt)}
                              onClick={addMembers}
                            >
                              {addingMembers
                                ? '加入中…'
                                : scheduleMode === 'schedule'
                                  ? '＋ 加入並排程邀請信'
                                  : '＋ 加入並寄邀請信'}
                            </button>
                            {membersMsg && (
                              <span style={{ fontSize: 11, color: membersMsg.startsWith('✓') ? C.success : (membersMsg.startsWith('⚠') ? '#fa0' : '#f88') }}>
                                {membersMsg}
                              </span>
                            )}
                          </div>
                        </>
                      ) : (
                        <div style={{ fontSize: 11, color: C.textMut, lineHeight: 1.5 }}>
                          只有專案建立者(owner)可以新增或移除成員。
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>

          {lastMeeting && (
            <div style={{ ...S.card, marginBottom: 20, padding: '14px 18px', borderColor: C.accent + '44', background: C.accent + '08' }} className="fade-in">
              <div style={{ fontSize: 13, fontWeight: 600, color: C.accent, display: 'flex', alignItems: 'center', gap: 7, marginBottom: 10 }}>
                📌 上次會議備忘 <span style={{ fontWeight: 400, color: C.textSec }}>{lastMeeting.date}</span>
              </div>
              <div style={{ fontSize: 13, color: C.textSec, lineHeight: 1.8, whiteSpace: 'pre-wrap' }}>
                {lastMeeting.summary ? lastMeeting.summary.split('\n').filter(l => l.trim()).slice(0, 6).join('\n') : '（無摘要）'}
              </div>
              {lastMeeting.summary && lastMeeting.summary.split('\n').filter(l => l.trim()).length > 6 && (
                <div style={{ fontSize: 12, color: C.textMut, marginTop: 6 }}>…前往「📚 日誌」查看完整內容</div>
              )}
            </div>
          )}

          {toast && (
            <div style={{ position: 'fixed', bottom: 24, left: '50%', transform: 'translateX(-50%)', background: C.bgPanel, border: `1px solid ${C.border}`, borderRadius: 10, padding: '10px 20px', fontSize: 14, color: C.text, zIndex: 200, boxShadow: '0 8px 32px rgba(0,0,0,0.4)', animation: 'fadeIn 0.2s ease' }}>
              {toast}
            </div>
          )}

          <div className="grid-2col" style={{ display: 'grid', gridTemplateColumns: '2fr 3fr', gap: 20 }}>
            <div style={S.panel} className="fade-in">
              <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 20 }}>✏️ 提交議程提案</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
                <div>
                  <label style={S.label}>提案者姓名</label>
                  <input style={S.input} placeholder="你的名字" value={form.author} onChange={e => setForm(f => ({ ...f, author: e.target.value }))} />
                </div>
                <div>
                  <label style={S.label}>提案標題</label>
                  <input style={S.input} placeholder="簡短描述議程主題" value={form.title} onChange={e => setForm(f => ({ ...f, title: e.target.value }))} />
                </div>
                <div>
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 6 }}>
                    <label style={{ ...S.label, marginBottom: 0 }}>提案內容</label>
