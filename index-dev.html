                    {journal.length > 0 && (
                      <button type="button" style={{ ...btn('ghost'), padding: '3px 9px', fontSize: 11, color: C.accent, borderColor: C.accent + '44' }} onClick={() => setShowJournalRef(true)}>
                        📚 引用過去日誌
                      </button>
                    )}
                  </div>
                  <textarea ref={contentRef} style={{ ...S.input, minHeight: 130, resize: 'vertical' }} placeholder="詳細說明希望討論的問題..." value={form.content} onChange={e => setForm(f => ({ ...f, content: e.target.value }))} />
                </div>

                {/* 引用日誌 Modal */}
                {showJournalRef && (
                  <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.7)', zIndex: 500, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }} onClick={() => setShowJournalRef(false)}>
                    <div style={{ background: C.bgPanel, border: `1px solid ${C.border}`, borderRadius: 12, width: '100%', maxWidth: 680, maxHeight: '85vh', display: 'flex', flexDirection: 'column', overflow: 'hidden' }} onClick={e => e.stopPropagation()}>
                      <div style={{ padding: '14px 20px', borderBottom: `1px solid ${C.border}`, display: 'flex', alignItems: 'center', gap: 10, flexShrink: 0 }}>
                        <span style={{ fontSize: 15, fontWeight: 600, flex: 1 }}>📚 選擇要引用的日誌段落</span>
                        <button style={{ ...btn('ghost'), padding: '4px 10px', fontSize: 13 }} onClick={() => setShowJournalRef(false)}>✕</button>
                      </div>
                      <div style={{ overflow: 'auto', padding: '16px 20px', display: 'flex', flexDirection: 'column', gap: 14 }}>
                        {[...journal].reverse().map((m, mi) => (
                          <div key={m.id} style={{ ...S.card, padding: '14px 16px' }}>
                            <div style={{ fontSize: 13, fontWeight: 600, color: C.accent, marginBottom: 10 }}>{m.date}</div>
                            {m.summary && (
                              <div style={{ marginBottom: 8 }}>
                                <div style={{ fontSize: 11, color: C.textMut, marginBottom: 4 }}>AI 摘要</div>
                                <div style={{ fontSize: 12, color: C.textSec, lineHeight: 1.7, whiteSpace: 'pre-wrap', maxHeight: 100, overflow: 'hidden', maskImage: 'linear-gradient(to bottom, black 60%, transparent)' }}>
                                  {m.summary}
                                </div>
                                <button style={{ ...btn('default'), padding: '5px 12px', fontSize: 12, marginTop: 6 }}
                                  onClick={() => {
                                    const quote = `> **引用自 ${m.date} 會議摘要：**\n> ${m.summary.split('\n').filter(l=>l.trim()).slice(0,5).join('\n> ')}\n\n`;
                                    setForm(f => ({ ...f, content: f.content + (f.content && !f.content.endsWith('\n') ? '\n\n' : '') + quote }));
                                    setShowJournalRef(false);
                                    showToast('✓ 已引用摘要');
                                  }}>
                                  引用摘要 →
                                </button>
                              </div>
                            )}
                            {m.proposals?.length > 0 && (
                              <div style={{ marginTop: 8, paddingTop: 8, borderTop: `1px solid ${C.border}` }}>
                                <div style={{ fontSize: 11, color: C.textMut, marginBottom: 6 }}>議程列表</div>
                                {m.proposals.map((p, pi) => (
                                  <div key={pi} style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4 }}>
                                    <span style={{ fontSize: 12, color: C.textSec, flex: 1 }}>• {p.title}（{p.author}）</span>
                                    <button style={{ ...btn('ghost'), padding: '3px 8px', fontSize: 11 }}
                                      onClick={() => {
                                        const quote = `> **引用自 ${m.date} 議程：**\n> ${p.title}（${p.author}）\n> ${p.content || ''}\n\n`;
                                        setForm(f => ({ ...f, content: f.content + (f.content && !f.content.endsWith('\n') ? '\n\n' : '') + quote }));
                                        setShowJournalRef(false);
                                        showToast('✓ 已引用議程');
                                      }}>引用</button>
                                  </div>
                                ))}
                              </div>
                            )}
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
                <div>
                  <label style={S.label}>附加簡報／文件（選填，可多選）</label>
                  <input ref={attachRef} type="file" multiple accept={ACCEPT_FILES} style={{ display: 'none' }}
                    onChange={e => setAttachFiles(f => [...f, ...Array.from(e.target.files)])} />
                  <button type="button" style={{ ...btn('ghost'), padding: '7px 14px', fontSize: 13, marginBottom: attachFiles.length ? 8 : 0 }} onClick={() => attachRef.current.click()}>
                    📎 選擇檔案
                  </button>
                  {attachFiles.length === 0 && <span style={{ fontSize: 12, color: C.textMut, marginLeft: 8 }}>PDF · Word · PowerPoint · Excel · Keynote</span>}
                  {attachFiles.length > 0 && (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                      {attachFiles.map((f, i) => (
                        <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 6, background: C.bgCard, borderRadius: 6, padding: '4px 8px' }}>
                          <span style={{ fontSize: 13, color: C.text, flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>📄 {f.name}</span>
                          <button type="button" style={{ ...btn('ghost'), padding: '1px 6px', fontSize: 12, color: C.danger, borderColor: 'transparent', flexShrink: 0 }}
                            onClick={() => setAttachFiles(a => a.filter((_, j) => j !== i))}>✕</button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
                <button style={{ ...btn('primary'), width: '100%', padding: 13, fontSize: 15, opacity: (submitting || uploading) ? 0.65 : 1 }} onClick={submit} disabled={submitting || uploading}>
                  {uploading ? <><Spinner /> 上傳檔案中…</> : submitting ? <><Spinner /> 送出中…</> : '送出提案'}
                </button>
              </div>
              <div style={{ marginTop: 18, padding: '12px 14px', background: C.bgCard, borderRadius: 8, fontSize: 12, color: C.textSec, lineHeight: 1.7 }}>
                💡 所有與會者使用同一個連結。提案送出後所有人即時可見。
              </div>
            </div>

            <div style={S.panel} className="fade-in">
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 18 }}>
                <div style={{ fontSize: 15, fontWeight: 600, display: 'flex', alignItems: 'center', gap: 10 }}>
                  📋 議程提案 <span style={badge(C.accent)}>{proposals.length}</span>
                </div>
                <button style={{ ...btn('ghost'), padding: '6px 12px', fontSize: 13 }} onClick={loadProposals}>↻ 重整</button>
              </div>
              {proposals.length === 0 ? (
                <div style={{ textAlign: 'center', padding: '48px 0', color: C.textMut }}>
                  <div style={{ fontSize: 36, marginBottom: 12 }}>📭</div>
                  <div style={{ fontSize: 14, color: C.textMut }}>準備室已開啟，等待大家上傳提案</div>
                </div>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                  {proposals.map((p, i) => (
                    <div key={p.id} style={S.card}>
                      <div style={{ padding: '11px 14px', display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer' }} onClick={() => toggle(p.id)}>
                        <span style={{ ...badge(C.accent), minWidth: 26, justifyContent: 'center', flexShrink: 0 }}>{i + 1}</span>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontWeight: 500, fontSize: 14, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{p.title}</div>
                          <div style={{ fontSize: 12, color: C.textSec, marginTop: 1 }}>{p.author}</div>
                        </div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexShrink: 0 }}>
                          <span style={{ color: C.textMut, fontSize: 12 }}>{expanded[p.id] ? '▲' : '▼'}</span>
                          <button style={{ ...btn('ghost'), padding: '3px 8px', fontSize: 13, color: C.danger, borderColor: 'transparent' }} onClick={e => { e.stopPropagation(); deleteProposal(p.id); }}>✕</button>
                        </div>
                      </div>
                      {expanded[p.id] && (() => { const pFiles = parseFiles(p); return (
                        <div style={{ padding: '0 14px 14px', borderTop: `1px solid ${C.border}` }}>
                          <div style={{ paddingTop: 12, fontSize: 13, color: C.textSec, lineHeight: 1.8, whiteSpace: 'pre-wrap' }}>{p.content}</div>
                          {pFiles.length > 0 && (
                            <div style={{ display: 'flex', flexDirection: 'column', gap: 4, marginTop: 10 }}>
                              {pFiles.map((f, fi) => (
                                <div key={fi} style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                                  <a href={f.url} target="_blank" rel="noopener noreferrer" style={{ flex: 1, display: 'inline-flex', alignItems: 'center', gap: 6, padding: '5px 10px', background: C.accent + '18', border: `1px solid ${C.accent}44`, borderRadius: 7, fontSize: 12, color: C.accent, textDecoration: 'none', fontWeight: 500, minWidth: 0 }}>
                                    <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>📎 {f.name}</span>
                                  </a>
                                  <button style={{ ...btn('ghost'), padding: '3px 7px', fontSize: 12, color: C.danger, borderColor: 'transparent', flexShrink: 0 }}
                                    onClick={() => removeCardFile(p.id, fi, pFiles)}>✕</button>
                                </div>
                              ))}
                            </div>
                          )}
                          <div style={{ marginTop: 8 }}>
                            <input
                              type="file" multiple accept={ACCEPT_FILES}
                              style={{ display: 'none' }}
                              ref={el => cardFileRefs.current[p.id] = el}
                              onChange={e => { if (e.target.files.length) uploadCardFiles(p.id, e.target.files, pFiles); e.target.value = ''; }}
                            />
                            <button
                              style={{ ...btn('ghost'), padding: '5px 11px', fontSize: 12, opacity: cardUploading[p.id] ? 0.6 : 1 }}
                              onClick={() => cardFileRefs.current[p.id]?.click()}
                              disabled={cardUploading[p.id]}
                            >
                              {cardUploading[p.id] ? <><Spinner /> 上傳中…</> : '📎 新增附件'}
                            </button>
                          </div>
                        </div>
                      ); })()}
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ─── MEETING ─────────────────────────────────────────────────────────────────
    const FILE_TYPES = {
      pdf:    { icon: '📕', label: '開啟',          viewer: 'direct' },
      doc:    { icon: '📘', label: 'Word 開啟',     viewer: 'office' },
      docx:   { icon: '📘', label: 'Word 開啟',     viewer: 'office' },
      ppt:    { icon: '📙', label: 'PPT 開啟',      viewer: 'office' },
      pptx:   { icon: '📙', label: 'PPT 開啟',      viewer: 'office' },
      xls:    { icon: '📗', label: 'Excel 開啟',    viewer: 'office' },
      xlsx:   { icon: '📗', label: 'Excel 開啟',    viewer: 'office' },
      key:    { icon: '🎞️', label: 'Keynote 開啟',  viewer: 'google' },
      pages:  { icon: '📄', label: 'Pages 開啟',    viewer: 'google' },
      numbers:{ icon: '📊', label: 'Numbers 開啟',  viewer: 'google' },
      md:     { icon: '📝', label: 'Markdown 預覽', viewer: 'markdown' },
    };
    const ACCEPT_FILES = '.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.key,.pages,.numbers,.md';
    const fileIcon  = (name) => FILE_TYPES[(name.split('.').pop()||'').toLowerCase()]?.icon  || '📎';
    const fileLabel = (name) => FILE_TYPES[(name.split('.').pop()||'').toLowerCase()]?.label || '開啟';

    // 統一檔案預覽 Modal（頁內 iframe，不跳分頁）
    function FileViewerModal({ file, onClose, recState }) {
      const { url, name } = file;
      const ext = (name.split('.').pop() || '').toLowerCase();
      const type = FILE_TYPES[ext];
      const isMd = type?.viewer === 'markdown';
      const isPdf = type?.viewer === 'direct';
      const [mdContent, setMdContent] = useState('');
      const [mdLoading, setMdLoading] = useState(isMd);
      const [fontSize, setFontSize] = useState(15);
      const [pdfZoom, setPdfZoom] = useState(100);

      useEffect(() => {
        if (!isMd) return;
        fetch(url).then(r => r.text()).then(text => { setMdContent(text); setMdLoading(false); })
          .catch(() => { setMdContent('無法載入檔案'); setMdLoading(false); });
      }, [url]);

      const iframeSrc = () => {
        if (type?.viewer === 'office') return `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(url)}`;
        if (type?.viewer === 'google') return `https://docs.google.com/viewer?url=${encodeURIComponent(url)}&embedded=true`;
        // toolbar=0 隱藏 Chrome PDF 閱讀器的側邊縮圖欄和工具列
        if (isPdf) return `${url}#toolbar=0&zoom=${pdfZoom}`;
        return url;
      };

      const renderMd = (text) => {
        if (typeof marked === 'undefined') return `<pre>${text}</pre>`;
        const renderer = new marked.Renderer();
        renderer.link = (href, title, text) => `<a href="${href}" target="_blank" rel="noopener noreferrer" title="${title||''}" style="color:#5b8dee;text-decoration:underline">${text}</a>`;
        return marked.parse(text, { renderer, gfm: true, breaks: true });
      };

      const rec = recState;
      const pad2 = n => String(n).padStart(2,'0');

      return (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.85)', zIndex: 500, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20 }} onClick={onClose}>
          <div style={{ background: C.bgPanel, border: `1px solid ${C.border}`, borderRadius: 12, width: '100%', maxWidth: isMd ? 780 : '95vw', height: isMd ? 'auto' : '90vh', maxHeight: '90vh', display: 'flex', flexDirection: 'column', overflow: 'hidden' }} onClick={e => e.stopPropagation()}>
            {/* Header */}
            <div style={{ padding: '10px 14px', borderBottom: `1px solid ${C.border}`, display: 'flex', alignItems: 'center', gap: 8, flexShrink: 0, flexWrap: 'wrap' }}>
              <span style={{ fontSize: 13, fontWeight: 600, flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', minWidth: 0 }}>{fileIcon(name)} {name}</span>
              {/* 錄音狀態 */}
              {rec && (rec.isRecording ? (
                <div style={{ display: 'flex', alignItems: 'center', gap: 6, background: C.dangerBg, border: `1px solid ${C.danger}`, borderRadius: 20, padding: '4px 10px', flexShrink: 0, animation: 'pulse 1.5s infinite' }}>
                  <span style={{ width: 7, height: 7, borderRadius: '50%', background: C.danger, flexShrink: 0 }} />
                  <span style={{ fontSize: 12, fontWeight: 700, color: C.danger, fontVariantNumeric: 'tabular-nums' }}>{pad2(Math.floor(rec.elapsed/60))}:{pad2(rec.elapsed%60)}</span>
                  <button style={{ ...btn('danger'), padding: '2px 8px', fontSize: 11, borderRadius: 12 }} onClick={e => { e.stopPropagation(); rec.onStop?.(); }}>⏹</button>
                </div>
              ) : (
                <div style={{ display: 'flex', alignItems: 'center', gap: 6, background: C.bgCard, border: `1px solid ${C.warn}66`, borderRadius: 20, padding: '4px 10px', flexShrink: 0 }}>
                  <span style={{ fontSize: 11, color: C.warn }}>⚠ 未錄音</span>
                  <button style={{ ...btn('primary'), padding: '2px 8px', fontSize: 11, borderRadius: 12 }} onClick={e => { e.stopPropagation(); rec.onStart?.(); }}>⏺</button>
                </div>
              ))}
              {/* 字體大小（Markdown）或縮放（PDF） */}
              {isMd && (
                <div style={{ display: 'flex', alignItems: 'center', gap: 2, flexShrink: 0 }}>
                  <button style={{ ...btn('ghost'), padding: '3px 8px', fontSize: 13 }} onClick={() => setFontSize(s => Math.max(11, s-1))}>A-</button>
                  <span style={{ fontSize: 11, color: C.textSec, minWidth: 28, textAlign: 'center' }}>{fontSize}</span>
                  <button style={{ ...btn('ghost'), padding: '3px 8px', fontSize: 13 }} onClick={() => setFontSize(s => Math.min(24, s+1))}>A+</button>
                </div>
              )}
              {isPdf && (
                <div style={{ display: 'flex', alignItems: 'center', gap: 2, flexShrink: 0 }}>
                  <button style={{ ...btn('ghost'), padding: '3px 8px', fontSize: 13 }} onClick={() => setPdfZoom(z => Math.max(50, z-25))}>－</button>
                  <span style={{ fontSize: 11, color: C.textSec, minWidth: 36, textAlign: 'center' }}>{pdfZoom}%</span>
                  <button style={{ ...btn('ghost'), padding: '3px 8px', fontSize: 13 }} onClick={() => setPdfZoom(z => Math.min(200, z+25))}>＋</button>
                </div>
              )}
              {(type?.viewer === 'office' || type?.viewer === 'google') && (
                <span style={{ fontSize: 11, color: C.textMut, flexShrink: 0 }}>縮放請用文件內控制</span>
              )}
              {/* 全螢幕按鈕 */}
              <button
                onClick={() => {
                  const isFS = document.fullscreenElement || document.webkitFullscreenElement;
                  if (isFS) {
                    if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                  } else {
                    const iframe = document.querySelector('iframe');
                    const target = iframe || document.body;
                    if (target.requestFullscreen) target.requestFullscreen().catch(() => {});
                    else if (target.webkitRequestFullscreen) target.webkitRequestFullscreen();
                  }
                }}
                style={{
                  background: '#5b8dee', color: '#fff', border: 'none',
                  borderRadius: 7, padding: '5px 14px', fontSize: 13,
                  fontWeight: 700, cursor: 'pointer', flexShrink: 0,
                  fontFamily: 'inherit',
                }}
              >
                全螢幕
              </button>
              <button style={{ ...btn('ghost'), padding: '4px 10px', fontSize: 13, flexShrink: 0 }} onClick={onClose}>✕</button>
            </div>
            {isMd ? (
              <div style={{ overflow: 'auto', padding: '24px 32px', flex: 1, lineHeight: 1.85, fontSize: fontSize, color: C.text, maxHeight: '80vh' }}>
                {mdLoading ? <div style={{ color: C.textSec }}><Spinner /> 載入中…</div> : (
                  <div className="mk-md" dangerouslySetInnerHTML={{ __html: renderMd(mdContent) }} />
                )}
              </div>
            ) : (
              <iframe key={pdfZoom} src={iframeSrc()} style={{ flex: 1, border: 'none', width: '100%', minHeight: 0 }} allow="fullscreen" />
            )}
          </div>
        </div>
      );
    }

    function FileAttachments({ files, recState }) {
      const [viewerFile, setViewerFile] = useState(null);
      return (
        <>
          {viewerFile && <FileViewerModal file={viewerFile} onClose={() => setViewerFile(null)} recState={recState} />}
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            {files.map((f, fi) => (
              <button key={fi} onClick={() => setViewerFile(f)}
                style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '9px 16px', background: C.accent + '22', border: `1px solid ${C.accent}55`, borderRadius: 8, fontSize: 14, color: C.accent, fontWeight: 600, cursor: 'pointer', width: '100%', textAlign: 'left', transition: 'opacity 0.15s' }}
                onMouseEnter={e => e.currentTarget.style.opacity='0.8'} onMouseLeave={e => e.currentTarget.style.opacity='1'}>
                <span>{fileIcon(f.name)}</span>
                <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', flex: 1 }}>{f.name}</span>
                <span style={{ fontSize: 11, color: C.accent + 'aa', flexShrink: 0 }}>預覽</span>
              </button>
            ))}
          </div>
        </>
      );
    }

    const openFileUrl = (url, name) => {
      const ext = (name.split('.').pop() || '').toLowerCase();
      const type = FILE_TYPES[ext];
      if (type?.viewer === 'office') { window.open(`https://view.officeapps.live.com/op/view.aspx?src=${encodeURIComponent(url)}`, '_blank'); return; }
      if (type?.viewer === 'google')  { window.open(`https://docs.google.com/viewer?url=${encodeURIComponent(url)}`, '_blank'); return; }
      window.open(url, '_blank');
    };

    function Meeting({ proposals, setProposals, projectId, onGoHome, setPhase, briefing, onRecordingStateChange }) {
      const [activeId, setActiveId] = useState(null);
      const [expanded, setExpanded] = useState({});
      const [briefingOpen, setBriefingOpen] = useState(false);
      const [cardUploading, setCardUploading] = useState({});
      const cardFileRefs = useRef({});

      // 錄音確認狀態機：preparing / unconfirmed / in_progress / pending_pause_confirm / paused / ended
      // preparing = 預設，自由瀏覽議程；unconfirmed = 紅色 Modal 要求確認錄音
      const [recordingState, setRecordingState] = useState('preparing');
      const [recordingStartedAt, setRecordingStartedAt] = useState(null);
      const [recordingEndedAt, setRecordingEndedAt] = useState(null);

      // 分段錄音（純前端，重新整理會掉 — 階段 B 再持久化到 Supabase）
      // 格式：[{ startedAt: Date, endedAt: Date, durationSeconds: number }, ...]
      const [segments, setSegments] = useState([]);
      const [currentSegmentStart, setCurrentSegmentStart] = useState(null);
      const [totalEndedSeconds, setTotalEndedSeconds] = useState(0);
      // 歷史段落累積秒數（傳給計時器用）
      const accumulatedSeconds = segments.reduce((sum, s) => sum + s.durationSeconds, 0);

      const parseFiles = (p) => {
        try { const u = JSON.parse(p.file_url||'[]'); const n = JSON.parse(p.file_name||'[]'); if (Array.isArray(u)) return u.map((url,i)=>({url,name:n[i]||url.split('/').pop()})); } catch {}
        return p.file_url ? [{url:p.file_url,name:p.file_name||'查看附件'}] : [];
      };

      const uploadCardFiles = async (proposalId, files, existingFiles) => {
        setCardUploading(s => ({ ...s, [proposalId]: true }));
        try {
          const results = await Promise.all(Array.from(files).map(async (file) => {
            const ext = file.name.includes('.') ? file.name.split('.').pop().replace(/[^a-zA-Z0-9]/g, '') : 'bin';
            const path = `${projectId}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
            const res = await fetch(`${SB_URL}/storage/v1/object/presentations/${path}`, {
              method: 'POST', headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, 'Content-Type': file.type || 'application/octet-stream' }, body: file,
            });
            return res.ok ? { url: `${SB_URL}/storage/v1/object/public/presentations/${path}`, name: file.name } : null;
          }));
          const newFiles = results.filter(Boolean);
          if (newFiles.length > 0) {
            const merged = [...existingFiles, ...newFiles];
            await db(`proposals?id=eq.${proposalId}`, { method: 'PATCH', body: JSON.stringify({ file_url: JSON.stringify(merged.map(f=>f.url)), file_name: JSON.stringify(merged.map(f=>f.name)) }) });
            const res = await db(`proposals?select=*&project_id=eq.${projectId}&order=id.asc`);
            if (res.ok) setProposals(await res.json());
          }
        } catch {}
        setCardUploading(s => ({ ...s, [proposalId]: false }));
      };

      // 進入會議時刷新提案（確保附件資料最新）
      useEffect(() => {
        if (!projectId) return;
        const load = async () => {
          const res = await db(`proposals?select=*&project_id=eq.${projectId}&order=id.asc`);
          if (res.ok) setProposals(await res.json());
        };
        load();
        const t = setInterval(load, 8000);
        return () => clearInterval(t);
      }, [projectId]);

      // 進入會議時讀取錄音狀態，處理中途離開的恢復邏輯
      useEffect(() => {
        if (!projectId) return;
        const checkRecordingState = async () => {
          try {
            const res = await db(
              `projects?id=eq.${projectId}&select=recording_confirmed,recording_started_at,recording_ended_at,duration_seconds`
            );
            if (!res.ok) return;
            const [project] = await res.json();
            if (!project) return;

            if (project.recording_ended_at) {
              // 會議已結束：恢復結束狀態，含累積時長
              setRecordingState('ended');
              setRecordingStartedAt(new Date(project.recording_started_at));
              setRecordingEndedAt(new Date(project.recording_ended_at));
              setTotalEndedSeconds(project.duration_seconds || 0);
            } else if (project.recording_confirmed && !project.recording_ended_at) {
              // 中途離開：靜默重置為未確認
              await db(`projects?id=eq.${projectId}`, {
                method: 'PATCH',
                body: JSON.stringify({
                  recording_confirmed: false,
                  recording_started_at: null,
                }),
              });
              setRecordingState('preparing');
            } else {
              // 全新狀態
              setRecordingState('preparing');
            }
          } catch {
            // 讀取失敗不影響使用，維持預設 unconfirmed
          }
        };
        checkRecordingState();
      }, [projectId]);

      // 錄音進行中時每秒通知父元件（用於 Header 顯示累積時間）
      useEffect(() => {
        if (!onRecordingStateChange) return;
        if (recordingState !== 'in_progress') {
          onRecordingStateChange(false, 0);
          return;
        }
        const tick = () => {
          const curSec = currentSegmentStart
            ? Math.floor((Date.now() - currentSegmentStart.getTime()) / 1000)
            : 0;
          onRecordingStateChange(true, accumulatedSeconds + curSec);
        };
        tick();
        const id = setInterval(tick, 1000);
        return () => clearInterval(id);
      }, [recordingState, accumulatedSeconds, currentSegmentStart]);

      // ─── 錄音狀態機函式（六狀態：preparing → unconfirmed → in_progress → pending_pause_confirm → paused → ended）

      // 第一段開始：只在 segments.length === 0 時寫 Supabase（後續各段不再重複寫）
      const confirmRecording = async () => {
        const now = new Date();
        try {
          if (segments.length === 0) {
            // 第一段：寫入 Supabase
            const res = await db(`projects?id=eq.${projectId}`, {
              method: 'PATCH',
              body: JSON.stringify({
                recording_confirmed: true,
                recording_started_at: now.toISOString(),
              }),
            });
            if (!res.ok) {
              const err = await res.json().catch(() => ({}));
              throw new Error(err.message || `HTTP ${res.status}`);
            }
            setRecordingStartedAt(now);
          }
          // 開始計這一段
          setCurrentSegmentStart(now);
          setRecordingState('in_progress');
        } catch (err) {
          alert('無法開始會議，請重試。\n(' + err.message + ')');
        }
      };

      // 使用者按「結束這段」→ 進入確認 Modal（讓使用者先去 iPhone 按停止）
      const requestPause = () => {
        setRecordingState('pending_pause_confirm');
      };

      // Modal 確認「已關閉錄音」→ 記錄這段，進入 paused
      const confirmPause = () => {
        const now = new Date();
        if (currentSegmentStart) {
          const durationSeconds = Math.floor((now.getTime() - currentSegmentStart.getTime()) / 1000);
          setSegments(prev => [...prev, { startedAt: currentSegmentStart, endedAt: now, durationSeconds }]);
        }
        setCurrentSegmentStart(null);
        setRecordingState('paused');
      };

      // 暫停狀態按「繼續開新一段」→ 先走 unconfirmed 防呆（和第一段一樣的紅色 Modal）
      // confirmRecording 會判斷 segments.length > 0 跳過 Supabase 寫入，直接開新段計時
      const continueRecording = () => {
        setRecordingState('unconfirmed');
      };

      // 暫停後「前往會後整理」→ 靜默寫入 Supabase 總時長，直接跳 phase 2
      // 不需要「整場結束」確認動作，以累積段落時長作為紀錄即可
      const finishAndGoToPostMeeting = async () => {
        const now = new Date();
        const totalSec = segments.reduce((sum, s) => sum + s.durationSeconds, 0);
        // 靜默寫入（失敗不阻擋導航）
        db(`projects?id=eq.${projectId}`, {
          method: 'PATCH',
          body: JSON.stringify({
            recording_ended_at: now.toISOString(),
            duration_seconds: totalSec,
          }),
        }).catch(() => {});
        setPhase(2);
      };

      const cancelMeeting = () => {
        if (confirm('確定要取消這場會議？已填的提案會保留。')) {
          onGoHome();
        }
      };

      // 會議結束後「開新一場」→ 清除 Supabase 錄音欄位，前端回到 preparing
      const openNewRound = async () => {
        try {
          await db(`projects?id=eq.${projectId}`, {
            method: 'PATCH',
            body: JSON.stringify({
              recording_confirmed: false,
              recording_started_at: null,
              recording_ended_at: null,
              duration_seconds: null,
            }),
          });
        } catch {}
        setSegments([]);
        setCurrentSegmentStart(null);
        setTotalEndedSeconds(0);
        setRecordingStartedAt(null);
        setRecordingEndedAt(null);
        setRecordingState('preparing');
      };

      const toggleActive = (id) => {
        // 只有 ended 狀態才凍結；in_progress / paused / pending_pause_confirm 都允許標記議程
        if (recordingState === 'ended') return;
        setActiveId(prev => prev === id ? null : id);
        setExpanded(e => ({ ...e, [id]: !e[id] }));
      };

      return (
        <>
          <div style={{ maxWidth: 1100, margin: '0 auto', padding: '28px 20px' }}>
          {briefing && (
            <div style={{ ...S.panel, marginBottom: 20, borderLeft: `3px solid ${C.accent}` }} className="fade-in">
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer' }} onClick={() => setBriefingOpen(v => !v)}>
                <span style={{ fontSize: 13, fontWeight: 700, color: C.accent, flex: 1 }}>📌 上次會議前情提要</span>
                <span style={{ fontSize: 11, color: C.textMut }}>（點擊{briefingOpen ? '收起' : '展開'}）</span>
                <span style={{ color: C.textMut, fontSize: 12 }}>{briefingOpen ? '▲' : '▼'}</span>
              </div>
              {briefingOpen && (
                <div className="mk-md" style={{ fontSize: 13, lineHeight: 1.85, color: C.textSec, marginTop: 14 }}
                  dangerouslySetInnerHTML={{ __html: (() => {
                    if (typeof marked === 'undefined') return `<pre>${briefing}</pre>`;
                    const r = new marked.Renderer();
                    r.link = (href, title, text) => `<a href="${href}" target="_blank" rel="noopener noreferrer" style="color:#5b8dee">${text}</a>`;
                    return marked.parse(briefing, { renderer: r, gfm: true, breaks: true });
                  })()} }
                />
              )}
            </div>
          )}
          <div className="grid-3-2" style={{ display: 'grid', gridTemplateColumns: '3fr 2fr', gap: 20 }}>
            <div style={S.panel} className="fade-in">
              <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 18, display: 'flex', alignItems: 'center', gap: 10 }}>
                📋 議程 <span style={badge(C.accent)}>{proposals.length}</span>
                {activeId && <span style={badge(C.success, C.successBg)}>● 主持中</span>}
              </div>
              {proposals.length === 0 ? (
                <div style={{ textAlign: 'center', padding: '56px 0', color: C.textMut, fontSize: 14 }}>請先在「會前提案」收集議程</div>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                  {proposals.map((p, i) => {
                    const active = activeId === p.id;
                    return (
                      <div key={p.id} style={{ ...S.card, border: `1px solid ${active ? C.accent : C.border}`, boxShadow: active ? `0 0 0 2px ${C.accent}22` : 'none', transition: 'all 0.2s' }}>
                        <div style={{ padding: '12px 14px', display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer' }} onClick={() => toggleActive(p.id)}>
                          <span style={{ ...badge(active ? '#fff' : C.accent, active ? C.accent : C.accent + '22'), minWidth: 26, justifyContent: 'center', flexShrink: 0 }}>{i + 1}</span>
                          <div style={{ flex: 1, minWidth: 0 }}>
                            <div style={{ fontWeight: 500, fontSize: 14, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{p.title}</div>
                            <div style={{ fontSize: 12, color: C.textSec, marginTop: 1 }}>{p.author}</div>
                          </div>
                          <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexShrink: 0 }}>
                            {active && <span style={badge(C.success, C.successBg)}>● 討論中</span>}
                            <span style={{ color: C.textMut, fontSize: 12 }}>{expanded[p.id] ? '▲' : '▼'}</span>
                          </div>
                        </div>
                        {expanded[p.id] && (() => {
                          const mFiles = parseFiles(p);
                          return (
                          <div style={{ padding: '0 14px 14px', borderTop: `1px solid ${C.border}` }}>
                            <div style={{ paddingTop: 12, fontSize: 13, color: C.textSec, lineHeight: 1.8, whiteSpace: 'pre-wrap' }}>{p.content}</div>
                            {mFiles.length > 0 ? (
                              <div style={{ marginTop: 12 }}>
                                <div style={{ fontSize: 11, color: C.textMut, letterSpacing: '0.04em', fontWeight: 600, marginBottom: 6 }}>簡報 / 文件</div>
                                <FileAttachments files={mFiles} recState={null} />
                              </div>
                            ) : (
                              <div style={{ marginTop: 10, fontSize: 12, color: C.textMut }}>（無附件）</div>
                            )}
                          </div>
                        ); })()}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>

            <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
              {recordingState === 'preparing' && (
                <div style={S.panel} className="fade-in">
                  <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 12 }}>📋 準備中</div>
                  <div style={{ fontSize: 13, color: C.textSec, lineHeight: 1.8, marginBottom: 20 }}>
                    檢查附件、確認簡報，準備好後按下方按鈕開始錄音。
                  </div>
                  <button
                    style={{ ...btn('primary'), width: '100%', padding: 13, fontSize: 14, background: '#16a34a', borderColor: '#16a34a' }}
                    onClick={() => setRecordingState('unconfirmed')}
                  >
                    ▶ 開始錄音
                  </button>
                  <button
                    style={{ ...btn('ghost'), width: '100%', padding: 10, fontSize: 13, marginTop: 8, color: C.textSec }}
                    onClick={() => setPhase(0)}
                  >
                    ← 回會前提案
                  </button>
                </div>
              )}
              {recordingState === 'in_progress' && (
                <MeetingTimer
                  accumulatedSeconds={accumulatedSeconds}
                  currentSegmentStart={currentSegmentStart}
                  onRequestPause={requestPause}
                />
              )}
              {recordingState === 'paused' && (
                <PausedPanel
                  accumulatedSeconds={accumulatedSeconds}
                  segmentCount={segments.length}
                  onContinue={continueRecording}
                  onGoToPostMeeting={finishAndGoToPostMeeting}
                />
              )}
              {recordingState === 'ended' && (
                <div style={S.panel} className="fade-in">
                  <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 20 }}>✅ 會議已結束</div>
                  <div style={{ textAlign: 'center', padding: '16px 0' }}>
                    {(() => {
                      const total = totalEndedSeconds;
                      const h = Math.floor(total / 3600);
                      const m2 = Math.floor((total % 3600) / 60);
                      const s2 = total % 60;
                      const pad = n => String(n).padStart(2, '0');
                      return (
                        <>
                          <div style={{ fontSize: 13, color: C.textSec, marginBottom: 8 }}>總會議時長</div>
                          <div style={{ fontSize: 32, fontWeight: 700, color: C.success, marginBottom: 24, fontVariantNumeric: 'tabular-nums' }}>
                            {pad(h)}:{pad(m2)}:{pad(s2)}
                          </div>
                        </>
                      );
                    })()}
                    <button
                      style={{ ...btn('primary'), width: '100%', padding: 13, fontSize: 14, marginBottom: 10 }}
                      onClick={() => setPhase(2)}
                    >
                      前往會後整理 →
                    </button>
                    <button
                      style={{ ...btn('ghost'), width: '100%', padding: 10, fontSize: 13 }}
                      onClick={openNewRound}
                    >
                      ↺ 開新一場會議
                    </button>
                    <button
                      style={{ ...btn('ghost'), width: '100%', padding: 10, fontSize: 13, marginTop: 4, color: C.textSec }}
                      onClick={() => setPhase(0)}
                    >
                      ← 回會前提案
                    </button>
                  </div>
                </div>
              )}
              {(recordingState === 'preparing' || recordingState === 'paused') && (
                <div style={{ ...S.card, padding: '12px 14px', fontSize: 13, color: C.textSec, background: C.textSec + '11', borderColor: C.textSec + '33', lineHeight: 1.7 }}>
                  💡 點選左側議程可標記目前討論中的項目。
                </div>
              )}
            </div>
          </div>
          </div>
          {recordingState === 'unconfirmed' && (
            <RecordingConfirmModal onConfirm={confirmRecording} onCancel={cancelMeeting} />
          )}
          {recordingState === 'pending_pause_confirm' && (
            <PauseConfirmModal
              currentSegmentStart={currentSegmentStart}
              onConfirm={confirmPause}
            />
          )}
        </>
      );
    }

    // ─── BLOCKING MODAL (通用攔截 Modal) ─────────────────────────────────────────
    // 未來任何頁面需要「阻擋使用者互動直到完成某個動作」都可以重用
    // ─────────────────────────────────────────────────────────────────────────────

    function BlockingModal({ show, children }) {
      if (!show) return null;
      return (
        <div style={{
          position: 'fixed', inset: 0, zIndex: 1000,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          animation: 'fadeIn 0.3s ease',
        }}>
          <div style={{
            position: 'absolute', inset: 0,
            background: '#DC2626', opacity: 0.45, mixBlendMode: 'multiply',
          }} />
          <div style={{ position: 'relative', zIndex: 10 }}>
            {children}
          </div>
        </div>
      );
    }

    // ─── RECORDING CONFIRM MODAL (會議錄音確認) ───────────────────────────────────

    function RecordingConfirmModal({ onConfirm, onCancel }) {
      const qrRef = useRef();
      useEffect(() => {
        if (typeof QRCode === 'undefined' || !qrRef.current) return;
        qrRef.current.innerHTML = '';
        // QR code 指向「當前部署網址底下的 open-voicememos.html」,不再硬編碼個人帳號路徑
        // meetkit.mx.design 開 → 產出 meetkit.mx.design/open-voicememos.html
        new QRCode(qrRef.current, {
          text: `${window.location.origin}${window.location.pathname.replace(/[^/]*$/, '')}open-voicememos.html`,
          width: 120, height: 120,
          colorDark: '#000000', colorLight: '#ffffff',
        });
      }, []);

      return (
        <BlockingModal show={true}>
          <div style={{
            background: C.bgCard, border: `1px solid ${C.border}`,
            borderRadius: 12, padding: '32px 36px', maxWidth: 460,
            boxShadow: '0 20px 60px rgba(0,0,0,0.5)',
          }}>
            <div style={{ fontSize: 22, fontWeight: 700, marginBottom: 20, textAlign: 'center' }}>
              🎙 會議錄音
            </div>

            {/* QR Code 區塊 */}
            <div style={{ display: 'flex', gap: 20, alignItems: 'center', marginBottom: 24, padding: '16px', background: C.bg, borderRadius: 10, border: `1px solid ${C.border}` }}>
              <div ref={qrRef} style={{ width: 120, height: 120, flexShrink: 0, borderRadius: 6, overflow: 'hidden', background: '#fff' }} />
              <div>
                <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 4 }}>📱 掃描開啟語音備忘錄</div>
                <div style={{ fontSize: 12, color: C.textSec, lineHeight: 1.7 }}>
                  用 iPhone 相機掃描 QR Code，直接跳到語音備忘錄 app，按下錄音後回到這裡確認。
                </div>
                <div style={{ fontSize: 11, color: C.textMut, marginTop: 6 }}>
                  💡 手機快沒電？把畫面給旁邊的人掃。
                </div>
              </div>
            </div>

            <button
              style={{ ...btn('primary'), width: '100%', padding: 14, fontSize: 15 }}
              onClick={onConfirm}
            >
              ✓ 已確認開始錄音
            </button>
            <div style={{ textAlign: 'center', marginTop: 16 }}>
              <a
                onClick={onCancel}
                style={{ fontSize: 12, color: C.textMut, textDecoration: 'underline', cursor: 'pointer' }}
              >
                ← 取消，不開這場會議
              </a>
            </div>
          </div>
        </BlockingModal>
      );
    }

    // ─── MEETING TIMER (純計時器，不錄音) ────────────────────────────────────────

    // MeetingTimer：顯示「歷史段落累積 + 目前這段」的總時間
    // accumulatedSeconds：前幾段的秒數加總
    // currentSegmentStart：這一段的開始時間（Date）
    // onRequestPause：使用者按「結束這段」時觸發，進入 pending_pause_confirm
    function MeetingTimer({ accumulatedSeconds, currentSegmentStart, onRequestPause }) {
      const [currentSec, setCurrentSec] = useState(0);
      useEffect(() => {
        const tick = () => setCurrentSec(Math.floor((Date.now() - currentSegmentStart.getTime()) / 1000));
        tick();
        const id = setInterval(tick, 1000);
        return () => clearInterval(id);
      }, [currentSegmentStart]);

      // 總時間 = 歷史累積 + 本段已過秒數
      const total = accumulatedSeconds + currentSec;
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60);
      const s = total % 60;
      const pad = n => String(n).padStart(2, '0');

      return (
        <div style={S.panel} className="fade-in">
          <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 20 }}>⏱ 會議進行中</div>
          <div style={{ textAlign: 'center', padding: '16px 0' }}>
            <div style={{
              fontSize: 42, fontWeight: 700, color: C.accent, marginBottom: 24,
              fontVariantNumeric: 'tabular-nums', letterSpacing: '0.05em',
            }}>
              {pad(h)}:{pad(m)}:{pad(s)}
            </div>
            <div style={{ color: C.textSec, fontSize: 13, marginBottom: 20 }}>
              記得 iPhone 繼續錄音中
            </div>
            <button
              style={{ ...btn('danger'), width: '100%', padding: 13, fontSize: 15 }}
              onClick={onRequestPause}
            >
              ⏹ 結束這段

    // ─── PAUSE CONFIRM MODAL (確認 iPhone 已停止錄音 — 暫停這段) ─────────────────
    // 每段結束時的對稱防呆：確保使用者去 iPhone 按停止錄音，再進入 paused 狀態

    // ─── PAUSED PANEL (暫停狀態的右側面板) ────────────────────────────────────
    // 顯示在 paused 狀態，讓使用者選擇「續開新一段」或「整場會議完全結束」
    // ─────────────────────────────────────────────────────────────────────────────

    function PausedPanel({ accumulatedSeconds, segmentCount, onContinue, onGoToPostMeeting }) {
      const h = Math.floor(accumulatedSeconds / 3600);
      const m = Math.floor((accumulatedSeconds % 3600) / 60);
      const s = accumulatedSeconds % 60;

            </div>

          }}>
            💡 如果還有事情要討論，點「繼續開新一段」可以開新的錄音段。會後上傳時記得上傳所有段的音檔。
          </div>
        </div>
      );
    }

    // ─── POST-MEETING ────────────────────────────────────────────────────────────
    function PostMeeting({ proposals, audioBlob, onSaveJournal, projectId, projectTitle }) {
      const [summaryEngine, setSummaryEngine] = useState('');
      const [uploadFile,   setUploadFile]   = useState(null);
      const [status,       setStatus]       = useState('idle');
      const [transcript,   setTranscript]   = useState('');
      const [summary,      setSummary]      = useState('');
      const [errMsg,       setErrMsg]       = useState('');
      const [whisperInfo,  setWhisperInfo]  = useState(null);
      const [archiving,        setArchiving]        = useState(false);
      const [archiveSteps,     setArchiveSteps]     = useState([]);
      const [proposalsParts,   setProposalsParts]   = useState([]);
      const [segmentProgress,  setSegmentProgress]  = useState(0);
      const [uploadProgress,   setUploadProgress]   = useState(0);
      const [segmentCount,     setSegmentCount]     = useState(0);
      const [failedSegments,   setFailedSegments]   = useState([]);
      const fileRef = useRef();
      const audioSrc = uploadFile || audioBlob;

      const getAudioDuration = (blob) => new Promise(resolve => {
        const a = new Audio(); a.src = URL.createObjectURL(blob);
        a.onloadedmetadata = () => { URL.revokeObjectURL(a.src); resolve(a.duration || 0); };
        a.onerror = () => resolve(0);
      });

      const run = async () => {
        if (!audioSrc) { setErrMsg('請先上傳 iPhone 錄音檔'); return; }
        if ((audioSrc.size || 0) > AUDIO_CONFIG.maxFileSizeMB * 1024 * 1024) {
          setErrMsg(`檔案過大，請上傳 ${AUDIO_CONFIG.maxFileSizeMB} MB 以內的音檔`); return;
        }
        setErrMsg('');
        setSegmentProgress(0); setUploadProgress(0); setFailedSegments([]);
        let txText = '';

        let segs, duration;
        try {
          // ── 階段 1：Web Audio API 切段（原生瀏覽器 API，無 WASM 依賴） ───
          setStatus('segmenting');
          const webResult = await segmentAudioWebAudio(audioSrc, p => setSegmentProgress(p));
          segs = webResult.segments;
          duration = webResult.duration;
          setSegmentProgress(1);
          setSegmentCount(segs.length);

          // ── 硬檢查：任何段落超過 24MB 直接拒送（Whisper 上限 25MB） ──────
          const WHISPER_MAX_BYTES = 24 * 1024 * 1024;
          const oversize = segs.find(s => s.blob.size > WHISPER_MAX_BYTES);
          if (oversize) {
            throw new Error(`段 ${oversize.index + 1} 檔案過大（${(oversize.blob.size / 1024 / 1024).toFixed(1)} MB），無法送 Whisper。請重新整理頁面再試一次。`);
          }

          // ── 階段 3：並行上傳 Whisper ──────────────────────────────────────
          setStatus('transcribing');
          const transcripts = await transcribeAllSegments(segs, '', p => setUploadProgress(p));
          const failed = transcripts.filter(t => t.error);
          if (failed.length > 0) setFailedSegments(failed);

          // ── 階段 4：合併逐字稿 ────────────────────────────────────────────
          const { fullText } = mergeTranscripts(transcripts);
          txText = fullText;
          setTranscript(txText);
          const mins = Math.ceil(duration / 60) || 1;
          setWhisperInfo({ mins, cost: (mins * 0.006).toFixed(3) });
        } catch (e) { setErrMsg('處理失敗：' + e.message); setStatus('error'); return; }

        // ── 階段 5：AI 摘要（附件抽取 + vision 整合） ────────────────────
        setStatus('summarizing');

        // 5a) 抽取每個提案的附件為 Claude content parts（文字/圖片/格式警告）
        //     + 解析提案 content 裡的 Notion 連結,抓整頁 markdown 當額外上下文
        const proposalsWithParts = await Promise.all(proposals.map(async (p) => {
          let parts = [];
          try {
            const urls = JSON.parse(p.file_url || '[]');
            const names = JSON.parse(p.file_name || '[]');
            for (let i = 0; i < urls.length; i++) {
              parts.push(await extractAttachmentParts(urls[i], names[i] || urls[i]));
            }
          } catch {}
          // Notion 連結:放在 content 裡面的才抓(附件 URL 不處理,避免誤抓 Supabase Storage 假 UUID)
          const notionRefs = await fetchProposalNotionRefs(p.content || '');
          return { ...p, parts, notionRefs };
        }));
        setProposalsParts(proposalsWithParts);

        // 5b) 組 Claude content blocks（優先用 Gemini 描述,fallback 才塞 vision）
        const intro = `你是一位專業的會議記錄與策略分析師。以下是一場會議的完整逐字稿、議程提案與提案附件。請用繁體中文產出一份結構完整的會後文件。

重要:
1. 每份提案附件都附有一段「Gemini 附件描述」,那是由視覺理解 AI 預先消化過的結構化摘要(包含整體概述、關鍵資訊、視覺元素描述、重點原文)。你可以把這段描述當作你「看過原檔」來分析。若附件有格式警告(例如 .key/.pages 無法讀取),請在摘要中明確提醒使用者。
2. 若提案內文引用了 Notion 頁面,該頁的完整 markdown 會附在提案正文之後(以「━━━ 提案引用的 Notion 頁」開頭)。請把它當成提案的延伸資料閱讀,並在分析時引用其中的重點。

━━━ 本次議程提案 ━━━`;

        const outroFormat = `

━━━ 會議逐字稿 ━━━
${txText}

━━━ 請依照以下格式輸出 ━━━

# 📋 各提案分析

（針對每一個提案，依下列結構整理）

## 提案 N：{提案標題}（{提案人}）

### 核心想法
（一段話說明提案人的核心主張；如有附件圖片，結合圖片中的視覺資訊）

### 會議 Findings
- **支持點：** （與會者認同的觀點、正面回饋）
- **疑慮與挑戰：** （提出的問題、擔憂、障礙）

### 可行性評估
- **執行面：** （技術、流程、人力的可行度）
- **資源需求：** （時間、預算、工具）
- **風險：** （潛在風險與不確定因素）

### 結論
（本次討論的共識或未解決的分歧）

---

# ✅ 待辦事項清單

（整合會議中、會議後提出的所有待辦，含會議討論中臨時提出的項目）

| 事項 | 負責人 | 建議完成時間 | 優先度 |
|------|--------|------------|--------|
（用表格列出，優先度分：🔴 緊急 / 🟡 本週 / 🟢 下週前）

---

# 📌 下次會議前情提要

## 背景摘要
（給未出席者或下次會議開場用的 2-3 段精簡說明，讓所有人快速進入狀況）

## 尚待確認的問題
（列出本次未解決、需要在下次會議前釐清的關鍵問題）

## 建議各方提前準備
（針對各提案負責人，建議下次會議前應準備的資料或評估）

---

# 💡 AI 綜合建議

（根據整體會議內容，提出 3-5 點具體可行的策略建議，包含優先順序推薦與注意事項）`;

        const claudeBlocks = [{ type: 'text', text: intro }];
        if (proposalsWithParts.length === 0) {
          claudeBlocks.push({ type: 'text', text: '\n\n（無提案議程）' });
        } else {
          proposalsWithParts.forEach((p, i) => {
            claudeBlocks.push({ type: 'text', text: `\n\n【提案 ${i + 1}】${p.title}（提案人：${p.author}）\n${p.content || '（無提案說明）'}` });
            // 提案 content 裡的 Notion 連結 → 把整頁 markdown 當成延伸閱讀餵進 Claude
            // 單頁內容上限 6000 字(避免吃爆 token,Notion 長頁可能 2-3 萬字)
            for (const ref of (p.notionRefs || [])) {
              if (ref.error) {
                claudeBlocks.push({ type: 'text', text: `\n⚠️ 提案引用的 Notion 頁「${ref.url}」讀取失敗:${ref.error}(本次無法納入分析)` });
                continue;
              }
              const snippet = (ref.markdown || '').slice(0, 6000);
              const truncated = ref.markdown && ref.markdown.length > 6000 ? '\n\n…(內容過長,已截斷,完整頁面請見原連結)' : '';
              claudeBlocks.push({ type: 'text', text: `\n\n━━━ 提案引用的 Notion 頁「${ref.title}」(${ref.url}) ━━━\n${snippet}${truncated}` });
            }
            for (const part of (p.parts || [])) {
              if (part.kind === 'needs-export') {
                claudeBlocks.push({ type: 'text', text: `\n⚠️ 附件「${part.fileName}」：${part.hint}（本次無法納入分析）` });
                continue;
              }
              // 優先用 Gemini 描述(統一文字格式,省 token)
              if (part.description) {
                claudeBlocks.push({ type: 'text', text: `\n\n━━━ 附件「${part.fileName}」Gemini 描述 ━━━\n${part.description}` });
                continue;
              }
              // Fallback:Gemini 失敗時,用原本的 vision/text 混合餵給 Claude
              if (part.kind === 'vision') {
                claudeBlocks.push({ type: 'text', text: `\n附件「${part.fileName}」${part.note || ''}:` });
                claudeBlocks.push(...part.blocks);
              } else if (part.kind === 'pptx' || part.kind === 'docx') {
                claudeBlocks.push({ type: 'text', text: `\n附件「${part.fileName}」${part.note || ''}\n${(part.text || '').slice(0, 8000)}` });
                if (part.blocks && part.blocks.length) {
                  claudeBlocks.push({ type: 'text', text: part.kind === 'pptx' ? '(簡報內嵌圖)' : '(文件內嵌圖)' });
                  claudeBlocks.push(...part.blocks);
                }
              } else if (part.kind === 'text') {
                claudeBlocks.push({ type: 'text', text: `\n附件「${part.fileName}」:\n${(part.text || '').slice(0, 10000)}` });
              }
              // kind === 'empty' 就不輸出任何東西
            }
          });
        }
        claudeBlocks.push({ type: 'text', text: outroFormat });

        // 5c) 轉成 OpenAI vision 格式（fallback 用）
        const openAIBlocks = claudeBlocks.map(b => {
          if (b.type === 'text') return { type: 'text', text: b.text };
          if (b.type === 'image') {
            return { type: 'image_url', image_url: { url: `data:${b.source.media_type};base64,${b.source.data}` } };
          }
          return b;
        });

        try {
          let summaryText = '';
          // 優先用 Anthropic Claude，失敗才 fallback 到 GPT-4o
          let usedEngine = 'gpt-4o';
          try {
            const res = await fetch(`${EDGE_BASE}/ai-proxy`, {
              method: 'POST',
              headers: EDGE_HEADERS,
              body: JSON.stringify({
                provider: 'anthropic',
                payload: {
                  model: 'claude-opus-4-5',
                  max_tokens: 4096,
                  messages: [{ role: 'user', content: claudeBlocks }],
                },
              }),
            });
            if (!res.ok) { const e = await res.json(); throw new Error(e.error?.message || `HTTP ${res.status}`); }
            summaryText = (await res.json()).content[0].text;
            usedEngine = 'claude';
          } catch (anthropicErr) {
            console.warn('Anthropic 摘要失敗，改用 GPT-4o：', anthropicErr.message);
          }
          if (!summaryText) {
            const res = await fetch(`${EDGE_BASE}/ai-proxy`, { method: 'POST', headers: EDGE_HEADERS, body: JSON.stringify({ provider: 'openai', payload: { model: 'gpt-4o', messages: [{ role: 'user', content: openAIBlocks }] } }) });
            if (!res.ok) { const e = await res.json(); throw new Error(e.error?.message || `HTTP ${res.status}`); }
            summaryText = (await res.json()).choices[0].message.content;
          }
          setSummaryEngine(usedEngine);
          setSummary(summaryText);
          // 自動存前情提要到 Supabase
          if (projectId) {
            const date = new Date().toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric' });
            const briefingMd = `> 📌 上次會議前情提要（${date}）\n\n${summaryText}`;
            db(`projects?id=eq.${projectId}`, { method: 'PATCH', body: JSON.stringify({ briefing: briefingMd }) }).catch(() => {});
          }
        } catch (e) { setErrMsg('AI 摘要失敗：' + e.message); setStatus('error'); return; }
        setStatus('done');
      };

      const exportMd = () => {
        const date = new Date().toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric' });
        const agendaSec = proposals.length ? proposals.map((p, i) => `### ${i + 1}. ${p.title}\n**提案者：** ${p.author}\n\n${p.content}`).join('\n\n---\n\n') : '（無提案）';
        const md = `# 會議紀錄\n\n**日期：** ${date}\n\n---\n\n## 📋 議程提案\n\n${agendaSec}\n\n---\n\n## 🎙️ 會議逐字稿\n\n${transcript}\n\n---\n\n## 📝 AI 摘要整理\n\n${summary}\n`;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([md], { type: 'text/markdown; charset=utf-8' }));
        a.download = `meetkit-${new Date().toISOString().slice(0,10)}.md`; a.click();
      };

      const running = ['segmenting', 'transcribing', 'summarizing'].includes(status);

      const handleArchive = async () => {
        setArchiving(true);
        setArchiveSteps(['💾 儲存日誌中…']);

        // 附件 render 圖上傳到 Storage（給 Notion 嵌入用）
        let enrichedProposals = proposals.map(p => ({ title: p.title, author: p.author, content: p.content, attachments: [] }));
        if (proposalsParts.length > 0) {
          setArchiveSteps(prev => [...prev, '🖼 附件圖片上傳中…']);
          try {
            enrichedProposals = await archiveAttachmentsToStorage(projectId, proposalsParts);
          } catch (e) {
            console.error('附件上傳失敗:', e);
          }
        }

        setArchiveSteps(prev => [...prev, '📌 同步到 Notion…']);
        setArchiveSteps(prev => [...prev, '✅ 完成！前往日誌']);
        await new Promise(r => setTimeout(r, 600));
        await onSaveJournal({ proposals: enrichedProposals, transcript, summary });
      };

      return (
        <div style={{ maxWidth: 800, margin: '0 auto', padding: '28px 20px', display: 'flex', flexDirection: 'column', gap: 18 }}>
          <div style={S.panel} className="fade-in">
            <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 16 }}>🎵 音檔來源</div>
            {audioBlob && (
              <div style={{ ...S.card, padding: '10px 14px', marginBottom: 14, display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
                <span style={badge(C.success, C.successBg)}>✓ 已有錄音</span>
                <span style={{ fontSize: 13, color: C.textSec, flex: 1 }}>來自「會議進行」的錄音</span>
                <a href={URL.createObjectURL(audioBlob)} download={`meetkit-rec-${new Date().toISOString().slice(0,16).replace('T','-')}.webm`}
                  style={{ ...btn('ghost'), padding: '4px 12px', fontSize: 12, color: C.textSec, textDecoration: 'none', flexShrink: 0 }}>
                  ⬇ 下載錄音檔
                </a>
              </div>
            )}
            <div>
              <label style={S.label}>{audioBlob ? '或改用上傳的音檔' : '上傳音檔'}</label>
              <input ref={fileRef} type="file" accept="audio/*,video/webm" style={{ display: 'none' }} onChange={e => setUploadFile(e.target.files[0])} />
              {/* 拖曳區域 */}
              <div
                onDragOver={e => { e.preventDefault(); e.currentTarget.style.borderColor = C.accent; e.currentTarget.style.background = C.accent + '11'; }}
                onDragLeave={e => { e.currentTarget.style.borderColor = C.border; e.currentTarget.style.background = 'transparent'; }}
                onDrop={e => {
                  e.preventDefault();
                  e.currentTarget.style.borderColor = C.border;
                  e.currentTarget.style.background = 'transparent';
                  const f = e.dataTransfer.files[0];
                  if (f) setUploadFile(f);
                }}
                onClick={() => fileRef.current.click()}
                style={{

            <span>🎙 Whisper 用量</span>

                    <div style={{ height: 6, background: C.border, borderRadius: 3, overflow: 'hidden' }}>
                      <div style={{ height: '100%', width: `${Math.round(segmentProgress * 100)}%`, background: C.accent, borderRadius: 3, transition: 'width 0.3s' }} />
                    </div>
                    <div style={{ fontSize: 11, color: C.textMut }}>{Math.round(segmentProgress * 100)}%</div>

                  {status === 'transcribing' && <>
                    <div style={{ fontSize: 13, color: C.textSec }}>
                      ⏳ Whisper 轉錄中…
                      {segmentCount > 0 && <span style={{ color: C.textMut, marginLeft: 6 }}>
                        {Math.round(uploadProgress * segmentCount)}/{segmentCount} 段
                      </span>}
                    </div>
                    <div style={{ height: 6, background: C.border, borderRadius: 3, overflow: 'hidden' }}>
                      <div style={{ height: '100%', width: `${Math.round(uploadProgress * 100)}%`, background: C.accent, borderRadius: 3, transition: 'width 0.3s' }} />
                    </div>
                    <div style={{ fontSize: 11, color: C.textMut }}>{Math.round(uploadProgress * 100)}%</div>

              <button style={{ ...btn('primary'), padding: 14, fontSize: 15, opacity: running ? 0.7 : 1 }} onClick={run} disabled={running}>
                {status === 'segmenting'   ? <><Spinner /> 切段中…</> :
                 status === 'transcribing' ? <><Spinner /> 語音轉文字中…</> :
                 status === 'summarizing'  ? <><Spinner /> AI 摘要生成中…</> :
                 '▶ 開始轉文字 & 摘要'}
              </button>
              {failedSegments.length > 0 && (
                <div style={{ ...S.card, padding: '12px 16px', background: C.dangerBg, borderColor: C.danger + '66', fontSize: 12, color: '#ff8a80' }}>
                  ⚠️ {failedSegments.length} 段轉錄失敗（{failedSegments.map(s => `段 ${s.index + 1}`).join('、')}），其餘已合併，可手動補充逐字稿。
                </div>
              )}

          {transcript && (
            <div style={S.panel} className="fade-in">
              <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 14 }}>🎙️ 會議逐字稿</div>
              <textarea style={{ ...S.input, minHeight: 200, lineHeight: 1.9, resize: 'vertical' }} value={transcript} onChange={e => setTranscript(e.target.value)} />
            </div>
          )}

          {summary && (
            <div style={S.panel} className="fade-in">
              <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 14 }}>

                <span style={{ ...badge(summaryEngine === 'claude' ? C.accent : C.warn), marginLeft: 10, fontSize: 11 }}>{summaryEngine === 'claude' ? 'Claude' : 'GPT-4o'}</span>
              </div>

                  {archiveSteps.map((s, i) => {
                    const isDone = i < archiveSteps.length - 1 || archiveSteps.length === 3;
                    return (
