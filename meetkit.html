<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeetKit ◈</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f1117;
      color: #e8e8e8;
      font-family: 'Noto Sans TC', 'PingFang TC', -apple-system, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    #root { min-height: 100vh; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2d35; border-radius: 4px; }
    input, textarea, button { font-family: inherit; }
    input:focus, textarea:focus { outline: none; }
    audio { background: #1a1d25; }
    @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(192,57,43,0.4); } 50% { box-shadow: 0 0 0 8px rgba(192,57,43,0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.25s ease; }
    @media (max-width: 768px) {
      .grid-2col { grid-template-columns: 1fr !important; }
      .grid-3-2 { grid-template-columns: 1fr !important; }
      .hide-mobile { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ─── SUPABASE ────────────────────────────────────────────────────────────────
    const SB_URL = "https://yrugcgzkomydmorgzwhb.supabase.co";
    const SB_KEY = "sb_publishable_m3Qi3HdfMT2pbcQHVuGxNw_696C0jYa";

    const db = (path, opts = {}) =>
      fetch(`${SB_URL}/rest/v1/${path}`, {
        headers: {
          apikey: SB_KEY,
          Authorization: `Bearer ${SB_KEY}`,
          "Content-Type": "application/json",
          Prefer: "return=representation",
          ...opts.headers,
        },
        ...opts,
      });

    const genId = () => Math.random().toString(36).slice(2, 8).toUpperCase();

    // ─── DESIGN TOKENS ───────────────────────────────────────────────────────────
    const C = {
      bgRoot:   '#0f1117',
      bgPanel:  '#16191f',
      bgCard:   '#1a1d25',
      bgInput:  '#0f1117',
      border:   '#2a2d35',
      accent:   '#5b8dee',
      success:  '#95d5b2',
      successBg:'#1e3a2f',
      successBd:'#2d6a4f',
      danger:   '#c0392b',
      dangerBg: '#2d1215',
      text:     '#e8e8e8',
      textSec:  '#888',
      textMut:  '#4a4d56',
      warn:     '#f0a020',
    };

    const S = {
      panel: { background: C.bgPanel, borderRadius: 12, padding: 24, border: `1px solid ${C.border}` },
      card:  { background: C.bgCard, borderRadius: 8, border: `1px solid ${C.border}`, overflow: 'hidden' },
      input: { background: C.bgInput, border: `1px solid ${C.border}`, borderRadius: 8, padding: '10px 12px', color: C.text, width: '100%', fontSize: 14, lineHeight: 1.5 },
      label: { fontSize: 12, color: C.textSec, marginBottom: 6, display: 'block', letterSpacing: '0.03em', fontWeight: 500 },
    };

    function btn(variant = 'default', extra = {}) {
      const base = { border: 'none', borderRadius: 8, padding: '10px 18px', cursor: 'pointer', fontSize: 14, fontWeight: 500, fontFamily: 'inherit', transition: 'opacity 0.15s', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 6, userSelect: 'none', whiteSpace: 'nowrap' };
      const variants = {
        primary: { background: C.accent, color: '#fff' },
        danger:  { background: C.danger, color: '#fff' },
        ghost:   { background: 'transparent', color: C.textSec, border: `1px solid ${C.border}` },
        default: { background: '#1e2230', color: C.text, border: `1px solid ${C.border}` },
        success: { background: C.successBd, color: C.success },
      };
      return { ...base, ...(variants[variant] || variants.default), ...extra };
    }

    function badge(color = C.accent, bg) {
      return { background: bg || (color + '22'), color, borderRadius: 10, padding: '2px 9px', fontSize: 12, fontWeight: 600, display: 'inline-flex', alignItems: 'center', gap: 4 };
    }

    function Spinner() {
      return <span style={{ width: 14, height: 14, border: `2px solid #ffffff44`, borderTopColor: '#fff', borderRadius: '50%', animation: 'spin 0.7s linear infinite', display: 'inline-block' }} />;
    }

    // ─── HOME ────────────────────────────────────────────────────────────────────
    function Home({ onEnter }) {
      const [joinCode,  setJoinCode]  = useState('');
      const [password,  setPassword]  = useState('');
      const [creating,  setCreating]  = useState(false);
      const [showPwField, setShowPwField] = useState(false);

      const createProject = async () => {
        setCreating(true);
        const id = genId();
        try {
          await db('projects', {
            method: 'POST',
            body: JSON.stringify({ id, title: '未命名專案', password: password.trim() }),
          });
        } catch {}
        sessionStorage.setItem(`mk_auth_${id}`, '1');
        onEnter(id);
        setCreating(false);
      };

      const joinProject = () => {
        const code = joinCode.trim().toUpperCase();
        if (code.length >= 4) onEnter(code);
      };

      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
          <div style={{ marginBottom: 48, textAlign: 'center' }}>
            <div style={{ fontSize: 48, marginBottom: 12 }}>◈</div>
            <div style={{ fontSize: 28, fontWeight: 700, letterSpacing: '-0.03em', color: C.text }}>MeetKit</div>
            <div style={{ fontSize: 14, color: C.textSec, marginTop: 8 }}>小團隊會議管理系統</div>
          </div>

          <div style={{ width: '100%', maxWidth: 420, display: 'flex', flexDirection: 'column', gap: 16 }}>
            {/* 建立新專案 */}
            <div style={S.panel}>
              <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 6 }}>建立新專案</div>
              <div style={{ fontSize: 13, color: C.textSec, marginBottom: 16, lineHeight: 1.6 }}>
                系統會產生一組專屬代碼，分享給與會者即可加入。
              </div>
              {showPwField ? (
                <div style={{ marginBottom: 12 }}>
                  <label style={S.label}>專案密碼（選填）</label>
                  <input
                    style={S.input} type="password" placeholder="留空則無密碼保護"
                    value={password} onChange={e => setPassword(e.target.value)}
                    autoFocus
                  />
                </div>
              ) : (
                <button style={{ ...btn('ghost'), fontSize: 12, marginBottom: 12, padding: '6px 12px' }} onClick={() => setShowPwField(true)}>
                  🔒 設定密碼保護（選填）
                </button>
              )}
              <button
                style={{ ...btn('primary'), width: '100%', padding: 13, fontSize: 15, opacity: creating ? 0.7 : 1 }}
                onClick={createProject} disabled={creating}
              >
                {creating ? <><Spinner /> 建立中…</> : '＋ 建立新專案'}
              </button>
            </div>

            <div style={{ textAlign: 'center', fontSize: 13, color: C.textMut }}>或</div>

            {/* 加入專案 */}
            <div style={S.panel}>
              <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 16 }}>加入現有專案</div>
              <input
                style={S.input}
                placeholder="輸入 6 碼專案代碼（例：A3X9KP）"
                value={joinCode}
                onChange={e => setJoinCode(e.target.value.toUpperCase())}
                onKeyDown={e => e.key === 'Enter' && joinProject()}
                maxLength={8}
              />
              <button
                style={{ ...btn('default'), width: '100%', marginTop: 12, padding: 11 }}
                onClick={joinProject} disabled={joinCode.trim().length < 4}
              >
                加入專案 →
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ─── HEADER ──────────────────────────────────────────────────────────────────
    function Header({ phase, setPhase, syncOk, journalCount, projectId, projectTitle, onTitleSave }) {
      const [editing, setEditing] = useState(false);
      const [draft, setDraft] = useState(projectTitle);

      useEffect(() => { setDraft(projectTitle); }, [projectTitle]);

      const save = async () => {
        await db(`projects?id=eq.${projectId}`, {
          method: 'PATCH',
          body: JSON.stringify({ title: draft }),
        });
        onTitleSave(draft);
        setEditing(false);
      };

      const phases = [
        { id: 0, icon: '📋', label: '會前提案' },
        { id: 1, icon: '🎙️', label: '會議進行' },
        { id: 2, icon: '📝', label: '會後整理' },
      ];

      return (
        <header style={{ background: C.bgPanel + 'ee', borderBottom: `1px solid ${C.border}`, position: 'sticky', top: 0, zIndex: 100, backdropFilter: 'blur(16px)' }}>
          {/* Project title bar */}
          <div style={{ borderBottom: `1px solid ${C.border}22`, padding: '6px 20px', display: 'flex', alignItems: 'center', gap: 10, maxWidth: 1100, margin: '0 auto' }}>
            <span style={{ fontSize: 11, color: C.textMut, letterSpacing: '0.05em' }}>專案</span>
            {editing ? (
              <>
                <input
                  style={{ ...S.input, padding: '3px 8px', fontSize: 13, width: 'auto', flex: 1, maxWidth: 320 }}
                  value={draft}
                  onChange={e => setDraft(e.target.value)}
                  onKeyDown={e => { if (e.key === 'Enter') save(); if (e.key === 'Escape') setEditing(false); }}
                  autoFocus
                />
                <button style={{ ...btn('primary'), padding: '3px 12px', fontSize: 12 }} onClick={save}>儲存</button>
                <button style={{ ...btn('ghost'), padding: '3px 10px', fontSize: 12 }} onClick={() => setEditing(false)}>取消</button>
              </>
            ) : (
              <>
                <span style={{ fontSize: 13, fontWeight: 600, color: C.text }}>{projectTitle || '未命名專案'}</span>
                <button style={{ ...btn('ghost'), padding: '2px 8px', fontSize: 11, color: C.textMut, borderColor: 'transparent' }} onClick={() => setEditing(true)}>✏️</button>
                <span style={{ marginLeft: 'auto', fontSize: 11, color: C.textMut }}>代碼：<span style={{ fontFamily: 'monospace', color: C.textSec, letterSpacing: '0.1em' }}>{projectId}</span></span>
              </>
            )}
          </div>

          {/* Nav bar */}
          <div style={{ maxWidth: 1100, margin: '0 auto', padding: '0 20px', height: 52, display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12 }}>
            <div style={{ fontWeight: 700, fontSize: 16, letterSpacing: '-0.03em', display: 'flex', alignItems: 'center', gap: 7, flexShrink: 0 }}>
              <span style={{ color: C.accent }}>◈</span> MeetKit
            </div>

            <nav style={{ display: 'flex', alignItems: 'center', gap: 3 }}>
              {phases.map((p, i) => (
                <React.Fragment key={p.id}>
                  <button
                    onClick={() => setPhase(p.id)}
                    style={{ ...btn(phase === p.id ? 'primary' : 'ghost'), padding: '6px 13px', fontSize: 13, opacity: phase > p.id ? 0.55 : phase === p.id ? 1 : 0.75 }}
                  >
                    <span>{p.icon}</span>
                    <span className="hide-mobile">{p.label}</span>
                  </button>
                  {i < phases.length - 1 && <span style={{ color: C.textMut, fontSize: 11, margin: '0 1px' }}>›</span>}
                </React.Fragment>
              ))}
              <span style={{ color: C.textMut, fontSize: 11, margin: '0 4px' }}>|</span>
              <button
                onClick={() => setPhase(3)}
                style={{ ...btn(phase === 3 ? 'default' : 'ghost'), padding: '6px 13px', fontSize: 13, border: phase === 3 ? `1px solid ${C.accent}` : `1px solid ${C.border}`, color: phase === 3 ? C.accent : C.textSec, position: 'relative' }}
              >
                <span>📚</span>
                <span className="hide-mobile">日誌</span>
                {journalCount > 0 && <span style={{ ...badge(C.accent), fontSize: 10, padding: '0px 5px', position: 'absolute', top: -6, right: -6 }}>{journalCount}</span>}
              </button>
            </nav>

            <div style={{ display: 'flex', alignItems: 'center', gap: 5, fontSize: 12, color: C.textSec, flexShrink: 0 }}>
              <span style={{ width: 7, height: 7, borderRadius: '50%', background: syncOk ? C.success : C.textMut, display: 'inline-block', boxShadow: syncOk ? `0 0 0 2px ${C.success}44` : 'none' }} />
              <span className="hide-mobile">{syncOk ? '即時同步' : '離線'}</span>
            </div>
          </div>
        </header>
      );
    }

    // ─── PRE-MEETING ─────────────────────────────────────────────────────────────
    function PreMeeting({ projectId, proposals, setProposals, setSyncOk, journal, projectTitle, meetingDate, setMeetingDate, meetingTime, setMeetingTime }) {
      const [form, setForm] = useState({ author: '', title: '', content: '' });
      const [attachFile, setAttachFile] = useState(null);
      const [uploading, setUploading] = useState(false);
      const [submitting, setSubmitting] = useState(false);
      const [expanded, setExpanded] = useState({});
      const [cardUploading, setCardUploading] = useState({});
      const [toast, setToast] = useState('');
      const attachRef = useRef();
      const cardFileRefs = useRef({});

      const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 2500); };

      const loadProposals = useCallback(async () => {
        try {
          const res = await db(`proposals?select=*&project_id=eq.${projectId}&order=id.asc`);
          if (res.ok) { setProposals(await res.json()); setSyncOk(true); }
        } catch { setSyncOk(false); }
      }, [projectId, setProposals, setSyncOk]);

      useEffect(() => {
        loadProposals();
        const t = setInterval(loadProposals, 5000);
        return () => clearInterval(t);
      }, [loadProposals]);

      const submit = async () => {
        if (!form.author.trim() || !form.title.trim() || !form.content.trim()) { showToast('請填寫所有欄位'); return; }
        setSubmitting(true);
        let file_url = '', file_name = '';
        if (attachFile) {
          setUploading(true);
          try {
            const safeName = attachFile.name.replace(/[^a-zA-Z0-9._\-\u4e00-\u9fff]/g, '_');
            const path = `${projectId}/${Date.now()}_${safeName}`;
            const upRes = await fetch(`${SB_URL}/storage/v1/object/presentations/${path}`, {
              method: 'POST',
              headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, 'Content-Type': attachFile.type || 'application/octet-stream' },
              body: attachFile,
            });
            if (upRes.ok) {
              file_url = `${SB_URL}/storage/v1/object/public/presentations/${path}`;
              file_name = attachFile.name;
            } else { showToast('檔案上傳失敗，提案仍送出（無附件）'); }
          } catch { showToast('檔案上傳失敗，提案仍送出（無附件）'); }
          setUploading(false);
        }
        try {
          const res = await db("proposals", { method: 'POST', body: JSON.stringify({ ...form, project_id: projectId, file_url, file_name }) });
          if (res.ok) { setForm({ author: '', title: '', content: '' }); setAttachFile(null); await loadProposals(); showToast('✓ 提案已送出！'); }
          else showToast('送出失敗，請再試一次');
        } catch { showToast('網路錯誤，請再試一次'); }
        finally { setSubmitting(false); }
      };

      const deleteProposal = async (id) => { await db(`proposals?id=eq.${id}`, { method: 'DELETE' }); await loadProposals(); };
      const toggle = (id) => setExpanded(e => ({ ...e, [id]: !e[id] }));

      const uploadCardFile = async (proposalId, file) => {
        setCardUploading(s => ({ ...s, [proposalId]: true }));
        try {
          const safeName = file.name.replace(/[^a-zA-Z0-9._\-\u4e00-\u9fff]/g, '_');
          const path = `${projectId}/${Date.now()}_${safeName}`;
          const upRes = await fetch(`${SB_URL}/storage/v1/object/presentations/${path}`, {
            method: 'POST',
            headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, 'Content-Type': file.type || 'application/octet-stream' },
            body: file,
          });
          if (upRes.ok) {
            const file_url = `${SB_URL}/storage/v1/object/public/presentations/${path}`;
            await db(`proposals?id=eq.${proposalId}`, { method: 'PATCH', body: JSON.stringify({ file_url, file_name: file.name }) });
            await loadProposals();
            showToast('✓ 附件已更新！');
          } else { showToast('上傳失敗，請再試一次'); }
        } catch { showToast('上傳失敗，請再試一次'); }
        setCardUploading(s => ({ ...s, [proposalId]: false }));
      };
      const lastMeeting = journal && journal.length > 0 ? journal[journal.length - 1] : null;

      const saveMeetingInfo = async (date, time) => {
        await db(`projects?id=eq.${projectId}`, { method: 'PATCH', body: JSON.stringify({ meeting_date: date, meeting_time: time }) });
      };

      const copyInvite = () => {
        const url = `${window.location.origin}${window.location.pathname}?p=${projectId}`;
        const lines = [
          `📅 開會通知`,
          ``,
          `專案：${projectTitle || projectId}`,
          meetingDate ? `日期：${meetingDate}` : null,
          meetingTime ? `時間：${meetingTime}` : null,
          ``,
          `連結：${url}`,
        ].filter(l => l !== null).join('\n');
        navigator.clipboard.writeText(lines).then(() => showToast('✓ 開會通知已複製！'));
      };

      return (
        <div style={{ maxWidth: 1100, margin: '0 auto', padding: '28px 20px' }}>

          {/* 開會資訊 */}
          <div style={{ ...S.panel, marginBottom: 20, display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap' }} className="fade-in">
            <span style={{ fontSize: 14, fontWeight: 600, color: C.text, flexShrink: 0 }}>📅 開會時間</span>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, flex: 1, flexWrap: 'wrap' }}>
              <input
                type="date"
                style={{ ...S.input, width: 'auto', minWidth: 150, colorScheme: 'dark' }}
                value={meetingDate}
                onChange={e => { setMeetingDate(e.target.value); saveMeetingInfo(e.target.value, meetingTime); }}
                placeholder="選擇日期"
              />
              <input
                type="time"
                style={{ ...S.input, width: 'auto', minWidth: 120, colorScheme: 'dark' }}
                value={meetingTime}
                onChange={e => { setMeetingTime(e.target.value); saveMeetingInfo(meetingDate, e.target.value); }}
              />
              {(meetingDate || meetingTime) && (
                <span style={{ fontSize: 13, color: C.textSec }}>
                  {meetingDate && new Date(meetingDate + 'T00:00').toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' })}
                  {meetingTime && `　${meetingTime}`}
                </span>
              )}
            </div>
            <button style={{ ...btn('default'), padding: '8px 16px', fontSize: 13, flexShrink: 0 }} onClick={copyInvite}>
              📋 複製開會通知
            </button>
          </div>

          {lastMeeting && (
            <div style={{ ...S.card, marginBottom: 20, padding: '14px 18px', borderColor: C.accent + '44', background: C.accent + '08' }} className="fade-in">
              <div style={{ fontSize: 13, fontWeight: 600, color: C.accent, display: 'flex', alignItems: 'center', gap: 7, marginBottom: 10 }}>
                📌 上次會議備忘 <span style={{ fontWeight: 400, color: C.textSec }}>{lastMeeting.date}</span>
              </div>
              <div style={{ fontSize: 13, color: C.textSec, lineHeight: 1.8, whiteSpace: 'pre-wrap' }}>
                {lastMeeting.summary ? lastMeeting.summary.split('\n').filter(l => l.trim()).slice(0, 6).join('\n') : '（無摘要）'}
              </div>
              {lastMeeting.summary && lastMeeting.summary.split('\n').filter(l => l.trim()).length > 6 && (
                <div style={{ fontSize: 12, color: C.textMut, marginTop: 6 }}>…前往「📚 日誌」查看完整內容</div>
              )}
            </div>
          )}

          {toast && (
            <div style={{ position: 'fixed', bottom: 24, left: '50%', transform: 'translateX(-50%)', background: C.bgPanel, border: `1px solid ${C.border}`, borderRadius: 10, padding: '10px 20px', fontSize: 14, color: C.text, zIndex: 200, boxShadow: '0 8px 32px rgba(0,0,0,0.4)', animation: 'fadeIn 0.2s ease' }}>
              {toast}
            </div>
          )}

          <div className="grid-2col" style={{ display: 'grid', gridTemplateColumns: '2fr 3fr', gap: 20 }}>
            <div style={S.panel} className="fade-in">
              <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 20 }}>✏️ 提交議程提案</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
                <div>
                  <label style={S.label}>提案者姓名</label>
                  <input style={S.input} placeholder="你的名字" value={form.author} onChange={e => setForm(f => ({ ...f, author: e.target.value }))} />
                </div>
                <div>
                  <label style={S.label}>提案標題</label>
                  <input style={S.input} placeholder="簡短描述議程主題" value={form.title} onChange={e => setForm(f => ({ ...f, title: e.target.value }))} />
                </div>
                <div>
                  <label style={S.label}>提案內容</label>
                  <textarea style={{ ...S.input, minHeight: 130, resize: 'vertical' }} placeholder="詳細說明希望討論的問題..." value={form.content} onChange={e => setForm(f => ({ ...f, content: e.target.value }))} />
                </div>
                <div>
                  <label style={S.label}>附加簡報／文件（選填）</label>
                  <input ref={attachRef} type="file" accept=".pdf,.ppt,.pptx,.key,.doc,.docx" style={{ display: 'none' }} onChange={e => setAttachFile(e.target.files[0] || null)} />
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <button type="button" style={{ ...btn('ghost'), padding: '7px 14px', fontSize: 13 }} onClick={() => attachRef.current.click()}>
                      📎 選擇檔案
                    </button>
                    {attachFile ? (
                      <div style={{ display: 'flex', alignItems: 'center', gap: 6, flex: 1, minWidth: 0 }}>
                        <span style={{ fontSize: 13, color: C.text, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{attachFile.name}</span>
                        <button type="button" style={{ ...btn('ghost'), padding: '2px 7px', fontSize: 12, color: C.danger, borderColor: 'transparent', flexShrink: 0 }} onClick={() => { setAttachFile(null); attachRef.current.value = ''; }}>✕</button>
                      </div>
                    ) : (
                      <span style={{ fontSize: 12, color: C.textMut }}>PDF、PPT、PPTX、Keynote…</span>
                    )}
                  </div>
                </div>
                <button style={{ ...btn('primary'), width: '100%', padding: 13, fontSize: 15, opacity: (submitting || uploading) ? 0.65 : 1 }} onClick={submit} disabled={submitting || uploading}>
                  {uploading ? <><Spinner /> 上傳檔案中…</> : submitting ? <><Spinner /> 送出中…</> : '送出提案'}
                </button>
              </div>
              <div style={{ marginTop: 18, padding: '12px 14px', background: C.bgCard, borderRadius: 8, fontSize: 12, color: C.textSec, lineHeight: 1.7 }}>
                💡 所有與會者使用同一個連結。提案送出後所有人即時可見。
              </div>
            </div>

            <div style={S.panel} className="fade-in">
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 18 }}>
                <div style={{ fontSize: 15, fontWeight: 600, display: 'flex', alignItems: 'center', gap: 10 }}>
                  📋 議程提案 <span style={badge(C.accent)}>{proposals.length}</span>
                </div>
                <button style={{ ...btn('ghost'), padding: '6px 12px', fontSize: 13 }} onClick={loadProposals}>↻ 重整</button>
              </div>
              {proposals.length === 0 ? (
                <div style={{ textAlign: 'center', padding: '56px 0', color: C.textMut }}>
                  <div style={{ fontSize: 36, marginBottom: 12 }}>📭</div>
                  <div style={{ fontSize: 14 }}>尚無提案，成為第一個提案者吧！</div>
                </div>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                  {proposals.map((p, i) => (
                    <div key={p.id} style={S.card}>
                      <div style={{ padding: '11px 14px', display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer' }} onClick={() => toggle(p.id)}>
                        <span style={{ ...badge(C.accent), minWidth: 26, justifyContent: 'center', flexShrink: 0 }}>{i + 1}</span>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontWeight: 500, fontSize: 14, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{p.title}</div>
                          <div style={{ fontSize: 12, color: C.textSec, marginTop: 1 }}>{p.author}</div>
                        </div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexShrink: 0 }}>
                          <span style={{ color: C.textMut, fontSize: 12 }}>{expanded[p.id] ? '▲' : '▼'}</span>
                          <button style={{ ...btn('ghost'), padding: '3px 8px', fontSize: 13, color: C.danger, borderColor: 'transparent' }} onClick={e => { e.stopPropagation(); deleteProposal(p.id); }}>✕</button>
                        </div>
                      </div>
                      {expanded[p.id] && (
                        <div style={{ padding: '0 14px 14px', borderTop: `1px solid ${C.border}` }}>
                          <div style={{ paddingTop: 12, fontSize: 13, color: C.textSec, lineHeight: 1.8, whiteSpace: 'pre-wrap' }}>{p.content}</div>
                          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 10, flexWrap: 'wrap' }}>
                            {p.file_url && (
                              <a href={p.file_url} target="_blank" rel="noopener noreferrer" style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '6px 12px', background: C.accent + '18', border: `1px solid ${C.accent}44`, borderRadius: 7, fontSize: 12, color: C.accent, textDecoration: 'none', fontWeight: 500 }}>
                                📎 {p.file_name || '查看附件'}
                              </a>
                            )}
                            <input
                              type="file" accept=".pdf,.ppt,.pptx,.key,.doc,.docx"
                              style={{ display: 'none' }}
                              ref={el => cardFileRefs.current[p.id] = el}
                              onChange={e => { if (e.target.files[0]) uploadCardFile(p.id, e.target.files[0]); }}
                            />
                            <button
                              style={{ ...btn('ghost'), padding: '5px 11px', fontSize: 12, opacity: cardUploading[p.id] ? 0.6 : 1 }}
                              onClick={() => cardFileRefs.current[p.id]?.click()}
                              disabled={cardUploading[p.id]}
                            >
                              {cardUploading[p.id] ? <><Spinner /> 上傳中…</> : p.file_url ? '🔄 更換附件' : '📎 加入附件'}
                            </button>
                          </div>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ─── MEETING ─────────────────────────────────────────────────────────────────
    function Meeting({ proposals, audioBlob, setAudioBlob }) {
      const [activeId, setActiveId] = useState(null);
      const [expanded, setExpanded] = useState({});
      const [isRecording, setIsRecording] = useState(false);
      const [elapsed, setElapsed] = useState(0);
      const [audioUrl, setAudioUrl] = useState(null);
      const mrRef = useRef(null); const chunksRef = useRef([]); const timerRef = useRef(null);

      const pad = n => String(n).padStart(2, '0');
      const fmt = s => `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;

      const startRec = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const mime = ['audio/webm;codecs=opus','audio/webm','audio/ogg','audio/mp4'].find(t => MediaRecorder.isTypeSupported(t)) || '';
          const mr = new MediaRecorder(stream, { ...(mime ? { mimeType: mime } : {}), audioBitsPerSecond: 32000 });
          chunksRef.current = [];
          mr.ondataavailable = e => { if (e.data.size > 0) chunksRef.current.push(e.data); };
          mr.onstop = () => { const blob = new Blob(chunksRef.current, { type: mr.mimeType }); setAudioBlob(blob); setAudioUrl(URL.createObjectURL(blob)); stream.getTracks().forEach(t => t.stop()); };
          mr.start(500); mrRef.current = mr; setIsRecording(true); setElapsed(0);
          timerRef.current = setInterval(() => setElapsed(t => t + 1), 1000);
        } catch (err) { alert('無法取得麥克風：' + err.message); }
      };

      const stopRec = () => { if (mrRef.current?.state !== 'inactive') mrRef.current.stop(); setIsRecording(false); clearInterval(timerRef.current); };
      useEffect(() => () => clearInterval(timerRef.current), []);
      const toggleActive = (id) => { setActiveId(prev => prev === id ? null : id); setExpanded(e => ({ ...e, [id]: true })); };

      return (
        <div style={{ maxWidth: 1100, margin: '0 auto', padding: '28px 20px' }}>
          <div className="grid-3-2" style={{ display: 'grid', gridTemplateColumns: '3fr 2fr', gap: 20 }}>
            <div style={S.panel} className="fade-in">
              <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 18, display: 'flex', alignItems: 'center', gap: 10 }}>
                📋 議程 <span style={badge(C.accent)}>{proposals.length}</span>
                {activeId && <span style={badge(C.success, C.successBg)}>● 主持中</span>}
              </div>
              {proposals.length === 0 ? (
                <div style={{ textAlign: 'center', padding: '56px 0', color: C.textMut, fontSize: 14 }}>請先在「會前提案」收集議程</div>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                  {proposals.map((p, i) => {
                    const active = activeId === p.id;
                    return (
                      <div key={p.id} style={{ ...S.card, border: `1px solid ${active ? C.accent : C.border}`, boxShadow: active ? `0 0 0 2px ${C.accent}22` : 'none', transition: 'all 0.2s' }}>
                        <div style={{ padding: '12px 14px', display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer' }} onClick={() => toggleActive(p.id)}>
                          <span style={{ ...badge(active ? '#fff' : C.accent, active ? C.accent : C.accent + '22'), minWidth: 26, justifyContent: 'center', flexShrink: 0 }}>{i + 1}</span>
                          <div style={{ flex: 1, minWidth: 0 }}>
                            <div style={{ fontWeight: 500, fontSize: 14, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{p.title}</div>
                            <div style={{ fontSize: 12, color: C.textSec, marginTop: 1 }}>{p.author}</div>
                          </div>
                          <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexShrink: 0 }}>
                            {active && <span style={badge(C.success, C.successBg)}>● 討論中</span>}
                            <span style={{ color: C.textMut, fontSize: 12 }}>{expanded[p.id] ? '▲' : '▼'}</span>
                          </div>
                        </div>
                        {expanded[p.id] && (
                          <div style={{ padding: '0 14px 14px', borderTop: `1px solid ${C.border}` }}>
                            <div style={{ paddingTop: 12, fontSize: 13, color: C.textSec, lineHeight: 1.8, whiteSpace: 'pre-wrap' }}>{p.content}</div>
                            {p.file_url && (
                              <a href={p.file_url} target="_blank" rel="noopener noreferrer" style={{ display: 'inline-flex', alignItems: 'center', gap: 6, marginTop: 10, padding: '7px 14px', background: C.accent + '22', border: `1px solid ${C.accent}55`, borderRadius: 7, fontSize: 13, color: C.accent, textDecoration: 'none', fontWeight: 600 }}>
                                📎 開啟簡報：{p.file_name || '查看附件'}
                              </a>
                            )}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>

            <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
              <div style={S.panel} className="fade-in">
                <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 20 }}>🎙️ 全場錄音</div>
                <div style={{ textAlign: 'center', padding: '16px 0' }}>
                  <div style={{ width: 88, height: 88, borderRadius: '50%', margin: '0 auto 20px', background: isRecording ? C.dangerBg : C.bgCard, border: `2px solid ${isRecording ? C.danger : C.border}`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 32, animation: isRecording ? 'pulse 1.5s infinite' : 'none', transition: 'all 0.3s' }}>🎤</div>
                  {isRecording && <div style={{ fontSize: 28, fontWeight: 700, color: C.danger, marginBottom: 6, fontVariantNumeric: 'tabular-nums', letterSpacing: '0.05em' }}>{fmt(elapsed)}</div>}
                  <div style={{ color: C.textSec, fontSize: 13, marginBottom: 20 }}>{isRecording ? '錄音中，請勿關閉頁面' : audioUrl ? '✓ 錄音完成' : '準備好後開始錄音'}</div>
                  <button style={{ ...btn(isRecording ? 'danger' : 'primary'), width: '100%', padding: 13, fontSize: 15 }} onClick={isRecording ? stopRec : startRec}>
                    {isRecording ? '⏹ 停止錄音' : audioUrl ? '⏺ 重新錄音' : '⏺ 開始錄音'}
                  </button>
                </div>
                {audioUrl && (
                  <div style={{ marginTop: 4 }}>
                    <label style={S.label}>預覽錄音</label>
                    <audio controls src={audioUrl} style={{ width: '100%', borderRadius: 8, height: 40 }} />
                  </div>
                )}
              </div>
              <div style={{ ...S.card, padding: '12px 14px', fontSize: 13, color: C.textSec, background: C.textSec + '11', borderColor: C.textSec + '33', lineHeight: 1.7 }}>
                💡 點選左側議程可標記目前討論中的項目。
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ─── POST-MEETING ────────────────────────────────────────────────────────────
    function PostMeeting({ proposals, audioBlob, onSaveJournal }) {
      const [openaiKey,    setOpenaiKey]    = useState(() => localStorage.getItem('mk_openai_key') || '');
      const [anthropicKey, setAnthropicKey] = useState(() => localStorage.getItem('mk_anthropic_key') || '');
      const [uploadFile,   setUploadFile]   = useState(null);
      const [status,       setStatus]       = useState('idle');
      const [transcript,   setTranscript]   = useState('');
      const [summary,      setSummary]      = useState('');
      const [errMsg,       setErrMsg]       = useState('');
      const fileRef = useRef();
      const audioSrc = uploadFile || audioBlob;

      const run = async () => {
        if (!openaiKey.trim()) { setErrMsg('請輸入 OpenAI API Key'); return; }
        if (!audioSrc) { setErrMsg('請先錄音或上傳音檔'); return; }
        setErrMsg(''); setStatus('transcribing');
        let txText = '';
        try {
          const fd = new FormData();
          fd.append('file', audioSrc, uploadFile?.name || 'recording.webm');
          fd.append('model', 'whisper-1'); fd.append('language', 'zh');
          const res = await fetch('https://api.openai.com/v1/audio/transcriptions', { method: 'POST', headers: { Authorization: `Bearer ${openaiKey.trim()}` }, body: fd });
          if (!res.ok) { const e = await res.json(); throw new Error(e.error?.message || `HTTP ${res.status}`); }
          txText = (await res.json()).text; setTranscript(txText);
        } catch (e) { setErrMsg('語音轉文字失敗：' + e.message); setStatus('error'); return; }

        setStatus('summarizing');
        const agendaList = proposals.length ? proposals.map((p, i) => `${i + 1}. ${p.title}（${p.author}）`).join('\n') : '（無提案議程）';
        const prompt = `以下是一場會議的逐字稿，議程包含：\n${agendaList}\n\n逐字稿：\n${txText}\n\n請用繁體中文整理出：\n1. 各議程討論重點\n2. 決議事項\n3. 待辦行動（含負責人）\n請用條列方式呈現，清楚分段。`;
        try {
          if (anthropicKey.trim()) {
            const res = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'x-api-key': anthropicKey.trim(), 'anthropic-version': '2023-06-01', 'anthropic-dangerous-request-allow-browsers': 'true', 'Content-Type': 'application/json' }, body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 2048, messages: [{ role: 'user', content: prompt }] }) });
            if (!res.ok) { const e = await res.json(); throw new Error(e.error?.message || `HTTP ${res.status}`); }
            setSummary((await res.json()).content[0].text);
          } else {
            const res = await fetch('https://api.openai.com/v1/chat/completions', { method: 'POST', headers: { Authorization: `Bearer ${openaiKey.trim()}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ model: 'gpt-4o', messages: [{ role: 'user', content: prompt }] }) });
            if (!res.ok) { const e = await res.json(); throw new Error(e.error?.message || `HTTP ${res.status}`); }
            setSummary((await res.json()).choices[0].message.content);
          }
        } catch (e) { setErrMsg('AI 摘要失敗：' + e.message); setStatus('error'); return; }
        setStatus('done');
      };

      const exportMd = () => {
        const date = new Date().toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric' });
        const agendaSec = proposals.length ? proposals.map((p, i) => `### ${i + 1}. ${p.title}\n**提案者：** ${p.author}\n\n${p.content}`).join('\n\n---\n\n') : '（無提案）';
        const md = `# 會議紀錄\n\n**日期：** ${date}\n\n---\n\n## 📋 議程提案\n\n${agendaSec}\n\n---\n\n## 🎙️ 會議逐字稿\n\n${transcript}\n\n---\n\n## 📝 AI 摘要整理\n\n${summary}\n`;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([md], { type: 'text/markdown; charset=utf-8' }));
        a.download = `meetkit-${new Date().toISOString().slice(0,10)}.md`; a.click();
      };

      const running = status === 'transcribing' || status === 'summarizing';

      return (
        <div style={{ maxWidth: 800, margin: '0 auto', padding: '28px 20px', display: 'flex', flexDirection: 'column', gap: 18 }}>
          <div style={S.panel} className="fade-in">
            <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 18 }}>🔑 API 設定</div>
            <div className="grid-2col" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
              <div>
                <label style={S.label}>OpenAI API Key（必填，語音轉文字）</label>
                <input style={S.input} type="password" placeholder="sk-…" value={openaiKey} onChange={e => { setOpenaiKey(e.target.value); localStorage.setItem('mk_openai_key', e.target.value); }} autoComplete="off" />
              </div>
              <div>
                <label style={S.label}>Anthropic API Key（選填，優先用 Claude 摘要）</label>
                <input style={S.input} type="password" placeholder="sk-ant-…" value={anthropicKey} onChange={e => { setAnthropicKey(e.target.value); localStorage.setItem('mk_anthropic_key', e.target.value); }} autoComplete="off" />
              </div>
            </div>
            <div style={{ marginTop: 12, fontSize: 12, color: C.textMut, lineHeight: 1.6 }}>
              🔒 API Key 儲存於本機瀏覽器，不傳送至任何第三方。未填 Anthropic Key 時自動改用 GPT-4o 摘要。
            </div>
          </div>

          <div style={S.panel} className="fade-in">
            <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 16 }}>🎵 音檔來源</div>
            {audioBlob && <div style={{ ...S.card, padding: '10px 14px', marginBottom: 14, display: 'flex', alignItems: 'center', gap: 10 }}><span style={badge(C.success, C.successBg)}>✓ 已有錄音</span><span style={{ fontSize: 13, color: C.textSec }}>來自「會議進行」的錄音</span></div>}
            <div>
              <label style={S.label}>{audioBlob ? '或改用上傳的音檔' : '上傳音檔'}</label>
              <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
                <input ref={fileRef} type="file" accept="audio/*,video/webm" style={{ display: 'none' }} onChange={e => setUploadFile(e.target.files[0])} />
                <button style={{ ...btn(), padding: '9px 16px' }} onClick={() => fileRef.current.click()}>📂 選擇音檔</button>
                {uploadFile && <span style={{ fontSize: 13, color: C.textSec }}>{uploadFile.name}</span>}
              </div>
            </div>
          </div>

          {errMsg && <div style={{ ...S.card, padding: '12px 16px', background: C.dangerBg, borderColor: C.danger + '66', color: '#ff8a80', fontSize: 13 }}>⚠️ {errMsg}</div>}

          {status !== 'done' && (
            <button style={{ ...btn('primary'), padding: 14, fontSize: 15, opacity: running ? 0.7 : 1 }} onClick={run} disabled={running}>
              {status === 'transcribing' ? <><Spinner /> 語音轉文字中…</> : status === 'summarizing' ? <><Spinner /> AI 摘要生成中…</> : '▶ 開始轉文字 & 摘要'}
            </button>
          )}

          {transcript && (
            <div style={S.panel} className="fade-in">
              <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 14 }}>🎙️ 會議逐字稿</div>
              <textarea style={{ ...S.input, minHeight: 200, lineHeight: 1.9, resize: 'vertical' }} value={transcript} onChange={e => setTranscript(e.target.value)} />
            </div>
          )}

          {summary && (
            <div style={S.panel} className="fade-in">
              <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 14 }}>
                📝 AI 摘要整理
                <span style={{ ...badge(anthropicKey ? C.accent : C.warn), marginLeft: 10, fontSize: 11 }}>{anthropicKey ? 'Claude' : 'GPT-4o'}</span>
              </div>
              <textarea style={{ ...S.input, minHeight: 260, lineHeight: 1.9, resize: 'vertical' }} value={summary} onChange={e => setSummary(e.target.value)} />
            </div>
          )}

          {status === 'done' && (
            <div style={{ display: 'flex', gap: 12 }} className="fade-in">
              <button style={{ ...btn('success'), padding: 14, fontSize: 15, flex: 1 }} onClick={exportMd}>⬇ 匯出 Markdown</button>
              <button style={{ ...btn('primary'), padding: 14, fontSize: 15, flex: 1 }} onClick={() => onSaveJournal({ proposals, transcript, summary })}>📚 存入日誌</button>
            </div>
          )}
        </div>
      );
    }

    // ─── JOURNAL ─────────────────────────────────────────────────────────────────
    function Journal({ journal, setJournal, projectId }) {
      const [search, setSearch] = useState('');
      const [expanded, setExpanded] = useState({});

      const filtered = journal.slice().reverse().filter(m => {
        if (!search.trim()) return true;
        const q = search.toLowerCase();
        return m.date?.toLowerCase().includes(q) || m.summary?.toLowerCase().includes(q) || m.transcript?.toLowerCase().includes(q) || m.proposals?.some(p => p.title?.toLowerCase().includes(q) || p.author?.toLowerCase().includes(q));
      });

      const deleteEntry = (id) => {
        const updated = journal.filter(m => m.id !== id);
        setJournal(updated);
        localStorage.setItem(`mk_journal_${projectId}`, JSON.stringify(updated));
      };

      return (
        <div style={{ maxWidth: 860, margin: '0 auto', padding: '28px 20px' }}>
          <div style={{ display: 'flex', alignItems: 'center', marginBottom: 20 }}>
            <div style={{ fontSize: 18, fontWeight: 600, display: 'flex', alignItems: 'center', gap: 10 }}>
              📚 會議日誌 <span style={badge(C.accent)}>{journal.length} 場</span>
            </div>
          </div>
          <input style={{ ...S.input, marginBottom: 20 }} placeholder="🔍 搜尋關鍵字、日期、提案者…" value={search} onChange={e => setSearch(e.target.value)} />

          {journal.length === 0 ? (
            <div style={{ textAlign: 'center', padding: '72px 0', color: C.textMut }}>
              <div style={{ fontSize: 40, marginBottom: 14 }}>📭</div>
              <div style={{ fontSize: 14 }}>尚無會議記錄</div>
              <div style={{ fontSize: 12, marginTop: 6 }}>完成會後整理後按「存入日誌」建立紀錄</div>
            </div>
          ) : filtered.length === 0 ? (
            <div style={{ textAlign: 'center', padding: '48px 0', color: C.textMut, fontSize: 14 }}>找不到「{search}」相關記錄</div>
          ) : (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
              {filtered.map((m) => (
                <div key={m.id} style={S.card} className="fade-in">
                  <div style={{ padding: '14px 18px', display: 'flex', alignItems: 'center', gap: 12, cursor: 'pointer' }} onClick={() => setExpanded(e => ({ ...e, [m.id]: !e[m.id] }))}>
                    <span style={{ ...badge(C.accent), minWidth: 28, justifyContent: 'center', flexShrink: 0 }}>{journal.length - journal.findIndex(x => x.id === m.id)}</span>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontWeight: 600, fontSize: 14 }}>{m.date}</div>
                      <div style={{ fontSize: 12, color: C.textSec, marginTop: 2 }}>{m.proposals?.length || 0} 項議程{m.transcript ? ' · 有逐字稿' : ''}</div>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <span style={{ color: C.textMut, fontSize: 12 }}>{expanded[m.id] ? '▲' : '▼'}</span>
                      <button style={{ ...btn('ghost'), padding: '3px 8px', fontSize: 13, color: C.danger, borderColor: 'transparent' }} onClick={e => { e.stopPropagation(); if (confirm('確定刪除？')) deleteEntry(m.id); }}>✕</button>
                    </div>
                  </div>
                  {expanded[m.id] && (
                    <div style={{ borderTop: `1px solid ${C.border}`, padding: '16px 18px', display: 'flex', flexDirection: 'column', gap: 16 }}>
                      {m.proposals?.length > 0 && (
                        <div>
                          <div style={{ fontSize: 12, fontWeight: 600, color: C.textSec, marginBottom: 8 }}>議程</div>
                          {m.proposals.map((p, pi) => (
                            <div key={pi} style={{ ...S.card, padding: '8px 12px', display: 'flex', gap: 8, marginBottom: 6 }}>
                              <span style={{ ...badge(C.accent), flexShrink: 0 }}>{pi + 1}</span>
                              <div><div style={{ fontSize: 13, fontWeight: 500 }}>{p.title}</div><div style={{ fontSize: 12, color: C.textSec }}>{p.author}</div></div>
                            </div>
                          ))}
                        </div>
                      )}
                      {m.summary && (
                        <div>
                          <div style={{ fontSize: 12, fontWeight: 600, color: C.textSec, marginBottom: 8 }}>AI 摘要</div>
                          <div style={{ fontSize: 13, color: C.textSec, lineHeight: 1.9, whiteSpace: 'pre-wrap', background: C.bgCard, borderRadius: 8, padding: 14 }}>{m.summary}</div>
                        </div>
                      )}
                      {m.transcript && (
                        <details>
                          <summary style={{ fontSize: 12, fontWeight: 600, color: C.textSec, cursor: 'pointer', marginBottom: 8 }}>🎙️ 逐字稿 <span style={{ color: C.textMut, fontWeight: 400 }}>（點擊展開）</span></summary>
                          <div style={{ fontSize: 13, color: C.textSec, lineHeight: 1.9, whiteSpace: 'pre-wrap', background: C.bgCard, borderRadius: 8, padding: 14, marginTop: 8 }}>{m.transcript}</div>
                        </details>
                      )}
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ─── PASSWORD GATE ───────────────────────────────────────────────────────────
    function PasswordGate({ projectTitle, onAuth }) {
      const [input, setInput] = useState('');
      const [error, setError] = useState(false);

      const attempt = (correctPw) => {
        if (input.trim() === correctPw) { onAuth(); }
        else { setError(true); setInput(''); setTimeout(() => setError(false), 1500); }
      };

      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
          <div style={{ marginBottom: 32, textAlign: 'center' }}>
            <div style={{ fontSize: 40, marginBottom: 12 }}>🔒</div>
            <div style={{ fontSize: 20, fontWeight: 700, color: C.text }}>{projectTitle || '此專案'}</div>
            <div style={{ fontSize: 13, color: C.textSec, marginTop: 6 }}>請輸入密碼以進入</div>
          </div>
          <div style={{ width: '100%', maxWidth: 360 }}>
            <input
              style={{ ...S.input, marginBottom: 12, border: `1px solid ${error ? C.danger : C.border}`, textAlign: 'center', fontSize: 16, letterSpacing: '0.1em' }}
              type="password" placeholder="輸入密碼"
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && attempt(e.currentTarget.dataset.pw)}
              autoFocus
            />
            {error && <div style={{ textAlign: 'center', color: C.danger, fontSize: 13, marginBottom: 10 }}>密碼錯誤，請再試一次</div>}
            <PasswordGateButton input={input} onAttempt={attempt} />
          </div>
        </div>
      );
    }

    // Helper to pass correct password into the button without re-fetching
    function PasswordGateInner({ projectId, projectTitle, onAuth }) {
      const [pw, setPw] = useState(null);
      const [input, setInput] = useState('');
      const [error, setError] = useState(false);

      useEffect(() => {
        db(`projects?id=eq.${projectId}&select=password,title`).then(r => r.json()).then(d => {
          setPw(d[0]?.password || '');
          if (!d[0]?.password) onAuth(); // no password, auto-pass
        }).catch(() => setPw(''));
      }, [projectId]);

      if (pw === null) return (
        <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', color: C.textSec, fontSize: 14 }}>
          <Spinner /> <span style={{ marginLeft: 10 }}>載入中…</span>
        </div>
      );

      const attempt = () => {
        if (input.trim() === pw) { sessionStorage.setItem(`mk_auth_${projectId}`, '1'); onAuth(); }
        else { setError(true); setInput(''); setTimeout(() => setError(false), 1500); }
      };

      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
          <div style={{ marginBottom: 32, textAlign: 'center' }}>
            <div style={{ fontSize: 40, marginBottom: 12 }}>🔒</div>
            <div style={{ fontSize: 20, fontWeight: 700, color: C.text }}>{projectTitle || '此專案'}</div>
            <div style={{ fontSize: 13, color: C.textSec, marginTop: 6 }}>請輸入密碼以進入</div>
          </div>
          <div style={{ width: '100%', maxWidth: 360 }}>
            <input
              style={{ ...S.input, marginBottom: 12, border: `1px solid ${error ? C.danger : C.border}`, textAlign: 'center', fontSize: 16, letterSpacing: '0.1em' }}
              type="password" placeholder="輸入密碼"
              value={input} onChange={e => setInput(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && attempt()}
              autoFocus
            />
            {error && <div style={{ textAlign: 'center', color: C.danger, fontSize: 13, marginBottom: 10 }}>密碼錯誤，請再試一次</div>}
            <button style={{ ...btn('primary'), width: '100%', padding: 13 }} onClick={attempt}>進入專案</button>
          </div>
        </div>
      );
    }

    // ─── APP ROOT ────────────────────────────────────────────────────────────────
    function App() {
      const [projectId, setProjectId] = useState(() => new URLSearchParams(window.location.search).get('p'));
      const [projectTitle, setProjectTitle] = useState('未命名專案');
      const [meetingDate, setMeetingDate] = useState('');
      const [meetingTime, setMeetingTime] = useState('');
      const [authed,    setAuthed]    = useState(false);
      const [phase,     setPhase]     = useState(0);
      const [proposals, setProposals] = useState([]);
      const [audioBlob, setAudioBlob] = useState(null);
      const [syncOk,    setSyncOk]    = useState(true);
      const [journal,   setJournal]   = useState([]);

      useEffect(() => {
        if (!projectId) return;
        // Check session auth
        if (sessionStorage.getItem(`mk_auth_${projectId}`)) setAuthed(true);
        // Load journal
        try { setJournal(JSON.parse(localStorage.getItem(`mk_journal_${projectId}`) || '[]')); } catch {}
        // Load project info
        db(`projects?id=eq.${projectId}&select=title,meeting_date,meeting_time`).then(r => r.json()).then(d => {
          if (d[0]?.title) setProjectTitle(d[0].title);
          if (d[0]?.meeting_date) setMeetingDate(d[0].meeting_date);
          if (d[0]?.meeting_time) setMeetingTime(d[0].meeting_time);
        }).catch(() => {});
      }, [projectId]);

      const enterProject = (id) => {
        setProjectId(id);
        setAuthed(false);
        window.history.pushState({}, '', `?p=${id}`);
      };

      const saveToJournal = ({ proposals, transcript, summary }) => {
        const entry = {
          id: Date.now(),
          date: new Date().toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric' }),
          proposals: proposals.map(p => ({ title: p.title, author: p.author, content: p.content })),
          transcript, summary, savedAt: new Date().toISOString(),
        };
        const updated = [...journal, entry];
        setJournal(updated);
        localStorage.setItem(`mk_journal_${projectId}`, JSON.stringify(updated));
        setPhase(3);
      };

      if (!projectId) return <Home onEnter={enterProject} />;
      if (!authed) return <PasswordGateInner projectId={projectId} projectTitle={projectTitle} onAuth={() => setAuthed(true)} />;

      return (
        <div>
          <Header
            phase={phase} setPhase={setPhase} syncOk={syncOk}
            journalCount={journal.length}
            projectId={projectId} projectTitle={projectTitle}
            onTitleSave={setProjectTitle}
          />
          {phase === 0 && <PreMeeting projectId={projectId} proposals={proposals} setProposals={setProposals} setSyncOk={setSyncOk} journal={journal} projectTitle={projectTitle} meetingDate={meetingDate} setMeetingDate={setMeetingDate} meetingTime={meetingTime} setMeetingTime={setMeetingTime} />}
          {phase === 1 && <Meeting proposals={proposals} audioBlob={audioBlob} setAudioBlob={setAudioBlob} />}
          {phase === 2 && <PostMeeting proposals={proposals} audioBlob={audioBlob} onSaveJournal={saveToJournal} />}
          {phase === 3 && <Journal journal={journal} setJournal={setJournal} projectId={projectId} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
